# CI-only overlay (spec-0005). Mounts the actions/cache-restored Mojang server jar
# into the itzg `/data` at the exact name install-vanilla looks for
# (minecraft_server.<version>.jar), so the pinned VANILLA delve server skips the
# 56 MB download on a cache hit. Caching for our own CI runs is not redistribution
# and the jar is never baked/published (ADR-0010).
#
# Applied only in CI:  docker compose -f validation/compose.yaml \
#                        -f validation/compose.ci-cache.yaml --profile validate up ...
# Never used for local dev or prod. The version in the path is the versions.toml pin
# (checked by check-versions.sh). Only the VANILLA `server` is covered here; the
# FABRIC toolserver fetches its MC jar via the Fabric launcher (a different path).
services:
  server:
    volumes:
      - ./.jar-cache/minecraft_server.1.21.11.jar:/data/minecraft_server.1.21.11.jar:ro
