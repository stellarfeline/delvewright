# Worker isolation override (CLAUDE.md / validation/mutex.sh "Worker isolation").
# Drops the pinned container_name and the 127.0.0.1:25565 host binding so a
# worker stack can never collide with — or be torn down together with — the
# owner's session. Compose derives a project-scoped name instead.
#
# EVERY service in compose.yaml that pins a container_name or publishes a port
# must appear here: container names and host ports are Docker-GLOBAL, so `-p
# dw-worker-<x>` isolates volumes and networks but not those. A service missing
# from this file is a collision waiting for the second worker — the `bot` omission
# below cost the-drowned-bell round 2 a run (same class as the `server` fix, #190).
# `tools/check-worker-override.py` now enforces the coverage in CI so the next
# service added to compose.yaml cannot repeat it.
services:
  server:
    container_name: !reset null
    ports: !reset []
  playtest:
    container_name: !reset null
    ports: !reset []
  bot:
    container_name: !reset null
  packtest:
    container_name: !reset null
