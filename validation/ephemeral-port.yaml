# An EPHEMERAL loopback port, for the flows that drive a bot from the HOST.
#
# `playtest-note-flow.sh` and `rehearsal-flow.sh` run their mineflayer bot as a
# host process (not as a compose service), so they need a reachable address —
# but a FIXED one would re-create exactly what compose-project isolation removed:
# two of them, or one of them beside the owner's session, contending for a single
# number.
#
# `127.0.0.1::25565` publishes the container's 25565 on a free host port Docker
# chooses. Read it back per project, never assume it:
#
#   port="$(docker compose -p "$PROJ" -f validation/compose.yaml \
#             -f validation/ephemeral-port.yaml --profile playtest \
#             port playtest 25565)"      # -> 127.0.0.1:49173
#
# Never add a fixed host port here — `tools/check-compose-isolation.py` fails on
# one, because a fixed port in a file every flow includes is a shared resource
# again by another name.
services:
  server:
    ports:
      - "127.0.0.1::25565"
  playtest:
    ports:
      - "127.0.0.1::25565"
