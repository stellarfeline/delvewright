# Delvewright validation compose (spec-0003, ADR-0005 / ADR-0008 / ADR-0010).
#
# Three profiles, all driven by ONE compiler build output tree at
# `./delve-output` (produced by `delvec build <campaign> -o validation/delve-output`;
# gitignored). Build it first, then pick a profile:
#
#   delvec build crates/dsl/fixtures/valid/hello-world -o validation/delve-output
#
#   # bot playthrough (the M1 proof) — server + mineflayer bot, exit code = bot result:
#   validation/bot-run.sh --project dw-<yours>
#
#   # PackTest suite — Fabric + PackTest, headless, exit code = number of failed tests:
#   validation/packtest-run.sh --project dw-<yours>
#
#   # owner hand-check — join the shipped delve image from a vanilla client.
#   # This is the ONE path that binds host 25565, and it needs owner-play.yaml:
#   EULA=TRUE docker compose -f validation/compose.yaml -f validation/owner-play.yaml \
#       --profile play up
#
# ## Isolation by construction
#
# NOTHING in this file is Docker-GLOBAL: no service pins a `container_name` and no
# service publishes a host port. Container names and host ports are the only two
# things `docker compose -p <project>` does NOT isolate, so keeping them out of
# here is what makes two ladders on one host independent rather than serialized.
# Names come from the compose project; workers reach the server over the compose
# network or with `docker exec <id> rcon-cli`, never through localhost.
#
# The rule has a machine gate — `tools/check-compose-isolation.py` (CI) fails on a
# `container_name:` or `ports:` re-entering this file. Two files may add them
# back, both by name:
#
#   * `owner-play.yaml`     — the owner's fixed `127.0.0.1:25565` binding plus the
#     pinned `delvewright-server` / `delvewright-playtest` names. The ONLY file in
#     the repo allowed to publish 25565 (with `tools/playtest-server.sh`).
#   * `ephemeral-port.yaml` — an EPHEMERAL loopback port, for the flows that must
#     drive a host-side bot (`playtest-note-flow.sh`, `rehearsal-flow.sh`). Docker
#     picks the number; two of them can never collide.
#
# Before this, the pinned name + fixed port made every caller aim at the same
# container, so the whole stack was guarded by a mutex and worker ladders queued
# on each other (an island worker waited 30+ minutes behind a holder that had zero
# containers running). `validation/mutex.sh` now guards only 25565 itself.
#
# The two runtime validators are split into the `validate` (bot) and `packtest`
# profiles so each propagates a single clean exit code (ADR-0008 CI contract);
# together they are ADR-0005's dynamic layer. The `server` used by `play` and
# `validate` is the SHIPPED delve image (ADR-0010, Dockerfile.delve) — what the bot
# completes is exactly what the owner joins. The `packtest` runner is a separate
# tooling server with the PackTest + Fabric overlay that NEVER touches the delve
# image (ADR-0003 / spec-0003 criterion); it boots the SAME world as the shipped
# delve — same build output, same world-settings entrypoint (see the service) — so
# the mod overlay is the only difference between them.
#
# EULA: acceptance is the owner's action, never ours — read from the environment,
# NEVER hardcoded TRUE (ADR-0010). The itzg base downloads the pinned jar at run
# time; it is never baked into a published layer.

services:
  # The shipped delve: pinned vanilla 1.21.11 + compiled datapack + config, built
  # from the compiler output by Dockerfile.delve (ADR-0010). Same image for the
  # owner's hand-check and the bot playthrough.
  server:
    profiles: ["play", "validate"]
    build:
      # WHICH build output tree this ladder boots. `DELVE_OUTPUT` used to select the
      # tree for the `packtest` profile only, so `bot-run.sh --output <tree>` set a
      # variable nothing on this path read and the bot ladder silently booted
      # `./delve-output` whatever was asked for — a flag that does nothing is worse
      # than a missing one, because the caller believes it. Same default, so an
      # invocation that names no tree is unchanged.
      context: ${DELVE_OUTPUT:-./delve-output}
      # Relative to the CONTEXT, so a build tree outside `validation/` cannot
      # resolve it — the failure is `failed to read dockerfile: open
      # Dockerfile.delve`, which reads as a missing file rather than as a
      # tree in the wrong place. The entry scripts export an absolute path;
      # the default keeps a bare `docker compose` on the default tree working.
      dockerfile: ${DELVE_DOCKERFILE:-../Dockerfile.delve}
    # …and the TAG follows the tree, for the same reason the compose project
    # follows the ladder: an image tag is global to the daemon, so two ladders
    # building different trees into one tag race, and the loser boots the other's
    # delve. `bot-run.sh` sets it per project; the bare default is unchanged.
    image: ${DELVE_IMAGE:-delvewright/delve:local}
    environment:
      # Never TRUE in this file — the owner must set EULA=TRUE in their environment.
      EULA: ${EULA:?set EULA=TRUE in your environment to accept Mojang's EULA (https://aka.ms/MinecraftEULA)}
      # Offline for frictionless local play/CI; override ONLINE_MODE=TRUE to join
      # with a real Microsoft account (spec-0003 auth-mode note).
      ONLINE_MODE: ${ONLINE_MODE:-FALSE}
      # spec-0023: the validation bot is opped so the harness can run the two
      # commands its combat proofs are made of — `/damage @s` for a scripted death
      # (the die-retry stage) and `/effect give @s minecraft:resistance` for a
      # bounded combat-assist window. Both are HARNESS actions, applied and removed
      # by the harness and named in the run report; no delve content can reach
      # them, and the shipped image is untouched (this is a compose env var, not a
      # baked layer). The `play` profile shares this service, where the name simply
      # matches nobody.
      #
      # NOT itzg's `OPS`: that resolves every name through Mojang's PlayerDB even
      # with ONLINE_MODE=FALSE, and the bot's offline-only name aborts the boot
      # ("Could not resolve user from Playerdb"). The shared world-settings
      # entrypoint seeds /data/ops.json itself with the deterministic offline
      # UUID, so the name never reaches the network.
      DELVE_OPS_OFFLINE: ${DELVEWRIGHT_BOT_USERNAME:-delve-bot}
    volumes:
      # Name the itzg `/data` world volume so `docker compose down -v` actually
      # clears it. The itzg base declares an anonymous `VOLUME /data`; anonymous
      # volumes survive `down -v`, so a stale world (old datapack/seed/lang)
      # silently persists across runs. A NAMED volume is removed by `down -v`,
      # giving every fresh run a clean world.
      - server-data:/data
    # No `ports:` — see the isolation note in the header. The bot reaches this
    # service over the internal compose network; a worker that needs a shell into
    # it uses `docker exec $(docker compose -p <proj> ps -q server) rcon-cli`. The
    # owner's `localhost:25565` binding is added by `owner-play.yaml`.

  # Creator playtest (spec-0006): the SAME shipped delve image as `play`, plus the
  # creator overlay mounted as an EXTRA datapack and the creator opped. The overlay
  # is NEVER baked into the delve image (ADR-0003 / spec-0006 exclusion, CI-checked)
  # — it is supplied only here, at runtime, as a read-only volume added to DATAPACKS.
  # One command, localhost only, offline by default; mirrors `play` otherwise.
  #
  #   delvec build crates/dsl/fixtures/valid/hello-world -o validation/delve-output
  #   EULA=TRUE CREATOR_NAME=<your-mc-name> \
  #     docker compose -f validation/compose.yaml -f validation/owner-play.yaml \
  #       --profile playtest up --build
  #
  # `owner-play.yaml` is what makes it joinable at localhost:25565 — this service,
  # like every other one here, publishes nothing on its own.
  #
  # Then join at localhost:25565, `/trigger dw.note` to mark a spot, and type your
  # note in chat. After the session, run `delve-harvest` over the captured server
  # log + `delve-output/creator-datapack/layout.json` (see validation/README.md).
  playtest:
    profiles: ["playtest"]
    build:
      context: ./delve-output
      # Relative to the CONTEXT, so a build tree outside `validation/` cannot
      # resolve it — the failure is `failed to read dockerfile: open
      # Dockerfile.delve`, which reads as a missing file rather than as a
      # tree in the wrong place. The entry scripts export an absolute path;
      # the default keeps a bare `docker compose` on the default tree working.
      dockerfile: ${DELVE_DOCKERFILE:-../Dockerfile.delve}
    image: delvewright/delve:local
    environment:
      EULA: ${EULA:?set EULA=TRUE in your environment to accept Mojang's EULA (https://aka.ms/MinecraftEULA)}
      ONLINE_MODE: ${ONLINE_MODE:-FALSE}
      # The overlay rides alongside the baked datapack. itzg copies each DATAPACKS
      # entry into the world's datapacks folder on boot (same mechanism the packtest
      # profile uses). `/delve/datapack` is baked; `/delve/creator-overlay` is the
      # runtime-only mount below.
      DATAPACKS: "/delve/datapack,/delve/creator-overlay"
      # Op the creator so they can /tp and inspect. Empty (no op) if CREATOR_NAME is
      # unset — `/trigger dw.note` itself needs no op (the overlay enables it each
      # tick), so the note flow works opped or not.
      OPS: ${CREATOR_NAME:-}
    volumes:
      # Named world volume so `down -v` clears it (see `server` note above).
      - playtest-data:/data
      # The creator overlay, supplied ONLY at playtest time (never in the image).
      - ./delve-output/creator-datapack:/delve/creator-overlay:ro
    # No `ports:` — `owner-play.yaml` publishes 25565 for the owner's session, and
    # `ephemeral-port.yaml` publishes an arbitrary free loopback port for the two
    # note/rehearsal flows that drive a bot from the host.

  # The mineflayer harness (spec-0003). Reads the same build's critical-path.json,
  # drives the run, exits 0/1 — propagated as the compose/CI exit code.
  bot:
    profiles: ["validate"]
    build: ../harness
    depends_on:
      server:
        condition: service_healthy   # itzg base ships a healthcheck
    environment:
      DELVEWRIGHT_MC_HOST: server    # internal compose DNS, not localhost
      DELVEWRIGHT_MC_PORT: "25565"
      DELVEWRIGHT_MC_VERSION: "1.21.11"
      DELVEWRIGHT_MC_AUTH: offline
      # Must match the server's DELVE_OPS_OFFLINE seed above, or the harness's
      # assist and scripted-death commands are silently refused and every combat
      # proof degrades into an ordinary fight.
      DELVEWRIGHT_BOT_USERNAME: ${DELVEWRIGHT_BOT_USERNAME:-delve-bot}
      # spec-0023 run artifact. Unset it to keep the pre-spec-0023 stderr-only run.
      DELVEWRIGHT_RUN_REPORT: /delve/run-out/run-report.json
      # The die-retry stage is ON whenever the build carries a combat plan; `0`
      # skips it for local iteration, and the report records that it was skipped.
      DELVEWRIGHT_DIE_RETRY: ${DELVEWRIGHT_DIE_RETRY:-1}
      # The whole-run wall-clock budget, FORWARDED rather than fixed: the die-retry
      # stage adds a respawn, a re-arm and a walk back to every fight, so a souls
      # delve routinely needs more than the harness default — and without this line
      # `DELVEWRIGHT_RUN_TIMEOUT_MS=… docker compose …` was silently dropped at the
      # container boundary, leaving no way to raise it short of editing this
      # file. The default here is src/run.ts's own default (20 min),
      # unchanged; compose only makes it overridable.
      DELVEWRIGHT_RUN_TIMEOUT_MS: ${DELVEWRIGHT_RUN_TIMEOUT_MS:-1200000}
      # spec-0025 branch tier. `DELVEWRIGHT_BRANCHES` is which branches this run is
      # ANSWERABLE for — `all` (release tier, the default), a comma-separated list
      # of branch ids, or `from-diff` (the PR tier; refuses, see docs). Every branch
      # it names but does not walk is listed in the run report with the reason, so a
      # skipped branch can never read as a covered one. `DELVEWRIGHT_BRANCH` is
      # which single branch THIS session walks: party progress only moves forward,
      # so a second branch needs a second world, and `validation/branch-runs.sh` is
      # the loop that gives each one a fresh server. Both unset (the default) = the
      # ordinary single-path run, unchanged.
      DELVEWRIGHT_BRANCHES: ${DELVEWRIGHT_BRANCHES:-all}
      DELVEWRIGHT_BRANCH: ${DELVEWRIGHT_BRANCH:-}
      # The death-loop stage: walk into every declared lethal volume,
      # die there, and assert the wording, the `on_death` forfeit, the recovery
      # stake's placement, its collection and the respawn seat. ON whenever the
      # build ships `validation/death-plan.json`; `0` skips it for local iteration
      # and the report records that it was skipped, never that it passed.
      DELVEWRIGHT_DEATH_LOOP: ${DELVEWRIGHT_DEATH_LOOP:-1}
      # The four `src/` reads a ladder must be able to set: `bot-run.sh`'s header
      # promises that "every environment variable src/run.ts reads is forwarded by
      # the compose file", and these four are part of that promise. Each keeps its
      # own default from the module that reads it, so naming them here changes no
      # run that does not set them.
      #
      #   * DELVEWRIGHT_ACTOR_FLOOR   — skip the tiered-actor engagements (run.ts)
      #   * DELVEWRIGHT_RETRY_ON_DEATH — resume once after an UNSCRIPTED death (run.ts)
      #   * DELVEWRIGHT_CUTSCENE_GRACE_MS / _ENTITY_SETTLE_TIMEOUT_MS — the two
      #     executor waits a slow runner has to be able to lengthen (executor.ts)
      #
      # Written with `:-` and no value so an unset variable stays unset inside the
      # container rather than becoming an empty string: `DELVEWRIGHT_ACTOR_FLOOR=""`
      # is not `"0"`, but an empty `_TIMEOUT_MS` is parsed, and the modules that read
      # them already treat absent and empty alike. Compose's `VAR:` short form (no
      # value at all) is what actually omits the key when the host has not set it.
      DELVEWRIGHT_ACTOR_FLOOR:
      DELVEWRIGHT_RETRY_ON_DEATH:
      DELVEWRIGHT_CUTSCENE_GRACE_MS:
      DELVEWRIGHT_ENTITY_SETTLE_TIMEOUT_MS:
    volumes:
      - ${DELVE_OUTPUT:-./delve-output}/critical-path.json:/delve/critical-path.json:ro
      # The compiler-proven per-leg waypoint artifact
      # (validation/critical-path-waypoints.json). The harness discovers it at
      # `<dir-of-critical-path.json>/validation/…` and navigates leg-by-leg so no
      # single distant A* solve strands the bot on a large open cave. Validation
      # metadata only (never in the shipped delve image); absent → single-goal
      # fallback, so the mount is harmless for a campaign that emits none.
      - ${DELVE_OUTPUT:-./delve-output}/validation:/delve/validation:ro
      # spec-0023: the run report the bot writes (stage results, every combat-assist
      # window with its ticks, every scripted death of the die-retry stage, and the
      # inverted floor gate's findings). Writable, unlike the read-only build mounts
      # above — this is the run's own artifact, not the build's.
      #
      # `DW_BOT_OUT` scopes it per ladder: two concurrent runs from ONE checkout
      # share this host path, and the second would overwrite the first's report
      # (the same collision class as a shared container name, one layer up).
      # `validation/bot-run.sh` and `branch-runs.sh` set it to `./run-out/<project>`;
      # the bare default is unchanged.
      - ${DW_BOT_OUT:-./run-out}:/delve/run-out
    command: ["/delve/critical-path.json"]

  # PackTest runner (spec-0003 PackTest tier): the delvewright-toolserver image
  # (ADR-0003 tooling-only), which PRE-BAKES Fabric loader + Fabric API + PackTest
  # and `-Dpacktest.auto` — so there is NO per-run Modrinth fetch and NO Docker Hub
  # pull (spec-0005). Runs both datapacks headlessly, exit code = failed tests.
  #
  # Pinned by immutable digest (spec-0005); republish via
  # infra-images.yml (owner runs workflow_dispatch — local push lacks write:packages),
  # then a follow-up PR repins this to
  #   ghcr.io/stellarfeline/delvewright-toolserver@sha256:<digest>
  # and records the digest in versions.toml ([images.toolserver].digest, now TBD).
  # `DELVE_OUTPUT` (default `./delve-output`) selects WHICH build output tree this
  # runner boots. A campaign only exercises the generated templates it actually
  # emits, so proving a template class needs a campaign that HAS one: spec-0020's
  # cast-ledger templates (root swap, bark delivery, explicit-none) cannot exist in
  # hello-world, which is one quest and one NPC. Rather than distort hello-world —
  # bumping it to dsl 0.7.0 would churn a fixture many determinism tests pin — CI
  # runs this profile a second time over a second build tree, in its own compose
  # project. There is no `container_name` and so no `PACKTEST_CONTAINER` to keep in
  # step with it any more: the project name is the only name there is,
  # and `validation/packtest-run.sh --project <id> --output <tree>` demands both in
  # one place.
  packtest:
    profiles: ["packtest"]
    image: ghcr.io/stellarfeline/delvewright-toolserver@sha256:31ed5d5a5c50158470bfee8c7197a75e6f586a25c950bf25b69b533f88e0ba0b
    environment:
      EULA: ${EULA:?set EULA=TRUE in your environment to accept Mojang's EULA (https://aka.ms/MinecraftEULA)}
      ONLINE_MODE: "FALSE"
      # TYPE=FABRIC, the Fabric loader, MODS (pre-baked jars) and JVM_OPTS
      # (-Dpacktest.auto) are baked into the toolserver image; only the world
      # settings + datapack mounts (which mirror the shipped delve) live here.
      # itzg copies these directories into the world's datapacks folder on boot.
      DATAPACKS: "/packs/datapack,/packs/packtest-datapack"
      # World settings: the campaign-varying ones (difficulty, seed, level-type,
      # generator-settings) are DERIVED from the build's server/server.properties by
      # the entrypoint below — the same script the shipped delve image bakes — so
      # PackTest always runs the world the delve ships (void superflat for a normal
      # delve, ocean superflat for a `horizon: ocean` campaign). Hardcoding them here
      # made ocean campaigns test a world that never ships. The non-varying ones
      # mirror Dockerfile.delve's ENV so the rest
      # of the world matches too — notably spawn-monsters=false, which matters now
      # that a wave campaign's derived difficulty is `easy`, not `peaceful`.
      DELVE_SERVER_PROPERTIES: "/packs/server/server.properties"
      # Pin the Fabric LAUNCHER (installer) version, not just the loader.
      # itzg defaults FABRIC_LAUNCHER_VERSION to `LATEST`, and resolving "latest"
      # means asking meta.fabricmc.net — on EVERY boot, even though the toolserver
      # image already bakes that exact launcher. Naming the baked version turns the
      # resolution into a local manifest match ("Fabric launcher for minecraft
      # 1.21.11 loader 0.19.3 is already available") and removes one live host from
      # each of the six PackTest boots. The value is versions.toml's
      # [fabric].launcher_version; check-versions.sh binds the two, and
      # server-bootstrap-cache.sh asserts it against the pinned image's own
      # .fabric-manifest.json, so a republished toolserver cannot silently
      # re-introduce the fetch.
      FABRIC_LAUNCHER_VERSION: "1.1.2"
      MODE: "adventure"
      FORCE_GAMEMODE: "true"
      GENERATE_STRUCTURES: "false"
      SPAWN_MONSTERS: "false"
      SPAWN_PROTECTION: "0"
      ALLOW_NETHER: "false"
      PVP: "false"
    # Same derivation as the shipped image (Dockerfile.delve bakes a byte-identical
    # copy of this script; validation/check-world-settings.sh fails CI on drift).
    # It exports the compiler's world settings, then execs itzg's entrypoint, and
    # HARD-FAILS if the build's server.properties is not mounted — a missing file
    # can never silently downgrade the runner to some other world.
    entrypoint: ["/bin/bash", "/packs/world-settings-entrypoint.sh"]
    volumes:
      # Named world volume so `down -v` clears it (see `server` note above) — the
      # PackTest runner regenerates the world from the mounted datapacks each run.
      - packtest-data:/data
      - ${DELVE_OUTPUT:-./delve-output}/datapack:/packs/datapack:ro
      - ${DELVE_OUTPUT:-./delve-output}/packtest-datapack:/packs/packtest-datapack:ro
      # The compiler's world declaration + the shared derivation script (read-only).
      - ${DELVE_OUTPUT:-./delve-output}/server:/packs/server:ro
      - ./world-settings-entrypoint.sh:/packs/world-settings-entrypoint.sh:ro
      # The server-bootstrap overlay: the pinned Mojang jar plus the
      # Fabric launch jar and its Class-Path, fetched and sha256-verified ONCE per
      # job by validation/server-bootstrap-cache.sh. `packtest-run.sh` COPIES this
      # into the world volume before the server starts — a copy, never a mount of
      # the jar itself, because itzg and Fabric both replace the jar by RENAME and a
      # rename cannot target a bind-mounted file (the "Device or resource busy" that
      # killed the 2026-07-30 jar cache; see the note in ci.yml). Read-only and
      # never baked into a layer, so ADR-0010's EULA boundary is untouched. Empty
      # (a local checkout that never ran the script) = the ordinary live bootstrap.
      - ${DW_SERVER_CACHE:-./server-cache}:/seed:ro

# Named world volumes for the itzg `/data` mounts above. Declared so
# `docker compose -f validation/compose.yaml down -v` removes them — otherwise the
# itzg base's anonymous `/data` volume persists a stale world between runs (wrong
# datapack/seed/language). Fresh runs should still prefer
# `up --renew-anon-volumes --force-recreate` for belt-and-braces isolation.
volumes:
  server-data:
  playtest-data:
  packtest-data:
