[package]
# The compiler LIBRARY: `delvewright-compiler`, library target `delvewright_compiler`
# (the name every `use delvewright_compiler::…` path in the tree already spells).
# The executable that mounts it is the `delvec` crate (crates/delvec, ADR-0023
# §3); nothing here is a `[[bin]]`.
name = "delvewright-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Delvewright compiler library: staged campaign documents in, a deterministic Minecraft adventure-map datapack out — the engine behind the delvec binary."
readme = "README.md"
keywords = ["minecraft", "datapack", "compiler", "adventure"]
categories = ["game-development"]
# `cargo package` ships everything git tracks unless excluded. `tests/` holds the
# two node tests of the viewer page, which no `cargo install` runs; `data/` is
# NOT excludable — src/registry.rs `include_str!`s it.
exclude = ["tests/"]

[lib]
name = "delvewright_compiler"
path = "src/lib.rs"

[dependencies]
delvewright-dsl.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The CPU render arms are declared here as a clap `Subcommand` (`view::cli`) and
# mounted by the `delvec` crate.
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"

# `walk-record.json` is the one document a campaign author writes by hand that
# is not a stage document, so it has no `Stage` and cannot reach
# `delvewright_dsl::schema`. It gets its schema derived from its own struct
# here instead — the same crate the rest of the DSL's schemas come from, so
# there is no second schema generator and no hand-written copy of the form.
# MIT.
schemars = "1"

# The compiler parses each structure's NBT to derive placement-sentinel blocks
# (runtime verification that `place template` landed — far freshly-forceloaded
# chunks are not reliably loaded in the same tick, so placement is retried
# until sentinels verify).
#
# `flate2` is required because Minecraft structure `.nbt` files are gzip-framed
# NBT and neither fastnbt nor valence_nbt provides the gzip container. flate2's
# GzEncoder writes a zero mtime, so the output is deterministic (ADR-0006).
# MIT/Apache-2.0.
fastnbt = "2"
flate2 = "1"

# `crc32fast` supplies the CRC-32 the per-delve NPC-skin resource pack zip needs
# (spec-0009 bake). The zip is hand-written with the STORE method and fixed zero
# timestamps so its bytes — and thus its sha1 — are deterministic (ADR-0006).
# MIT/Apache-2.0.
crc32fast = "1"

# The CPU render arms (`viewer`, `scene`, `panorama`, `contact-sheet`, `index`)
# decode and composite PNGs: block textures out of the client jar for the
# derived colour table, and the contact sheet's tiled and labelled cells.
# Default features carry every decoder the crate has; the render surface reads
# and writes PNG only, so the rest is turned off rather than shipped.
# MIT/Apache-2.0.
image = { version = "0.24", default-features = false, features = ["png"] }

# The client jar is a zip, and `view::assets` reads block textures straight out
# of it — the jar is a creator prerequisite, never redistributed (ADR-0010).
# `deflate` only: the jar uses no other method. MIT.
zip = { version = "2", default-features = false, features = ["deflate"] }
