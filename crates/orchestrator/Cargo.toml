[package]
name = "delvewright-orchestrator"
version = "0.0.0"
edition = "2024"
publish = false

# `delve-harvest` (spec-0006 M2): parse a playtest server log + the creator
# overlay's layout manifest into a versioned `playtest-report.json`. The
# orchestrator's first real job (ADR-0012 thin-glue role).
[[bin]]
name = "delve-harvest"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
