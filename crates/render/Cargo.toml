# Its OWN workspace, excluded from the repo root's (see the note beside
# `exclude` in /Cargo.toml). This crate is the only one in the repo with a git
# dependency, a git dependency is cloned during RESOLUTION rather than during the
# build of whatever uses it, and a workspace resolves all of its members — so as a
# member of the root workspace this crate's 227 MB Nucleation clone was a
# precondition for every `cargo` command in the repo, including the `cargo run -p
# delvec` steps of four required CI jobs that never build it. It is quarantined
# here so that reach belongs to the one crate that needs it.
#
# Nothing about the crate's own build changes: `cargo … --manifest-path
# crates/render/Cargo.toml` fmt/clippy/tests it exactly as `--workspace` did, and
# the `rust` CI job runs all three.
[workspace]

# The root workspace's rationale for this profile applies verbatim (see
# /Cargo.toml): a separate workspace does not inherit it, and an `opt-level = 0`
# `delve-render` reads as a hang rather than as a wrong profile.
#
# `debug` is here on the same argument and on its own measurement, because a
# separate workspace does not inherit that either: cold `cargo test --offline
# --manifest-path crates/render/Cargo.toml --no-run` costs 731.0s CPU at cargo's
# default full DWARF and 597.4s here (-18.3%), with `target/` 3.10 -> 2.16 GiB.
# Two jobs build this crate under a dev profile — the `rust` job's render steps
# and `gpu-probe` — and both are where that lands.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[package]
name = "delvewright-render"
version = "0.0.0"
edition = "2024"
publish = false

# `delve-render` (spec-0007 rendering infra / spec-0003 visual tier, M3): the
# deterministic render layer. Per-prefab multi-angle sets + the newest-block
# fidelity gate via Nucleation (headless wgpu), and Chunky scene emission from the
# compiler's render-plan.json. Productionizes the spike-render-fidelity spike.
[[bin]]
name = "delve-render"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Structure `.nbt` is gzip-framed Java NBT (same stack the compiler/schem use).
# `fastnbt` reads the NBT; `flate2` supplies the gzip container (mtime pinned to 0
# for byte-determinism, ADR-0006). Both MIT/Apache-2.0.
fastnbt = "2"
flate2 = "1"

# The tile-set manifest contract (`delvewright_schem::split`). A zone past the
# 48-per-axis structure-template cap ships as several `.nbt` files plus one
# manifest, and an author must still review ONE scene — so the renderer
# reassembles from that manifest. It reads the same struct the exporter writes
# rather than a private copy of the shape, which is the whole reason the
# definition lives in the crate that owns tiling. Adds no new external
# dependency: schem's are a subset of the ones above.
delvewright-schem = { path = "../schem" }

# The metrics standard (spec-0049 §2) — one definition of the player's own
# geometry for the whole workspace. This crate's eye height used to be a literal
# whose doc comment said it was "the same 1.62 the compiler's player-POV cameras
# stand at", which is an intention rather than a binding: a review render that
# framed a different eye from the one the navigation model proves standability
# for would be photographing a body nobody plays, and nothing anywhere could have
# gone red about it. Adds no new external dependency and no new resolution reach
# — `delvewright-dsl` is already under both `delvewright-schem` and `delvec`.
delvewright-dsl = { path = "../dsl" }

# The CPU render surface lives in `delvec` (ADR-0021 §1): the structure reader,
# the prefab-metadata projection and the shared `DW072x`/`DW079x` catalog are
# ONE definition, and this crate names it rather than keeping a second copy on
# the far side of the shelf split. The edge points this way and never back —
# `delvec` must stay free of `nucleation`, whose C build script would red the
# static-musl shelf targets, so nothing here is ever a dependency of that.
delvec = { path = "../compiler" }

# Save/compare rendered frames (fidelity color-key scan, double-render stability),
# and decode block textures for the derived colour table. MIT/Apache-2.0.
image = "0.25"

# Read the client jar / resource-pack zip directly. The viewer's colour
# derivation needs `data/.../worldgen/biome/*.json` for grass, foliage and water
# tint, which Nucleation's pack loader does not expose, and it needs perhaps a
# hundred entries rather than all 28,000 — so it reads by name, lazily. Already
# in the tree via Nucleation, so this adds no new transitive dependency.
# `default-features = false` + `deflate` matches how Nucleation already declares
# it, so the lock gains nothing: the defaults would add 29 crates of AES, bzip2,
# lzma and zstd codecs — plus three `-sys` C builds — for an archive that is
# plain deflate. MIT.
zip = { version = "8", default-features = false, features = ["deflate"] }

# Nucleation (MIT) — headless mesher + wgpu GPU renderer. Pinned by git REV
# because crates.io tops out at 0.8.0 which lacks the `rendering` feature; the
# `GpuRenderer` / `ResourcePackSource` API this crate uses lives on master (0.9.1).
# The rev is recorded in versions.toml `[render]` (checked by check-versions.sh).
# `pollster` blocks on the renderer's async init. Both MIT/Apache-2.0.
nucleation = { git = "https://github.com/Schem-at/Nucleation", rev = "dbc8fe02ce4ddac90a58423dd5d441d067e87baf", features = ["rendering"] }
pollster = "1.0"

[dev-dependencies]
# The contact-sheet tests build their own candidate renders (no GPU, no client
# jar) and read the composited page back. Same version the crate already links.
image = "0.25"
serde_json = "1"
