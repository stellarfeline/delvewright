[package]
name = "delvewright-dsl"
# This crate DEFINES the campaign format, so its package number IS the format's
# number: the `dsl_version` every document declares and `delvec fmt` writes.
# A format change bumps the minor; a Rust-API-only change bumps the patch.
# THIS LINE IS THE AUTHORITY. `DSL_VERSION` (src/envelope.rs) reads it through
# `env!("CARGO_PKG_VERSION")`, so no Rust source restates it;
# validation/check-versions.sh binds it to `[engine] dsl_crate_version` in
# versions.toml, together with the `=` requirement every engine crate declares
# on it, and `tools/lib/version_sites.py verify` refuses any other file that
# states this number without being derived from it, written by a tool, or
# allowlisted as a counter-example.
version = "0.24.0"
edition = "2024"
# The toolchain this repo actually builds and tests on (rust-toolchain.toml).
# Asserted equal to that pin by check-versions.sh: a `rust-version` looser than
# what anybody has run is an untested claim, and `cargo install` is where a
# stranger discovers it.
rust-version = "1.97.1"
description = "Staged JSON DSL types and schemas for Delvewright adventure-map campaigns — the format the delvec compiler reads."
license = "GPL-3.0-only"
repository = "https://github.com/stellarfeline/delvewright"
readme = "README.md"
keywords = ["minecraft", "datapack", "dsl", "adventure"]
categories = ["game-development"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Offline JSON Schema validation only; default features pull in a TLS/HTTP
# resolver tree we do not need (and whose transitive licenses we would rather
# avoid vendoring), so they are disabled.
[dev-dependencies]
jsonschema = { version = "0.49", default-features = false }
