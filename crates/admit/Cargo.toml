[package]
name = "delvewright-admit"
version = "0.0.0"
edition = "2024"
publish = false

# `delve-admit` (spec-0007, M3 asset pipeline — admission half): the machinery
# that turns an approved, converted `.nbt` candidate into a library-grade prefab
# and gates community contributions.
#
# - `audit`   — mechanical NBT block-palette allowlist + code-injection hard-forbid
#               (the CI gate for community prefabs).
# - `socket`  — declare/carve jigsaw sockets on a converted piece (+ metadata).
# - `anchor`  — add named anchors to prefab metadata.
# - `lighting`— static block-light probe -> declared lighting profile.
# - `catalog` — schema + validation for `catalog/<asset-id>.json` (+ license
#               allowlist, ADR-0013).
# - `gallery` — one command: candidate pieces -> browse world + note overlay;
#               `curate` harvests `dw.note` verdicts into a per-asset report.
[[bin]]
name = "delve-admit"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

# Vanilla structure templates are gzip-framed Java NBT; `fastnbt` reads/writes the
# NBT and `flate2` supplies the gzip container (mtime pinned to 0 for byte-identity,
# ADR-0006). Same deps + versions the schem/generator tooling already uses.
fastnbt = "2"
flate2 = "1"

# Reuse, don't duplicate: the schem crate owns the forbidden-block/entity set and
# the recursive command/spawner NBT scan (the audit checks the converted `.nbt`
# against the exact set the conversion strip enforces). The orchestrator owns the
# `dw.note` server-log harvester (the gallery emits a compatible layout so its
# notes round-trip through the same parser).
delvewright-schem = { path = "../schem" }

# The spatial contract has ONE checker (spec-0036 §1c) and this is its second
# door. A prefab nobody generated carries the same resolved contract block in its
# metadata that a grammar expansion writes, and it is judged by the same code
# over the same two inputs — otherwise "one checker, two doors" is two checkers
# that agree until they do not. Generation-time tooling only; nothing here ships
# in a delve (ADR-0003).
delvewright-grammar = { path = "../grammar" }
delvewright-orchestrator = { path = "../orchestrator" }

# The pinned 1.21.11 Brigadier command tree and its validator (`delvewright_
# compiler::commands`). `delve-admit` writes `.mcfunction` files into a datapack
# exactly as `delvec` does, so it is bound by exactly the same rule: a command
# line that the pinned server will not parse must never reach a world. The
# compiler owned that check because it was the first emitter to need it, and the
# gallery — the second — shipped four legacy camelCase gamerules and an
# out-of-range `text_opacity` byte that made 1.21.11 refuse `admit:load` and
# `admit:finish` outright. The capability belongs to the object class
# "an mcfunction this repo emits", not to `delvec`, so the second emitter reuses
# the ONE vendored tree rather than growing a private copy of the rule.
# (The package is `delvec` — ADR-0016 — while its library target keeps the
# `delvewright_compiler` name, so that is what `use` paths spell.)
delvec = { path = "../compiler" }

[dev-dependencies]
# The metadata-preservation test drives the admission steps over a REAL grammar
# export rather than a hand-written fixture. A fixture would be one more private
# copy of the prefab-metadata shape — the exact defect that test exists to
# catch — and it would go stale the first time a producer gained a field.
delvewright-grammar = { path = "../grammar" }
serde_json = "1"
