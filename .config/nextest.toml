slow-timeout = { period = "300s" }
priority = 60


[[profile.ci.overrides]]
# measured: 127 s on the Actions runner, instrumented (the largest of 4 run(s)); the ferry fixture built and its route proof flown with the teleport as a link, by the instrumented engine; the proof is over the whole route
filter = 'test(=teleport_link::a_site_plan_place_only_a_link_reaches_is_reached_and_carried_to)'
slow-timeout = { period = "240s" }
priority = 60


[[profile.ci.overrides]]
# measured: 194 s on the Actions runner, instrumented (the largest of 4 run(s)); one campaign built at several thread counts by the instrumented engine and the emissions compared; each build is a whole campaign
filter = 'test(=thread_count::the_output_is_the_same_at_every_thread_count)'
slow-timeout = { period = "300s" }
priority = 60

