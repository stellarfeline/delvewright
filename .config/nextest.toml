# cargo-nextest's configuration (spec-0126 §1.1, §5). The `rust` family of CI
# jobs runs the whole suite as N partitions of one instrumented archive:
# `cargo llvm-cov nextest --no-report --archive-file … --profile ci
# --partition hash:k/N` — every test in its own process, each to its end.

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "slow"
# spec-0126 §5: each partition's test run is bounded at 25 minutes, and a test
# at 120 s (printed SLOW at 60 s, terminated at the second period) unless an
# override below declares its measured time and why it cannot be smaller.
slow-timeout = { period = "60s" }

# One <testcase> per test with its `time`: the runner's own clock, which the
# budget is judged by beside the Actions step duration. Written under the
# target directory's `nextest/ci/`, and uploaded by every partition on every run.
[profile.ci.junit]
path = "junit.xml"

# The tests that need more than 120 s (spec-0126 §5.4), one entry each: the
# measured time (the largest over the Actions runs named in the commit that
# wrote the entry), why the scenario cannot be smaller, a slow-timeout of 1.5x
# the measurement rounded up to the minute, and a priority so that a
# partition's longest tests start first. `tools/ci/check-suite-audit.py
# --overrides` holds the count to the audit table.


[[profile.ci.overrides]]
# measured: 441 s on the Actions runner, instrumented, the largest of 1 partitioned run(s) and the one-job runs; the admission checks re-run over every piece of the admitted library; the denominator is the library
filter = 'test(=admit_library::the_second_door_is_opened_on_every_shipped_prefab)'
slow-timeout = { period = "720s" }
threads-required = 2
priority = 80


