# cargo-nextest's configuration (spec-0126 §1.1, §5). The `rust` family of CI
# jobs runs the whole suite as N partitions of one instrumented archive:
# `cargo llvm-cov nextest --no-report --archive-file … --profile ci
# --partition hash:k/N` — every test in its own process, each to its end.

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "slow"
# spec-0126 §5, §5.3, §5.4: each partition's test run is bounded at 25 minutes
# and a test at 120 s, both at the median runner speed. The headroom is the
# runner variance measured: 3.11x for a partition's run (the largest ratio of
# one partition's median test time between two runs), so the run is bounded
# at 78 min; 4.44x for one test (the largest ratio of one test's time
# between two runs), so a test is printed SLOW at 267 s and
# terminated at the second period, 534 s, unless an override below
# declares its measured time and why it cannot be smaller.
# `tools/lib/suite_bounds.py` is the one reader of these numbers.
global-timeout = "78m"
slow-timeout = { period = "267s", terminate-after = 2 }

# One <testcase> per test with its `time`: the runner's own clock, which the
# budget is judged by beside the Actions step duration. Written under the
# target directory's `nextest/ci/`, and uploaded by every partition on every run.
[profile.ci.junit]
path = "junit.xml"

# The tests that need more than 120 s (spec-0126 §5.4), one entry each: the
# measured time (the largest over the Actions runs named in the commit that
# wrote the entry, every one at `DELVEC_THREADS=1`), why the scenario cannot be
# smaller, a slow-timeout of 4.44x the measurement rounded up to the minute and
# at most the 78-minute run bound, and a priority so that a partition's
# longest tests start first. `tools/ci/check-suite-audit.py --overrides` holds
# the count to the audit table.


[[profile.ci.overrides]]
# measured: 162 s on the Actions runner, instrumented, one engine thread, the largest of 2 run(s); the admission checks re-run over every piece of the admitted library; the denominator is the library
filter = 'test(=admit_library::the_second_door_is_opened_on_every_shipped_prefab)'
slow-timeout = { period = "780s", terminate-after = 1 }
priority = 60

