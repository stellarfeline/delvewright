# Delvewright version manifest — the single source of truth (spec-0005).
#
# Every pinned version, digest, and checksum the infrastructure depends on lives
# here. Dockerfiles, the compose profiles, and CI workflows must agree with these
# values; `validation/check-versions.sh` (wired into CI tier 1) fails the build if
# any of them hardcode a value that disagrees with this file.
#
# Editing a pin here is a deliberate, reviewed act (ADR-0006 / ADR-0009). After an
# infra-images.yml publish, record the fresh image digests here in a normal PR.

[minecraft]
# The pinned Minecraft Java version — a long-term constant (ADR-0009).
# Consumed by: validation/Dockerfile.delve (ENV VERSION), validation/Dockerfile.toolserver
# (ARG MC_VERSION), validation/compose.yaml (VERSION), harness (DELVEWRIGHT_MC_VERSION),
# .github/workflows/*.yml.
version = "1.21.11"
# Mojang server jar, from piston-meta 1.21.11 (downloads.server). The jar is NEVER
# baked into any image (ADR-0010 EULA).
# sha1 is the checksum piston-meta publishes; sha256 is computed from the jar bytes.
#
# Consumed by: validation/server-bootstrap-cache.sh, which fetches this
# URL ONCE per job and refuses anything whose sha256 is not the pin below, then
# hands the bytes to every server boot as a /data overlay. Without it, each of the
# seven servers a `tier 2` run boots would bootstrap the jar live, and any one blip
# reds a required check. These three values are live inputs, not a record.
server_jar_url = "https://piston-data.mojang.com/v1/objects/64bb6d763bed0a9f1d632ec347938594144943ed/server.jar"
server_jar_sha1 = "64bb6d763bed0a9f1d632ec347938594144943ed"
server_jar_sha256 = "f83b8e093865806f931c7e34aae41b177d4c076335263dd124c75d6d65dd1726"
server_jar_size = 56327581

[datapack]
# Datapack pack_format for 1.21.11 (min_format = max_format = [94, 1]).
# Consumed by: the compiler's emitted pack.mcmeta (crates/compiler/src/emit.rs).
pack_format = [94, 1]

[resourcepack]
# RESOURCE-pack format for 1.21.11 (min_format = max_format = [75, 0]).
# Consumed by: crates/compiler/src/resourcepack.rs (RESOURCE_PACK_FORMAT), the
# NPC-skin / art-font pack's pack.mcmeta.
#
# Provenance: the pinned 1.21.11 client jar's version.json reports
# `resource_major: 75, resource_minor: 0` (and `data_major: 94, data_minor: 1`,
# the [datapack] pin above). Resource packs and data packs share ONE pack.mcmeta
# codec; only the "must declare min_format/max_format" threshold differs — 64 for
# resource packs, 81 for data packs. Declaring a bare `pack_format` above the
# threshold makes the client refuse the whole pack ("Pack declares support for
# version newer than 64, but is missing mandatory fields min_format and
# max_format"), which is client-side only and therefore invisible to every server
# rung of the validation ladder.
pack_format = [75, 0]

[images.base]
# ghcr.io/stellarfeline/delvewright-base — a TRUE mirror (buildx imagetools create,
# see spec-0005 open question resolution below) of itzg/minecraft-server at the pin.
# Consumed by: validation/Dockerfile.delve (FROM, via ARG DELVE_BASE_IMAGE),
# validation/Dockerfile.toolserver (FROM, via ARG BASE_IMAGE).
#
# Because imagetools create copies the multi-arch OCI image index byte-for-byte, the
# mirror's digest EQUALS the source index digest — so this digest is already final,
# even though the package has not been pushed yet (local push lacks write:packages;
# see infra-images.yml). The source index is multi-arch (linux/amd64 + linux/arm64).
repo = "ghcr.io/stellarfeline/delvewright-base"
digest = "sha256:3e7db2562b492dbf442568a327d361547628c98c04a7cb68218c8dde6abdd1de"
mirror_of = "itzg/minecraft-server@sha256:3e7db2562b492dbf442568a327d361547628c98c04a7cb68218c8dde6abdd1de"

[images.toolserver]
# ghcr.io/stellarfeline/delvewright-toolserver — delvewright-base + pre-baked Fabric
# loader, Fabric API, and PackTest (validation tooling only, ADR-0003). Built by
# validation/Dockerfile.toolserver.
# Consumed by: validation/compose.yaml (packtest service `image:`).
#
# Multi-arch (linux/amd64+linux/arm64). Republishes go through infra-images.yml
# (workflow_dispatch); a gh token needs write:packages to push here.
repo = "ghcr.io/stellarfeline/delvewright-toolserver"
tag = "1.21.11-packtest2.4.0"
digest = "sha256:31ed5d5a5c50158470bfee8c7197a75e6f586a25c950bf25b69b533f88e0ba0b"

[fabric]
# Fabric loader (pre-baked into the toolserver at build time; ADR-0003 tooling only).
# Consumed by: validation/Dockerfile.toolserver (ARG FABRIC_LOADER_VERSION).
loader_version = "0.19.3"
# Fabric LAUNCHER (installer) version — the one baked into the pinned toolserver
# image above, recorded in its /data/.fabric-manifest.json as `origin.installer`.
# Consumed by: validation/compose.yaml (FABRIC_LAUNCHER_VERSION on the packtest
# service). itzg defaults that variable to `LATEST`, and resolving "latest" is a
# request to meta.fabricmc.net on EVERY boot of an already-provisioned image — one
# more live host per PackTest suite, six per `tier 2` run. Naming the
# baked version makes the check a local manifest match instead. The toolserver
# Dockerfile does not pass it (the build resolved LATEST to this), so
# validation/server-bootstrap-cache.sh asserts this value against the pinned
# image's own manifest: a republished toolserver that moves the launcher fails
# there rather than silently restoring the per-boot fetch.
launcher_version = "1.1.2"
# Fabric API mod jar (Modrinth project P7dR8mSH), required by PackTest.
# Consumed by: validation/Dockerfile.toolserver (ARG FABRIC_API_URL / _SHA1).
api_version = "0.141.6+1.21.11"
api_url = "https://cdn.modrinth.com/data/P7dR8mSH/versions/6qAuTtLR/fabric-api-0.141.6%2B1.21.11.jar"
api_sha1 = "c98467cbbaf4d197377266795ae015f4130d65b6"

[packtest]
# PackTest (Modrinth project XsKUhp45) — the runtime datapack test harness (ADR-0005).
# Consumed by: validation/Dockerfile.toolserver (ARG PACKTEST_URL / _SHA1),
# validation/compose.yaml (image tag suffix).
version = "2.4.0"
url = "https://cdn.modrinth.com/data/XsKUhp45/versions/g8Sp1z0q/packtest-2.4-mc1.21.11.jar"
sha1 = "7c9f83f1673209abb1d5262dd69583e61c85cbd2"

[harness]
# mineflayer bot pin (spec-0003). Consumed by: harness/package.json.
mineflayer = "4.37.1"

[engine]
# The `delvec` ENGINE release line — ADR-0016 line 2, distributed per ADR-0017.
# One release identity has to hold four things together or it means nothing: the
# version compiled into the binary, the git tag, the crates.io version, and the
# skill's `requires.delvec` window. Before this section they agreed only by
# intention; `validation/check-versions.sh` now makes disagreement a red, and
# `.github/workflows/engine-release.yml` refuses a `v*` tag whose name does not
# match `version` below before it builds or publishes anything.
#
# Consumed by: validation/check-versions.sh (every assertion below),
# .github/workflows/engine-release.yml (tag gate + build matrix),
# .github/workflows/ci.yml (the cross-build shelf job),
# tools/build-release-binaries.sh + tools/check-publishable.sh (which hold NO
# copy of any value here — they read this file, the way
# validation/server-bootstrap-cache.sh does).
version = "1.1.0"

# crates.io identity. `cargo install` resolves by CRATE name, never by binary
# name, so the package had to BE `delvec` — `cargo install delvewright-compiler`
# is the only spelling that could ever have worked and nobody would guess it.
# The lib TARGET keeps the old name (`delvewright_compiler`) so 366 in-tree use
# paths do not churn.
crate = "delvec"

# `delvewright-dsl` is a real dependency of `delvec`, so it must exist on
# crates.io first — but it is DELIBERATELY NOT on the engine version line.
# Locking them together looks tidy and sets a trap: a publish that half-succeeds
# burns the dsl version permanently (crates.io versions cannot be reused), and
# under lockstep the retry would have to move `delvec` too — which would put the
# engine version out of step with the git tag `v1.0.0` that ADR-0016 pins. With
# an independent line, a burned dsl version costs a dsl bump and nothing else.
# `0.x` is also the honest semver for it: it is the DSL types the engine speaks,
# not a library anyone should depend on directly.
dsl_crate = "delvewright-dsl"
dsl_crate_version = "0.1.0"

# The engine's `[dependencies] delvewright-dsl` requirement is `=` and exactly
# this version, so `delvec 1.0.0` on crates.io can resolve to exactly one
# `delvewright-dsl` build and no other.
dsl_crate_req = "=0.1.0"

# `rust-version` in both published manifests, and the channel in
# rust-toolchain.toml. They must be the same string: a `rust-version` looser than
# the toolchain anybody has actually built on is an untested claim, and
# `cargo install` is where a stranger would discover it.
rust_toolchain = "1.97.1"

# THE RELEASE SHELF (ADR-0017). Every platform a creator might plausibly drive
# Claude Code from. Before this, release `v1.0.0` existed with ZERO assets: the
# engine pin ADR-0016 requires and the skill's `requires.delvec` window were
# promises against an empty shelf.
#
# Linux is musl-STATIC on purpose. `delvec`'s whole dependency set is pure Rust
# (flate2 uses the miniz_oxide backend, not zlib-sys), so a static binary has no
# glibc floor, runs on Alpine and on distros older than the runner, and cannot
# fail at the one moment a downloaded binary is expected to just work.
#
# Windows ships `.tar.gz` like everything else rather than `.zip`: one archive
# format is one extraction path for ADR-0014's future bootstrap, and a format
# branch is somewhere for the shelf to end up half-built. Windows 10 1803+ ships
# bsdtar and Windows 11 Explorer opens `.tar.gz` natively.
#
# `delve-render` is deliberately NOT on this shelf (ADR-0021 §3), and it is worth
# being exact about what that does and does not say. The CPU render surface —
# `viewer`, `scene`, `panorama`, `contact-sheet`, `palette`, `index` — IS on the
# shelf, because it is `delvec` subcommands (ADR-0021 §1). What is not is the
# three arms that mesh and rasterise, and the reason is the shelf's own shape:
# these Linux targets are static-musl on purpose, a fully static binary cannot
# `dlopen` a Vulkan loader, and `nucleation` carries a C build script no musl
# cross-compiler in the release recipe can run.
#
# That is a statement about DISTRIBUTION and never about capability. Every
# validation the pipeline needs stays runnable on the creator's own machine
# because the source build is the guarantee and the shelf is only an
# optimisation of it: a creator who needs the GPU arms builds
# `crates/render` from a checkout, which the skill's `Init` section does at the
# step that needs it.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[content]
# The pinned content repo (spec-0007 Step 0): the prefab library + campaign
# sources live here, not in this GPL repo (ADR-0007). Determinism (ADR-0006):
# same DSL + same seed + same prefab library -> byte-identical datapack.
#
# The COMPILER never reads this file. It is handed a campaign directory and a
# `--prefabs` directory and emits a function of those and the flags beside them;
# a pin is a fact about a checkout, not about the bytes it was handed, and a
# value read out of the filesystem above the working directory would make the
# same build emit different bytes depending on where it was launched from.
# Nothing in `<out>/` names a revision.
#
# Consumed by:
#   - CI (.github/workflows/*.yml): every job that builds a fixture or runs the
#     ladder checks the content repo out at this exact `sha` and passes
#     `--prefabs <checkout>/prefabs`.
#   - validation/check-versions.sh: asserts `repo`/`sha` shape here.
#
# Local dev resolves the library through the `campaigns/` symlink instead
# (compiler default `--prefabs campaigns/prefabs`), so day-to-day work does not
# depend on this pin — only reproducible/CI builds do.
#
# RE-PIN CONVENTION: after a content-repo PR merges, update `sha` to the new
# content `main` tip in a normal follow-up PR — and restate the ZONE INVENTORY at
# the new pin in `.github/content-zone-corpus.json`, which names the campaigns the
# pin carries and how many zone programs each declares. Every number there is
# checked against the content checkout, so a campaign that lost its zone programs
# reds on a count instead of sweeping as a silent zero. Moving this `sha` without
# it is a tier-1 red (validation/check-versions.sh).
repo = "stellarfeline/delvewright-campaigns"
# Content `main` tip that carries the storybook's Minecraft-version marker —
# `nobodys-cave-island`'s two-language README restamped from the two-number
# form to the three-number one, which is what the CI job "campaign storybooks
# (engine-version marker)" (`tools/check-storybook-version.py`) reads — and the
# release-workflow fix that stops the release job writing into the engine
# checkout. Those two READMEs are the only files this pin moves under either
# on-pin campaign's own directory; neither `hollow-vigil` nor
# `nobodys-cave-island` gained, lost, or otherwise moved a build input
# (`world.json`, `quests.json`, or any zone program — neither declares
# `design/programs/`, unchanged from the previous pin).
#
# The batch also carries several prefab pieces' re-measured lighting metadata
# (the static block+sky-flood estimator, not a live-server probe) and new
# authoring-pin / skill tooling upstream of the content repo's own CI — neither
# is a campaign build input this repo's compiler reads through `--prefabs` in a
# way that changes ADR-0006 determinism: at this pin every campaign still
# builds byte-identically twice, which is the claim this comment can make
# without restating a count that would go stale the moment the engine moves.
#
# `DW0735` says a state that omits a shape-carrying property drops the geometry
# the property assembles; the library sweep (`crates/admit/tests/library.rs`)
# asks it of every admitted piece on every run and prints its own binding count
# there, which is where that number belongs.
sha = "42ee707db69b83d27534608b2758d8697ad2c46e"

[render]
# The render layer (spec-0007 rendering infra / spec-0003 visual tier). Renders
# are VALIDATION ARTIFACTS, never shipped — but their toolchain is pinned here so
# fidelity is reproducible per (input, version).
#
# Nucleation (per-prefab headless renderer, wgpu). Pinned by git REV because
# crates.io tops out at 0.8.0 which lacks the `rendering` feature; the
# GpuRenderer/ResourcePackSource API lives on master (0.9.1). MIT.
# Consumed by: crates/render/Cargo.toml (git dep `rev`).
nucleation_repo = "https://github.com/Schem-at/Nucleation"
nucleation_rev = "dbc8fe02ce4ddac90a58423dd5d441d067e87baf"
nucleation_license = "MIT"

# Chunky (whole-scene path tracer, GPL-3.0, out-of-process — NOT bundled). The
# OFFICIAL renderer for review frames, storybook art and the release panorama
# invoked as a separate program, never linked.
# 1.21.x needs a snapshot core (stable stops at 1.20.4); this is the snapshot the
# spike verified. `java -jar ChunkyLauncher.jar --update snapshot` self-installs
# it into ~/.chunky/lib.
# Consumed by: crates/render (scene emission targets this scene format) + README
# + docs/reference/tools.md §4a.
chunky_core = "chunky-core-2.5.0-SNAPSHOT.474.g156e2bb"
chunky_update_url = "https://chunkyupdate.lemaik.de"
chunky_launcher_url = "https://chunkyupdate.lemaik.de/ChunkyLauncher.jar"
chunky_license = "GPL-3.0"

# deepslate (MIT) — the rendering core of the prefab review page
# (`delvec viewer`, ADR-0021 §4). Unlike Chunky it IS bundled: the page is
# one self-contained file, so the renderer ships inside it as
# `crates/compiler/src/view/viewer/deepslate.bundle.js`. Vendored, never forked — the
# bundle carries one local patch, of two block-entity texture ids upstream points
# at paths no Minecraft version ships.
#
# The SHA-256 is of the committed bundle, so this pin binds to the BYTES rather
# than to a version string: a hand-edited bundle, or one rebuilt at a different
# version without updating this file, is a red. Rebuild with
# `tools/build-deepslate-bundle.sh` (which pins the same versions) and update the
# digest in the same commit.
# Consumed by: tools/build-deepslate-bundle.sh + crates/compiler/src/view/viewer/.
deepslate_version = "0.26.0"
deepslate_license = "MIT"
deepslate_bundle = "crates/compiler/src/view/viewer/deepslate.bundle.js"
deepslate_bundle_sha256 = "0d9496f187600b479bb83d015e49eccbf70997c5886f0c70b101ca4595bb2c46"
gl_matrix_version = "3.4.4"
esbuild_version = "0.28.2"

# Textures come from the pinned 1.21.11 client jar (the same MC version as
# [minecraft]). Never committed (EULA); resolved at run time from --textures,
# $DELVEWRIGHT_CLIENT_JAR, or ~/.chunky/resources/minecraft.jar.
textures = "minecraft-client-1.21.11.jar"

[ci]
# The toolchains CI selects, and the packages it installs into them. Until these
# lived here they stood alone in the workflow that used them: nothing said what
# any of them was held for, nothing held two statements of one value equal, and
# two of them named no version at all. `validation/check-versions.sh` is what
# binds every consumer to the values below, and `.github/pins.toml` records what
# each is held for and on what terms it may move.
#
# Node for the harness (`npm ci` + `node --test`) and for the storybook jobs.
# A MAJOR line, resolved by actions/setup-node to its newest release: the harness
# has a lockfile, so what this selects is the runtime, not the dependency set.
# Consumed by: .github/workflows/ci.yml, .github/workflows/release.yml.
node_version = "24"
# The interpreter for the two Python tool suites (`tools/skin`, `tools/tests`).
# A MINOR line, resolved by actions/setup-python to its newest patch.
# Consumed by: .github/workflows/ci.yml (skin toolchain, i18n translation tool).
python_tools_version = "3.12"
# The interpreter for the mecha cross-check, and it is a DIFFERENT line from the
# one above on purpose rather than by drift: `mecha_version` below declares
# `Requires-Python: >=3.14`, so the pinned validator cannot be installed on the
# tools line at all. `mecha_requires_python` records that floor and
# check-versions.sh holds this value at or above it, so lowering this line reds
# here instead of failing an install inside a required job.
# Consumed by: .github/workflows/ci.yml (mecha cross-check).
python_mecha_version = "3.14"
# mecha (ADR-0011): the independent re-validation of every emitted .mcfunction
# against the 1.21.11 command tree, and beet, the library it validates through.
# Both are INSTRUMENTS of a required status check, so both are named literally.
# beet was previously installed unpinned beside the pinned mecha, which is
# `CLAUDE.md`'s "a frozen measurement names its instrument literally" inverted:
# the gate's verdict could change with nothing in any diff to show what moved.
# `mecha_requires_beet` is mecha's own declared floor for it.
# Consumed by: .github/workflows/ci.yml (mecha cross-check).
mecha_version = "0.104.1"
mecha_requires_python = "3.14"
mecha_requires_beet = "0.116.0"
beet_version = "0.116.0"
# The test runner both Python suites are judged by. Same argument as beet: an
# unpinned runner is an unpinned instrument, and a runner that changes its
# collection or assertion behaviour moves a required check's verdict.
# Consumed by: .github/workflows/ci.yml (skin toolchain, i18n translation tool).
pytest_version = "9.1.1"
# cargo-audit: the RustSec advisory check `tools/check-advisories.py --cargo`
# drives over all ten cargo lockfiles this repository tracks. An instrument of a
# required status check (`rust (fmt, clippy, test)`), so it is named literally
# for the same reason `beet` and `pytest` are: an unpinned instrument can move a
# gate's verdict with nothing in any diff to show what changed. `cargo install
# --locked` builds it from the version resolved here, and Swatinem/rust-cache
# caches `~/.cargo/bin`, so the compile is paid once per cache line.
# Consumed by: .github/workflows/ci.yml.
cargo_audit_version = "0.22.2"

[skin]
# skinpy-extended (MIT, ADR-0013 allowlist), the part/face-addressable composer
# and isometric preview renderer `tools/skin` is built on (spec-0009). Pinned
# exactly because the suite asserts byte-identical PNGs (ADR-0006): a different
# library version is a different picture under the same declared version.
# Consumed by: tools/skin/requirements.txt, tools/skin/pyproject.toml, and
# tools/skin/delve_skin/catalog.py, which stamps it into every emitted
# provenance record — the fourth statement of one value, and the one that would
# have gone on claiming the old version in shipped metadata.
skinpy_extended = "1.0.1"
