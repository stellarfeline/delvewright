# Delvewright workstation config — machine-local knobs for generation-time tooling.
#
# NOT a build input: the compiler never reads this file, so nothing here can affect
# a delve's bytes (ADR-0006 determinism). Pinned versions live in `versions.toml`.
#
# This committed file documents the shape and stays inert. Put your actual settings
# in `delvewright.local.toml` (gitignored, same shape) — its keys override these
# section by section. Every section is optional: with none present, tooling falls
# back to its built-in behavior.

# ---------------------------------------------------------------------------
# [i18n] — translate l10n sidecars with an external OpenAI-compatible LLM API
# instead of having the /new-delve agent translate in-agent.
#
#   consumed by: tools/i18n-translate.py   ·   docs: docs/reference/i18n.md
#
# Generation-time only. Shipped delves never call an LLM (CLAUDE.md forbidden
# zones) — the sidecar is written into the campaign source and baked at build time.
#
# NEVER put an API key in this file (or in delvewright.local.toml). `api_key_env`
# is the NAME of an environment variable; tooling reads the key from it at call
# time and never stores or logs it.
#
# [i18n]
# provider = "openai-compatible"                # only supported value
# base_url = "https://api.deepseek.com/v1"      # DeepSeek; Kimi: https://api.moonshot.cn/v1
# model = "deepseek-chat"                       # Kimi: kimi-k2-0905-preview
# api_key_env = "DELVEWRIGHT_I18N_API_KEY"
# temperature = 0.2                             # optional (default 0.2)
# batch_size = 40                               # optional keys per request (default 40)
# timeout_seconds = 120                         # optional (default 120)
# max_retries = 3                               # optional (default 3)

# [refimg] — draw a REFERENCE IMAGE for the design-alignment gate: concept art
# produced BEFORE any prefab exists, so the owner confirms the design against a
# picture instead of prose. NOT a render — a render is a candidate prefab imaged
# by `delve-render`, later, at contact-sheet curation. Two stages, two producers.
#
#   consumed by: tools/refimg.py           ·   docs: docs/reference/tools.md
#
# Output goes to a gitignored working directory, which is where a DRAFT belongs.
# An APPROVED reference is copied into the campaign it belongs to — under
# `design/concept/` for one scene, `design/reference/` for a whole map, beside
# its sidecar — and committed with the campaign in the content repo. An
# approval that lives only in a gitignored directory is bound to nothing. Either
# way nothing here can move a delve's bytes (ADR-0006): no part of the toolchain
# places, reads or compiles a reference image.
#
# NEVER put an API key in this file (or in delvewright.local.toml). `api_key_env`
# is the NAME of an environment variable, read at call time, never stored or
# logged; an inline `api_key =` is refused outright.
#
# The provider name carries CAPABILITY, not just wire format. A provider that
# cannot accept a style anchor must fail loudly rather than silently drop it.
#
# A provider that cannot honour a flag REFUSES it — `--seed` on a seedless
# provider is an error, never a dropped parameter.
#
# The FRAME below is a DEFAULT. It is a per-call property — a multi-view
# reference wants a different frame per view — so `--aspect-ratio`,
# `--image-size` and `--resolution` override it for one call, and the resolved
# value is written into that image's sidecar. Each provider takes only its own
# frame vocabulary and refuses the other's.
#
# [refimg]
# provider = "gemini-native"                   # "gemini-native" | "ideogram-v3"
# model = "gemini-3.1-flash-image"
# api_key_env = "DELVEWRIGHT_GEMINI_API_KEY"   # one var per provider, not one shared
# image_size = "2K"                            # gemini: 512 | 1K | 2K | 4K
# aspect_ratio = "16:9"                        # gemini: 1:1 2:3 3:2 3:4 4:3 4:5
#                                              #   5:4 9:16 16:9 21:9 1:8 8:1 1:4 4:1
# timeout_seconds = 180                        # optional (default 180)
#
# Ideogram instead — it is the one with a `seed` and a style-CODE anchor, but its
# anchored model (3.0) sits far below the Gemini line on blind-preference
# leaderboards, and its generate response was MEASURED not to return a style code,
# so the code has to be read off the web UI:
#
# provider = "ideogram-v3"
# model = "ideogram-v3"
# api_key_env = "DELVEWRIGHT_IDEOGRAM_API_KEY"
# rendering_speed = "TURBO"                    # TURBO | DEFAULT | QUALITY
# resolution = "1344x768"

# ---------------------------------------------------------------------------
# [refscore] — score candidate RENDERS against a REFERENCE IMAGE, to ORDER a
# contact sheet (spec-0028 §3).
#
#   consumed by: tools/refscore.py         ·   docs: docs/reference/tools.md
#
# THE SCORE RANKS; IT NEVER GATES. Cross-domain calibration
# between a painterly reference and a voxel render is unproven, so a number here
# decides where a candidate sits on the page, never whether it is on the page. A
# low-scoring candidate is still present, last. `delvec contact-sheet`
# refuses (DW0725) any ordering that is not a permutation of the candidate set;
# promoting the score to a threshold needs its own owner-approved amendment
# backed by accumulated batch data.
#
# The real backends pull PyTorch and multi-GB weights. They are NOT in CI and
# nothing in this repo installs them — make a local virtualenv once. A missing
# dependency is an error naming the install line; the tool never falls back to
# the stub, because a stub number that looks like a measurement is worse than no
# number at all.
#
# Absent config + no --backend exits 2 saying what to add; MALFORMED config is a
# hard error. Today's backends run locally and need no key; an inline `api_key`
# is refused outright regardless of that.
#
# [refscore]
# backend = "open-clip"                        # "open-clip" | "vqascore" | "stub"
# model = "ViT-L-14"                           # open_clip model (MIT)
# pretrained = "laion2b_s32b_b82k"             # open_clip weights tag
# device = "cpu"                               # cpu | cuda | mps
#
# VQAScore instead — note it is TEXT-conditioned: it asks a VLM how well each
# render answers a PROMPT and never looks at the reference image, so it requires
# --prompt and refuses a --reference it would silently ignore:
#
# backend = "vqascore"                         # t2v_metrics (Apache-2.0)
# model = "clip-flant5-xl"
#
# `stub` is a deterministic, dependency-free, offline hash of the file bytes —
# NOT a similarity measure. It exists to exercise the whole loop (and is what CI
# runs); every artifact it touches says so in its header.
