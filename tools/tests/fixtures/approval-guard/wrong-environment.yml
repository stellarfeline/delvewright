name: fixture — the guard asserts somebody else's approval
on: { push: { branches: [main] } }
jobs:
  publish:
    name: publish (owner approval)
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - name: the gate actually bound
        run: bash tools/assert-run-approved.sh staging
      - name: the irreversible act
        run: bash tools/does-the-thing.sh
