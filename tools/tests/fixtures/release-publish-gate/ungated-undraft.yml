# The defective shape, second form: a job with no environment that undrafts the
# release, so a run nobody approved makes the release public on its own.
name: fixture — an ungated undraft
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
jobs:
  announce:
    name: make it public
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: ./.github/actions/fixture-checkout
      - name: undraft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          gh release edit "$TAG" --draft=false
