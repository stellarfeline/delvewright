# The defective shape, first form: the release is created without `--draft`, so
# it is public the instant the ungated job creates it — which is what
# `publish-assets` did.
name: fixture — an ungated public release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
jobs:
  publish-assets:
    name: publish shelf assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: ./.github/actions/fixture-checkout
      - name: upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          gh release create "$TAG" --title "fixture $TAG" --generate-notes
          gh release upload "$TAG" dist/*.tar.gz --clobber
