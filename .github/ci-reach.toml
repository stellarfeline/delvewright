  { glob = "Cargo.toml", why = "the root workspace manifest and `[workspace.package]` version" },
  { glob = "**/Cargo.toml", why = "`tools/ci/fmt-workspaces.sh --check` derives every workspace from `git ls-files`" },
  { glob = "**/*.rs", why = "`tools/ci/fmt-workspaces.sh --check` formats every workspace's sources" },
  { glob = "prefabs/**", why = "the prefab workspace, which `fmt-workspaces.sh` formats as one of the tree's workspaces" },
  { glob = "gallery/**", why = "crate tests read the gallery (`detail.rs`, `remedy_reachability.rs`, `site_plan_edit_script.rs`, `prefab_*` tests)" },
  { glob = "tools/ci/fmt-workspaces.sh", why = "the formatting sweep this job runs" },
  { glob = "tools/ci/check-json-canonical.py", why = "the JSON sweep this job runs" },
  { glob = "tools/ci/determinism-subject.sh", why = "`delvec-binary`'s Linux digest step and `determinism-cross-os` both run it" },
  { glob = "tools/ci/tree-digest.py", why = "`determinism-subject.sh` runs it to write the digest" },
  { glob = "tools/creator/refscore.py", why = "`crates/delvec/tests/view_sheet.rs` runs it" },
  { glob = "tools/ci/check-dw-codes.py", why = "`crates/delvec/tests/codes.rs` runs it against the built binary's `delvec codes`" },
  { glob = "tools/lib/mdtable.py", why = "`check-dw-codes.py`, which `crates/delvec/tests/codes.rs` runs, reads the catalog through it" },
  { glob = "tools/lib/dwcatalog.py", why = "`check-dw-codes.py`, which `crates/delvec/tests/codes.rs` runs, reads the catalog through it" },
  { glob = "tools/lib/rust_source.py", why = "`check-dw-codes.py`, which `crates/delvec/tests/codes.rs` runs, reads Rust visibility through it" },
  { glob = "docs/reference/delvec/**", why = "the catalog pages of the `delvec` crate's modules, which `check-dw-codes.py` (run by `crates/delvec/tests/codes.rs`) holds to the declarations" },
  { glob = "docs/reference/dsl/**", why = "the catalog pages of the `dsl` crate's modules, which `check-dw-codes.py` (run by `crates/delvec/tests/codes.rs`) holds to the declarations" },
  { glob = "tools/creator/i18n-translate.py", why = "`crates/delvec/tests/i18n_sidecar.rs` runs the fixture driver, which loads this tool's writer" },
  { glob = "tools/tests/fixtures/i18n-sidecar/**", why = "`crates/delvec/tests/i18n_sidecar.rs` runs `write_sidecar.py`" },
  { glob = "tools/maintenance/probe-drowned-engagement.py", why = "`crates/delvec/src/compiler/engage.rs`'s `the_probe_measures_this_table` reads it" },
  { glob = "docs/reference/compiler.md", why = "`crates/delvec/tests/hand_camera.rs` reads the walk-record field paragraph" },
  { glob = "tools/ci/check-written-world.py", why = "`crates/delvec/tests/post_beat_camera.rs` runs it against perturbed written worlds (`DW0955`)" },
  { glob = "tools/lib/anvil.py", why = "`crates/delvec/tests/post_beat_camera.rs` reads every written world back through it" },
  { glob = "**/*.json", why = "`tools/ci/check-json-canonical.py` judges every tracked JSON document, and `crates/delvec/tests/fmt.rs` formats every one `git ls-files '*.json'` lists" },
