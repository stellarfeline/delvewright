# What each CI job reads — the table `ci.yml`'s `changes` job filters by.
#
# On `pull_request`, a job runs only when the change touches a path its group
# lists here; on `push` and `workflow_dispatch` every job runs. The table is
# interpreted by `tools/lib/ci_reach.py` alone, and `tools/ci/check-ci-reach.py`
# holds it to `ci.yml`: every job but `changes` reads a group through its `if`,
# every group is read by a job, every glob matches a tracked file, and every
# `if` also runs on the non-pull-request events.
#
# A glob is an input when a step of a job reading the group reads a file it
# matches — directly, through a script it runs, or through a script, test or
# build that script reaches. When in doubt a path is an input: a job that runs
# too often costs minutes, a job skipped wrongly lets a defect merge.
#
# `**` is any number of whole path segments, `*` is within one segment.

[all]
inputs = [
  { glob = ".github/**", why = "the workflow itself, the composite actions every checkout job uses, the pin registry, the required-context list, the zone-audit exclusions and corpus, and this table" },
  { glob = "versions.toml", why = "every job's pins: the content repository and sha `checkout-content` reads, toolchain and instrument versions, the engine targets" },
  { glob = "Cargo.lock", why = "every `cargo … --locked` and the version-site sweep" },
  { glob = "rust-toolchain.toml", why = "the compiler every cargo invocation resolves" },
  { glob = ".gitattributes", why = "how every checkout materialises files (LFS, line endings)" },
  { glob = ".gitignore", why = "what `git status` calls dirty, which the engine's revision stamp reads" },
  { glob = "tools/lib/ci_reach.py", why = "the filter that decides every other group" },
]

[[group]]
name = "manifest"
inputs = [
  { glob = "**", why = "`tools/ci/check-pins.py` scans every tracked file (`git ls-files`) for a fetch verb; `validation/check-versions.sh` reads Dockerfiles, compose, workflows, crate manifests, harness and skin manifests" },
]

[[group]]
name = "dsl-crate-version"
inputs = [
  { glob = "**", why = "`tools/ci/crates-io-publish.sh --plan` runs `tools/lib/version_sites.py verify`, which sweeps every tracked file for a `dsl_version` carrier; it packages `crates/dsl`" },
]

[[group]]
name = "rust"
inputs = [
