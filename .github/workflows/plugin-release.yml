name: plugin release (delvewright)

# The `delvewright` Claude Code plugin, released as `delvewright--v<version>`
# (ADR-0028 §1). The plugin's version IS the version of the engine release it
# ships at (`tools/ci/check-skill-page.py`, rule 11): the pull request that moves
# the page's pin to `delvec--v<version>` moves `plugin.json` to `<version>` in the
# same tree, under the same protection as every other change, and
# `engine-release.yml` tags that tree. So this workflow writes to no branch. It
# records what that engine release already delivers: a tag at the same commit,
# and a GitHub Release carrying the plugin root as an archive.
#
# A human dispatches it with the version, after the engine release of that
# version has published. It never starts on a push or merge.
#
#   identity  `delvec--v<version>` exists, here and on the remote at the same
#             commit, and is on `main`; the tree it names pins that same tag and
#             states `plugin.json` `version` = <version> (an engine release cut
#             without moving the page delivers no plugin of its own version, and
#             is refused); `delvewright--v<version>` is unborn.
#   publish   archive, checksum and notes from that commit; the tag; the Release
#             (`--latest=false`, ADR-0028 §8), read back.
#
# The dispatch is the approval: nothing starts this but a human, and it publishes
# a tag and a GitHub Release, never to a registry. `tools/ci/check-release-publish-gate.py`
# keys that on the file: dispatch-only, and no registry act in any job.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The plugin version to release: the version of a published delvec release whose tree pins it"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: the plugin at its engine release, tagged and published
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # `merge-base --is-ancestor` needs real history, and the engine tag
          # and `previous` need every tag.
          fetch-depth: 0
      - name: the engine release delivers this version, and its plugin tag is unborn
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          tag="$(python3 tools/lib/release_tags.py tag delvewright "$VERSION")"
          engine="$(python3 tools/lib/release_tags.py tag delvec "$VERSION")"
          if ! sha="$(git rev-parse --verify --quiet "refs/tags/$engine^{commit}")"; then
            echo "::error::$engine does not exist. The plugin is released at the engine release of the same version; dispatch engine-release.yml first."
            exit 1
          fi
          remote="$(python3 tools/lib/github_releases.py tag-commit "$GITHUB_REPOSITORY" "$engine")"
          if [ "$remote" != "$sha" ]; then
            echo "::error::$engine is $sha in this checkout and '$remote' on $GITHUB_REPOSITORY."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$engine ($sha) is not on main."
            exit 1
          fi
          pinned="$(git show "$sha:.claude/skills/delvewright/skills/new-delve/versions.toml" \
            | python3 -c 'import sys,tomllib;sys.stdout.reconfigure(newline="\n");print(tomllib.loads(sys.stdin.read())["engine"]["ref"])')"
          stated="$(git show "$sha:.claude/skills/delvewright/.claude-plugin/plugin.json" \
            | python3 -c 'import json,sys;sys.stdout.reconfigure(newline="\n");print(json.load(sys.stdin)["version"])')"
          if [ "$pinned" != "$engine" ] || [ "$stated" != "$VERSION" ]; then
            echo "::error::$engine's tree pins $pinned and states plugin.json $stated. That engine release was cut without the page moving to it, so it delivers no plugin $VERSION; there is nothing to release."
            exit 1
          fi
          at="$(python3 tools/lib/github_releases.py tag-commit "$GITHUB_REPOSITORY" "$tag")"
          if [ -n "$at" ]; then
            echo "::error::$tag already exists at $at."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "previous=$(python3 tools/lib/release_tags.py previous "$tag")"
          } >> "$GITHUB_OUTPUT"
          echo "ok: delvewright $VERSION is the plugin root $engine delivers, at $sha"
      - name: archive, checksums and notes
        env:
          VERSION: ${{ github.event.inputs.version }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # A tree archive stamps the current time on every entry; the commit's
          # own time makes the zip a function of the tag.
          git archive --format=zip --mtime="$(git log -1 --format=%cI "$SHA")" \
            --output "dist/delvewright-plugin-$VERSION.zip" "$SHA:.claude/skills/delvewright"
          (cd dist && sha256sum "delvewright-plugin-$VERSION.zip" > SHA256SUMS && cat SHA256SUMS)
          python3 tools/ci/release-notes.py delvewright --commit "$SHA" > dist/notes.md
      - uses: ./.github/actions/write-release-tag
        with:
          tag: ${{ steps.v.outputs.tag }}
          commit: ${{ steps.v.outputs.sha }}
          message: "delvewright ${{ github.event.inputs.version }}"
      - name: the Release, never Latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ github.event.inputs.version }}
          PREVIOUS: ${{ steps.v.outputs.previous }}
        run: |
          set -euo pipefail
          title="$(python3 tools/lib/release_tags.py title "$TAG")"
          set -- "dist/delvewright-plugin-$VERSION.zip" dist/SHA256SUMS --verify-tag --title "$title" --notes-file dist/notes.md --latest=false
          if [ -n "$PREVIOUS" ]; then
            gh release create "$TAG" "$@" --generate-notes --notes-start-tag "$PREVIOUS"
          else
            gh release create "$TAG" "$@"
          fi
          state="$(python3 tools/lib/github_releases.py state "$GITHUB_REPOSITORY" "$TAG")"
          n="$(python3 tools/lib/github_releases.py assets "$GITHUB_REPOSITORY" "$TAG" | grep -cxF -e "delvewright-plugin-$VERSION.zip" -e SHA256SUMS || true)"
          echo "Release $TAG: $state; $n of 2 asset(s)"
          [ "$state" = "published" ] && [ "$n" -eq 2 ]
