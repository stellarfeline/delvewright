name: plugin release (delvewright)

# The `delvewright` Claude Code plugin, released as `delvewright--v<version>`
# (ADR-0028 §1) on its OWN version line (ADR-0038): `plugin.json` `version` at a
# `main` commit names the release, the tag is written at that commit, and the
# marketplace entry in that same tree names the tag — so the commit names its
# own release before the tag exists, and the plugin root a creator receives
# from the tag is the tree whose catalog row points at it. The page inside it
# pins the engine release it is proven on (`[engine].ref`), which is any
# published `delvec` release; no engine release is required or implied, and
# this workflow writes to no branch.
#
# A human dispatches it with a commit on `main` (default: the tip). It never
# starts on a push or merge (ADR-0028 §4).
#
#   identity  `tools/ci/check-plugin-release.py --online`: the commit is on
#             `main`; `delvewright--v<version>` is unborn here and on the
#             remote; the version is above every release of the line; the
#             entry names the tag; the pinned engine's Release is published.
#             Then, at that commit, `tools/ci/check-skill-page.py --online`:
#             the page against the engine at its pin, the engine's shelf whole.
#   publish   archive, checksum and notes from that commit (a tree with no
#             `RELEASE-NOTES.md` entry is refused here); the tag; the Release
#             (`--latest=false`, ADR-0028 §8), read back.
#
# The dispatch is the approval: nothing starts this but a human, and it publishes
# a tag and a GitHub Release, never to a registry. `tools/ci/check-release-publish-gate.py`
# keys that on the file: dispatch-only, and no registry act in any job.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "A commit on main to release the plugin from (its plugin.json version names the release; default: the tip of main)"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.event.inputs.commit }}
  cancel-in-progress: false

jobs:
  publish:
    name: the plugin at its own release, tagged and published
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # `merge-base --is-ancestor` needs real history, and the release
          # tags of both lines are what the identity and the notes read.
          fetch-depth: 0
      - name: the identity of this release, refused before anything is written
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.inputs.commit }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --verify "$COMMIT^{commit}")"
          python3 tools/ci/check-plugin-release.py --commit "$sha" --main origin/main \
            --repository "$GITHUB_REPOSITORY" --online --output "$GITHUB_OUTPUT"
          git checkout --quiet --detach "$sha"
          echo "ok: releasing the tree at $sha"
      # The page at the released commit, against the engine it pins: the pin
      # resolves to a published shelf with every target, the plugin tag is
      # unborn on the remote, and every offline rule holds. Run at the commit,
      # with the tools the commit carries.
      - name: the page at this commit, held to its pin and the shelf
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/check-skill-page.py --online
      - name: archive, checksums and notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.v.outputs.sha }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # A tree archive stamps the current time on every entry; the commit's
          # own time makes the zip a function of the tag.
          git archive --format=zip --mtime="$(git log -1 --format=%cI "$SHA")" \
            --output "dist/delvewright-plugin-$VERSION.zip" "$SHA:.claude/skills/delvewright"
          (cd dist && sha256sum "delvewright-plugin-$VERSION.zip" > SHA256SUMS && cat SHA256SUMS)
          # The opening the released tree states and the `RELEASE-NOTES.md` entry
          # written for this version, judged a summary against the changes merged
          # since the previous plugin release; a tree with no entry is refused
          # here, before the tag is written.
          python3 tools/ci/release-notes.py delvewright --commit "$SHA" --repository "$GITHUB_REPOSITORY" > dist/notes.md
          {
            echo "### notes published for $TAG"
            echo ""
            cat dist/notes.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/write-release-tag
        with:
          tag: ${{ steps.v.outputs.tag }}
          commit: ${{ steps.v.outputs.sha }}
          message: "delvewright ${{ steps.v.outputs.version }}"
      - name: the Release, never Latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          title="$(python3 tools/lib/release_tags.py title "$TAG")"
          gh release create "$TAG" "dist/delvewright-plugin-$VERSION.zip" dist/SHA256SUMS --verify-tag --title "$title" --notes-file dist/notes.md --latest=false
          state="$(python3 tools/lib/github_releases.py state "$GITHUB_REPOSITORY" "$TAG")"
          n="$(python3 tools/lib/github_releases.py assets "$GITHUB_REPOSITORY" "$TAG" | grep -cxF -e "delvewright-plugin-$VERSION.zip" -e SHA256SUMS || true)"
          echo "Release $TAG: $state; $n of 2 asset(s)"
          [ "$state" = "published" ] && [ "$n" -eq 2 ]
