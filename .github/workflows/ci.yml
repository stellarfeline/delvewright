name: CI (tiers 1 + 2)

# spec-0004: tier 1 (unit + static analysis) on every push/PR; tier 2 (delve
# datapack-load check + PackTest suite) on PRs. Tier 3 (bot playthrough +
# multi-arch image push) lives in release.yml, on rc-* tags.
# push is limited to main so PR branches don't run every job twice
# (push + pull_request) — a duplicate run is a second set of statuses reporting
# on one tree, and the pair race the `concurrency` cancel. This used to cite
# metered Actions minutes; the repo is PUBLIC, where standard runners are free,
# so that premise was false and the reason above is the one that holds.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # spec-0005 tier 1: versions.toml is the single source of truth. Fails if any
  # Dockerfile/compose/workflow hardcodes a version/digest that disagrees with it.
  manifest:
    name: manifest consistency (versions.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest ships python3 (>=3.11, has stdlib tomllib) and bash.
      - name: consumers agree with versions.toml
        run: bash validation/check-versions.sh
      # Same class of gate for the WORLD: every server that boots a build output
      # (shipped delve image + PackTest runner) must derive difficulty/seed/
      # level-type/generator-settings from the compiler's server.properties, via the
      # one shared entrypoint. Hardcoding them has twice made a server boot a world
      # the campaign never declared (tasks #103, #84).
      - name: every server derives its world from the build
        run: bash validation/check-world-settings.sh

  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The compiler tests read the prefab library (`campaigns/prefabs/*.nbt`,
      # git-lfs); it lives in the content repo now (spec-0007 Step 0), checked out
      # at the pinned SHA into ./campaigns. The ADR-0006 double-build byte-identity
      # gate runs inside `cargo test --workspace` (tests/cli.rs).
      - uses: ./.github/actions/checkout-content
      # rust-toolchain.toml pins the channel + clippy/rustfmt components,
      # which rustup on the runner installs automatically.
      #
      # Two workspaces since `crates/render` was excluded from the root one
      # (/Cargo.toml): each needs its own target dir cached, or the render steps
      # below recompile wgpu from scratch on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/render
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: cargo test (incl. determinism double-build gate)
        run: cargo test --locked --workspace
      # spec-0033 §4.7. `prefab-procedure.md` §3 sends an author to the corpus
      # rather than to the schema, so an IR construct no example writes does not
      # exist in practice — which was measured by hand once and would otherwise
      # never be measured again.
      #
      # A STEP, not a job: every job name here is a required status context, and
      # a new one is advisory until branch protection is edited. As a step it
      # gates from the moment it merges.
      #
      # BINDING — the review question CLAUDE.md asks of every gate ("what calls
      # this, and what happens if someone does the guarded thing without calling
      # it?") has two answers here, and neither is a doc line:
      #   * an IR change cannot COMPILE past it. The construct list is assigned
      #     by exhaustive matches over `Node`/`Cond`/`Paint`
      #     (`crates/grammar/src/coverage.rs`), so a new variant reds `cargo
      #     build`, `clippy`, `test` and this step alike until it is classified,
      #     and it then begins life at zero bindings.
      #   * a CORPUS change cannot be pushed past it. The same assertion is a
      #     `#[test]` in that module, so it runs inside `cargo test --workspace`
      #     above as well as here. This step exists on top of the test because a
      #     table is what a reader acts on and an assertion message is not.
      # `if: always()` so the table reaches the log even when an unrelated test
      # above went red.
      - name: grammar demonstration coverage (no IR construct is undemonstrated)
        if: always()
        run: cargo run --locked -q -p delvewright-grammar --bin delve-grammar -- coverage

      # `crates/render` is its own workspace so that its git dependency stops
      # being a precondition for every cargo command in the repo (/Cargo.toml).
      # Excluding it from `--workspace` would have taken its coverage with it, so
      # the same three checks run against its manifest — this is the ONLY place in
      # CI that builds the render crate, and the only place that needs its
      # dependency. `fmt` first: rustfmt resolves nothing, so a formatting error
      # reds without waiting on a network reach.
      - name: cargo fmt --check (render workspace)
        run: cargo fmt --manifest-path crates/render/Cargo.toml --all -- --check
      # The one git fetch in this repo's CI, in a step that says so. Nucleation is
      # pinned by rev, so a warm rust-cache satisfies this without touching the
      # network at all (measured: 0.47s and zero `Updating git repository` lines
      # against a populated db); a cold cache clones 227 MB. Either way it happens
      # HERE, named, and never inside a step named for clippy or for a test —
      # which is what a docs-only PR hit as a raw TLS error in a step called
      # "build the hello-world delve output" (#388).
      - name: fetch — the render workspace's pinned git dependency
        run: cargo fetch --locked --manifest-path crates/render/Cargo.toml
      # BINDING (CLAUDE.md: a green gate that binds to nothing is VACUOUS).
      # `--offline` is what makes the fetch step above load-bearing: if it did not
      # populate the cache, these red immediately instead of quietly re-fetching
      # and leaving the job as exposed as it was while green.
      - name: cargo clippy -D warnings (render workspace)
        run: |
          cargo clippy --locked --offline --manifest-path crates/render/Cargo.toml \
            --all-targets -- -D warnings
      - name: cargo test (render workspace)
        run: cargo test --locked --offline --manifest-path crates/render/Cargo.toml
      # task #52 (owner directive 2026-08-07): authored JSON has ONE canonical
      # form, so an insertion is a one-line diff instead of a whole-file rewrite
      # — a three-key insertion into a non-canonical zh-cn sidecar once produced
      # a 103-insertion/100-deletion diff. `delvec fmt --check` is the `cargo fmt
      # --check` half of that; the formatter itself is what stops authors
      # hand-sorting (docs/reference/compiler.md §9).
      #
      # A STEP, not a job: every job name here is a required status context, and
      # a new one is advisory until branch protection is edited — which is the
      # shape CLAUDE.md rejects. As a step it gates from the moment it merges.
      #
      # The roots are named explicitly rather than `.`: `crates/compiler/data/`
      # is harvested game registries with their own generator contract, and
      # `campaigns/` is a pinned checkout of another repository (its own CI is
      # where its files are gated). `fmt` exits 1 if these paths ever match zero
      # files (DW0774), so a renamed fixture directory reds here instead of
      # turning this into a green no-op.
      - name: authored JSON is in canonical form (delvec fmt --check)
        run: |
          cargo run --locked -q -p delvec --bin delvec -- fmt --check \
            crates/dsl/fixtures \
            crates/compiler/tests/fixtures \
            crates/compiler/examples
      # ADR-0017: `cargo install delvec` has to keep working, and `cargo publish`
      # is a ONE-WAY DOOR — a version can never be reused and a name never freed
      # — so the packaging contract is proven on every push from a tree nobody
      # has published from. This packages both publishable crates, asserts the
      # manifest crates.io will actually serve carries no `path` dependency, and
      # rebuilds the packaged tarball OUTSIDE the workspace with the DSL crate
      # supplied from its own packaged tarball. That last part is what stops the
      # gate being vacuous: a dry run that quietly satisfied the dependency from
      # `crates/dsl` on disk would prove nothing about a stranger's download.
      # A STEP, not a job: every job name here is a required status context.
      - name: the published crates would build standing alone
        run: bash tools/check-publishable.sh
      # The same crates ship a FRONT PAGE, and it is the only document in this
      # repo whose reader has never seen this repo. `crates/compiler/README.md`
      # and `crates/dsl/README.md` are rendered verbatim on crates.io; the
      # `delvec` page used to open with "The deterministic compiler (spec-0002,
      # ADR-0001/0006/0011)", a citation a visitor cannot resolve. #388 rewrote
      # them and nothing stopped that regressing — the rule behind it (CLAUDE.md
      # *Audience separation in docs*) was held by memory alone. Six unambiguous
      # patterns only: spec-NNNN, ADR-NNNN, DWNNNN, `task #N`, `PR #N`, and a
      # repo-relative markdown link (crates.io serves the markdown with no
      # repository around it). It deliberately does NOT check the present-tense
      # half of the rule — "now"/"still"/"since" are ordinary English and a
      # checker for them would red on honest prose, which is worse than no
      # checker. The file set is DERIVED from the manifests (every crate whose
      # `publish` is not false, through its `readme` key), so a crate that
      # becomes publishable inherits this with no edit; examining zero pages is
      # a red. It rides HERE because this is the job that already owns what
      # crates.io receives. A STEP, not a job: every job name here is a required
      # status context. Deterministic, offline, stdlib-only python3.
      - name: no internal reference reaches a crates.io front page
        run: python3 tools/check-crates-io-readmes.py

  # ADR-0017: the release shelf must stay buildable as the repo grows, and the
  # way it silently stops is a new dependency that does not compile for musl,
  # msvc or darwin. Without this, that breaks at RELEASE time — after the tag is
  # pushed — which is the worst possible moment to find out. `cargo check`
  # (rather than a full link) so ONE runner covers all five targets: rustup ships
  # std for every one regardless of host, and build scripts still run, so a
  # dependency that drags in a C toolchain fails here too. The real per-target
  # link happens in engine-release.yml on its own runners.
  #
  # The target list is NOT duplicated here — `tools/build-release-binaries.sh`
  # reads it out of `versions.toml [engine].targets`, the same list the release
  # matrix is checked against, and it states its binding count on every run.
  engine-shelf:
    # Name must stay exactly "engine binaries (cross-build shelf)" — it is a
    # required status context in branch protection; renaming it deadlocks every
    # PR (see .github/required-status-checks.txt).
    name: engine binaries (cross-build shelf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { key: cross-build-shelf }
      - name: every shelf target compiles
        run: bash tools/build-release-binaries.sh --check-only

  # The prefab generators are separate workspaces OUTSIDE `crates/` (so they never
  # enter the shipped `delvec`), which until now meant `cargo …--workspace` never
  # saw them and nothing in CI compiled, ran or checked them at all. Their whole
  # design is that every debugging lesson is pinned as an ASSERT — route
  # walkability, stair-flank sealing, anchor sanity, gravity substrate, sightlines
  # — so simply running each generator IS the gate: it either emits or panics.
  # Wired after the drowned-bell shipped a tileset with 132 reversed stair blocks
  # (`DW0430`, owner playtest 2026-08-03) through a green pipeline.
  prefab-generators:
    name: prefab generators (invariants + determinism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            prefabs/generator
            prefabs/cave-generator
            prefabs/island-generator
            prefabs/island-terrain-generator
            prefabs/tidal-keep-generator
      # fmt only. `clippy -D warnings` is deliberately NOT wired here yet: the
      # oldest generator (`prefabs/generator`) carries two pre-existing style
      # lints, and silencing them belongs in its own PR rather than riding along
      # with a stair fix. Tracked as a follow-up; the correctness gate below is
      # the one that matters and it covers all five.
      - name: cargo fmt --check each generator workspace
        run: |
          set -euo pipefail
          for g in generator cave-generator island-generator \
                   island-terrain-generator tidal-keep-generator; do
            cargo fmt --manifest-path "prefabs/$g/Cargo.toml" --all -- --check
          done
      # `prefabs/invariants.rs` is source-included by all five generators, so one
      # workspace's `cargo test` compiles and runs the shared gate's own unit
      # tests once — including the cases that prove it FAILS (a rock stacked on a
      # stair tread), which running the generators can only prove by not firing.
      - name: shared generator invariants — unit tests
        run: cargo test --locked --manifest-path prefabs/island-terrain-generator/Cargo.toml
      # Running the generator twice into different trees proves BOTH halves at
      # once: the invariants (a panic fails the job) and ADR-0006 byte-identity.
      - name: run every generator twice — invariants hold, output is identical
        run: |
          set -euo pipefail
          for g in generator cave-generator island-generator \
                   island-terrain-generator tidal-keep-generator; do
            echo "::group::$g"
            rm -rf "/tmp/$g-a" "/tmp/$g-b"
            mkdir -p "/tmp/$g-a" "/tmp/$g-b"
            cargo run --release --manifest-path "prefabs/$g/Cargo.toml" \
              -- "/tmp/$g-a" > /dev/null
            cargo run --release --manifest-path "prefabs/$g/Cargo.toml" \
              -- "/tmp/$g-b" > /dev/null
            diff -r "/tmp/$g-a" "/tmp/$g-b"
            echo "::endgroup::"
          done

  harness:
    name: harness (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  skin-tool:
    name: skin toolchain (pytest)
    # spec-0009: deterministic original 64x64 skin composition + headless preview
    # renderer. Proves same cast entry -> byte-identical PNG (ADR-0006) and that a
    # cast entry without `model` is rejected.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/skin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install (pinned skinpy-extended) + pytest
        run: pip install -r requirements.txt pytest
      - name: pytest (composition determinism + model-required contract)
        run: PYTHONPATH=. python -m pytest -q

  i18n-tool:
    name: i18n translation tool (pytest)
    # docs/reference/i18n.md: tools/i18n-translate.py drives an external
    # OpenAI-compatible LLM API at generation time. The suite proves the request it
    # would build, config resolution incl. the not-configured fallback, and that the
    # API key never leaves the named env var — with the network blocked at
    # `urlopen` (tools/tests/conftest.py), so no test can reach a real provider.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Stdlib-only tool (tomllib needs >=3.11); pytest is the only test dep.
      - run: pip install pytest
      - run: python -m pytest -q tools/tests

  mecha-crosscheck:
    name: mecha cross-check (PR only)
    # ADR-0011: mecha independently re-validates every emitted .mcfunction
    # against the 1.21.11 command tree. Disagreement with our vendored-tree
    # validator fails CI and is a bug in one of them. PR-only (metered minutes).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the build copies the prefab .nbt into the datapack — from the content repo
      - uses: ./.github/actions/checkout-content
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: install mecha + beet (pinned)
        run: pip install "mecha==0.104.1" beet
      - name: build the hello-world delve
        run: |
          cargo run --locked -p delvec --bin delvec -- \
            build crates/dsl/fixtures/valid/hello-world \
            -o out --prefabs campaigns/prefabs
      - name: mecha validates every emitted mcfunction
        run: python3 .github/scripts/mecha_crosscheck.py out/datapack

  docs:
    # Name must stay exactly "docs (local link check)" — it is a required
    # status context in branch protection; renaming it deadlocks every PR.
    name: docs (local link check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docs/reference/compiler.md is the authoritative current-behavior record;
      # its DW diagnostics catalog must match crates/**/*.rs exactly, both ways
      # (CLAUDE.md Methodology). Deterministic, offline, stdlib-only python3
      # (ubuntu-latest ships >=3.11).
      - name: DW-code catalog matches the compiler reference (both directions)
        run: python3 tools/check-dw-codes.py
      # Every owner decision this repo has written down is bound to the place it
      # landed, both directions. A `landed` row whose implementation is deleted
      # or renamed reds here; a decision written into an ADR, an owner-approved
      # spec's Status, or a dated `(owner …)` rule in CLAUDE.md with no ledger
      # row also reds. It rides in THIS job rather than a new one on purpose:
      # a new job needs a new required context, and an advisory gate is a gate
      # that does not gate (task #31). It also PRINTS the open and unenforced
      # decisions on every run — those lists are the deliverable, not a warning.
      - name: every recorded owner decision is bound to where it landed
        run: python3 tools/check-decisions.py
      # The same document's VERSION HEADER was bound to nothing. It claimed
      # `delvec 0.1.0`, `dsl 0.8.0` and listed dsl_version 0.2.0..0.8.0 while the
      # build was at delvec 1.1.0 / dsl 0.9.0 and accepted 0.9.0 — with the body
      # of that very file describing the v0.9 surface correctly. It is the first
      # thing an authoring session reads to pick a stage envelope's dsl_version,
      # so a stale claim there is acted on. Bound by EQUALITY in both directions:
      # the stale-OLDER direction is the one that happens (docs are written once,
      # the build moves), and a gate that only rejects "newer than the build" is
      # exactly what let a storybook ship a v1.0 marker through the whole v1.1
      # release green (engine #342). Deterministic, offline, stdlib-only python3.
      #
      # The same script now binds the same constants on the crates.io FRONT
      # PAGES, over the same derived publishable-crate set the README gate uses
      # (`tools/lib/publishable.py`). Those pages state the Minecraft version,
      # the `dsl_version` window and the minimum Rust — the facts a stranger acts
      # on — and they were bound to nothing, so the next `dsl_version` bump would
      # have made a published page wrong. Extending the checker that already owns
      # the question, rather than adding a second one, is deliberate: a parallel
      # mechanism is the privately-re-implemented-general-mechanism defect.
      - name: documented versions match the build (reference + crates.io pages)
        run: python3 tools/check-reference-versions.py
      # The bot tier's dsl_version allowlist (harness/src/critical-path.ts) must
      # never trail the compiler's own SUPPORTED_DSL_VERSION ceiling
      # (crates/dsl/src/envelope.rs) — nothing else in the repo relates the two
      # files, so a compiler version bump landed with zero signal to the harness
      # and the bot tier refused every campaign at the newest dsl_version, after
      # the server booted and the bot connected (task #157). Deterministic,
      # offline, stdlib-only python3.
      - name: harness dsl_version allowlist covers the compiler ceiling
        run: python3 tools/check-harness-dsl-version.py
      # Nothing in the type system stops a walk over the campaign's effects from
      # enumerating the five effect roots by hand, and thirteen of them did — each
      # naming a different three or four, none of them ever red, because a walk
      # that misses a root looks correct over any campaign that does not use it.
      # `delvewright_dsl::effects` is now the one enumeration and every walk
      # inherits it; this is what stops a fourteenth being written. It found two
      # live instances the manual sweep had missed on the run that introduced it.
      # Deterministic, offline, stdlib-only python3.
      - name: no walk enumerates the campaign's effect roots by hand
        run: python3 tools/check-effect-roots.py
      # Merge artifacts in the docs tree: a table row duplicated under one key, a
      # doubled heading, a stray conflict marker. Two branches appending rows at
      # the same table anchor merge cleanly and silently, so this class is
      # invisible to every other gate (owner finding 2026-08-03 — `shortcuts[]`
      # and `waves[].respawns_on_rest` each twice in the stage-5 table, one copy
      # naming the wrong diagnostic). Deterministic, offline, stdlib-only python3.
      # A capability must belong to the object class it acts on, not to the verb
      # that first needed it. Five ledgers — interaction bodies, baked
      # player-facing English, structural twins, cross-cutting modifiers with
      # holes, and effect bundles no enumeration reaches. Most entries are OPEN
      # FINDINGS (docs/notes/capability-ownership-audit.md); the gate's job is
      # that none can be added or removed in silence.
      - name: no capability is bound to the verb that first needed it
        run: python3 tools/check-capability-ownership.py
      - name: docs tree carries no duplicate rows/headings or conflict markers
        run: python3 tools/check-doc-dupes.py
      # The same merge class one level up from a duplicated row: a NUMBER stated
      # in prose whose subject the tree enumerates. One branch adds a tenth
      # teaching technique and moves the count in four places; another, which
      # never touches the library, adds a paragraph three lines above the index
      # table opening "Not a tenth technique … the nine below". `git merge-tree`
      # resolves them with no conflict — different regions of one file — and the
      # merged page says nine over its own table of ten. Measured on that tree:
      # `check-doc-dupes`, `check-dw-codes`, `check-reference-versions` and
      # `check-grammar-ir-compat` are all green, and so is this gate on either
      # branch ALONE. Bound as a registry of oracles rather than as an idiom
      # counter, so the next stated count is a row and not a second script
      # (CLAUDE.md: a capability belongs to the object class it acts on). States
      # its binding count; a page that has stopped stating its count is a red,
      # not a pass. Deterministic, offline, stdlib-only python3.
      - name: every count stated in the reference matches what decides it
        run: python3 tools/check-stated-counts.py
      # task #111: `docs/specs/spec-NNNN-*.md` and `docs/adr/NNNN-*.md` are both
      # picked by listing the directory and writing the next integer. Two new
      # files never produce a git conflict, so a per-branch "no duplicate number
      # in this tree" check is green on every branch that collides — the
      # collision exists only in the UNION of two trees, and nothing computed
      # that union. PR #361 (`spec-0033-declared-body-traversal.md`, opened
      # 2026-08-09, left open) and a later PR (`spec-0033-grammar-corpus.md`,
      # listed `docs/specs/` on a `main` that did not yet have #361's file)
      # held number 0033 for three days; a human reading PR titles caught it.
      # This gate fetches `origin/main` (same host `actions/checkout@v4` above
      # already reached — not a new external dependency) and diffs this
      # checkout's numbered files against it directly, rather than trusting
      # that the checked-out tree already IS the merge preview. Deterministic
      # given that fetch; the script itself takes no further network action.
      # What it cannot see — another open PR that has not yet merged into
      # `origin/main` — is stated in the script's own docstring, not buried.
      - name: fetch origin/main for the numbering-uniqueness gates
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: no spec or ADR number collides with origin/main after this merges
        run: python3 tools/check-numbered-doc-uniqueness.py
      # The same defect one layer down, on a different kind of number. A version
      # ledger is picked exactly the way a spec number is — list what exists,
      # write the next one — so two branches take the same number for different
      # surfaces and both are green. PR #413 wrote `MIRROR_SINCE = "1.1.0"` and
      # PR #417 wrote `CONTRACT_SINCE = "1.1.0"` into the same new file. Those
      # two DO conflict textually; the hazard is the resolution, because
      # unioning both constants under one `1.1.0` compiles, passes clippy, and
      # ships an engine that accepts a `1.1.0` document written against the
      # construct it does not implement and silently drops it — ADR-0018 §7's
      # failure, reintroduced by the fence's own numbering. Covers every version
      # ledger in the repo (grammar `Program` version, campaign `dsl_version`),
      # not one crate. Uses the fetch above; no further network action. What it
      # cannot see, and where `dsl_version`'s anchors are self-naming so its
      # first rule cannot bind, are both in the script's own docstring.
      - name: no version number names two surfaces after this merges
        run: python3 tools/check-version-ledger-uniqueness.py
      # A required status check answers for the uptime of every host it reaches,
      # and a git dependency is the reach nothing in cargo's surface lets a job
      # decline: it is cloned during RESOLUTION of the workspace that declares it,
      # a workspace resolves all its members, and neither `-p <crate>` nor
      # `--locked` nor `optional` narrows that (all three measured). So one git
      # dependency put `cargo run -p delvec` — five required jobs, none of which
      # build the crate that declared it — behind 227 MB of clone from two
      # repositories, and a transient TLS failure there reddened `tier 2` on a
      # docs-only PR (#388). Same class as this job's own `lychee --offline` and
      # as task #41's single Mojang fetch, now as a gate rather than as three
      # separate lessons. States its binding count; an allowlisted lock that has
      # stopped carrying one is a finding too. Deterministic, offline,
      # stdlib-only python3.
      - name: no workspace resolves a git dependency it does not quarantine
        run: python3 tools/check-workspace-git-deps.py
      # Isolation by construction (task #185, validation/README.md): container
      # names and host ports are Docker-GLOBAL — the only two things `docker
      # compose -p <project>` does not isolate — so validation/compose.yaml
      # carries neither, and two ladders run side by side with no mutex. Only
      # owner-play.yaml may bind 25565. Re-introducing a pin cost a run twice
      # under the old override regime (`server` #190, then `bot`).
      # Deterministic, offline, stdlib-only python3.
      - name: validation compose carries no Docker-global name or port
        run: python3 tools/check-compose-isolation.py
      # `cmd | grep -q` under `set -o pipefail` is a coin flip that reports FAILURE
      # *because* the match succeeded: grep exits at the first hit, the producer
      # dies of SIGPIPE (141), and pipefail promotes 141 to the pipeline. Measured
      # on a live server that was up and had logged `Done (`: 28 false negatives in
      # 30 runs. It cost two owner playtest stagings ("server did not come up") and
      # it silently disarmed the 25565 guards — the same shape decides whether the
      # owner's mutex may be released while a human is playing (task #173/#16).
      # Deterministic, offline, stdlib-only python3.
      - name: no early-exit consumer on the right of a pipe (SIGPIPE + pipefail)
        run: python3 tools/check-shell-pipe-shortcircuit.py
      # A command whose response nobody reads cannot fail. `delve-admit`'s gallery
      # emitted four legacy camelCase gamerules and a `text_opacity:255b`; 1.21.11
      # refused `admit:load` and `admit:finish` outright, so the gallery world came
      # up with no objectives, nothing forceloaded and nothing placed — and every
      # test was green, because nothing had ever read a reply. The jump-arc rig set
      # `gamerule fallDamage false` one line above a comment asserting the bot took
      # no fall damage; the warden pad used `doMobSpawning`/`randomTickSpeed`. This
      # binds two rules to the tree: a live command site goes through the shared
      # rejection rule (tools/lib/rcon.{sh,mjs}), and a `gamerule` line names a rule
      # the PINNED command tree actually has, so it can never drift from ADR-0009.
      # Deterministic, offline, stdlib-only python3.
      - name: no command is issued to a server that cannot answer back (task #70)
        run: python3 tools/check-live-commands.py
      # The v1.0.0 release run (2026-08-06) found both of the next two, in the
      # release machinery itself, on the first path CI had never exercised.
      #
      # Python's text-mode stdout writes `\r\n` on Windows, so every value a
      # `python3` heredoc handed to bash arrived with a trailing `\r` — and
      # `x86_64-pc-windows-msvc` compared unequal to itself on the msvc runner and
      # ONLY there, while the four unix targets went green. The rule is "every
      # inline python that prints pins its newline", not "every captured one",
      # because the site that actually broke was a heredoc inside a shell function
      # whose capture happens at three separate call sites — an invocation-site
      # checker would have passed the one bug it exists to catch. Covers workflow
      # `run:` blocks too: `.github/actions/checkout-content` writes straight into
      # `$GITHUB_OUTPUT`. Deterministic, offline, stdlib-only python3.
      - name: inline python pins its stdout newline (CRLF on Windows runners)
        run: python3 tools/check-python-shell-newlines.py
      # `cmd >"$LOG"` is opened by the SHELL before `cmd` runs. The preflight job's
      # runner restored no cache, so `target/` did not exist, the redirect failed,
      # `cargo package` NEVER RAN — and the else-branch then `sed`ed the log that
      # the failure had prevented from existing, reporting "cargo package failed"
      # about a command that had not been executed. An error path must not depend
      # on an artifact the error may have prevented from existing; this removes the
      # root cause by requiring the directory to be guaranteed first. The other
      # half — an honest message when the log is missing or empty — is exercised in
      # tools/tests/test_check_shell_redirect_dirs.py, since syntax cannot check a
      # message. Deterministic, offline, stdlib-only python3.
      - name: every redirect writes into a directory the script guarantees exists
        run: python3 tools/check-shell-redirect-dirs.py
      # A grammar `Program` is a long-lived on-disk document (ADR-0018 §4/§5), and
      # the two ways it grows new surface are not equally safe. A new variant of a
      # tagged enum is safe — an older engine meets an `"op"` it does not know and
      # fails loud at serde, and every exhaustive match forces an arm. A
      # `#[serde(default)]` STRUCT FIELD is not: it rides through every walk
      # untouched in both directions, so an engine that predates the field
      # deserialises the document with the field's default, expands, passes every
      # gate, and writes different geometry with nothing to say about it. That is
      # what `reorient.mirror` would have done. ADR-0018 §7 answers it with closed
      # schemas plus a version fence, and neither is worth anything as a
      # convention: this is what makes "someone added an optional field and did
      # not fence it" an ordinary red instead of a silently different world two
      # engines apart. Bidirectional against `grammar.md` §2e, and a version above
      # the floor must be REFUSED by name in `ir.rs` — a constant nothing enforces
      # is not a fence. Deterministic, offline, stdlib-only python3.
      - name: every optional field of the grammar IR is closed or fenced
        run: python3 tools/check-grammar-ir-compat.py
      # EVERY job here is a required status check (owner decision 2026-08-05; it was
      # three, so `tier 2` — datapack load plus the whole PackTest suite — never
      # blocked a merge). Branch protection matches a required context by its NAME
      # STRING: rename a job and its context stops reporting forever, blocking
      # every PR including the one that would fix it. This keeps ci.yml's job names
      # and `.github/required-status-checks.txt` in lockstep, in BOTH directions —
      # a job with no line there is a gate nobody must obey, which is exactly how
      # the seven drifted into advisory. Reads only the repo: CI's token cannot see
      # branch protection, and a gate needing a privileged token is a gate that
      # quietly stops running. Deterministic, offline, stdlib-only python3.
      - name: required status checks and ci.yml job names agree
        run: python3 tools/check-required-contexts.py
      # ADR-0016's third version line: the `/new-delve` skill (the product,
      # ADR-0012) declares its own version and the `delvec` range it drives. All
      # hand-typed frontmatter, so without this they are a `requires:` nobody
      # reads — the unbound declaration this project keeps being bitten by (the
      # island's combat floor gate was green for nineteen rounds having examined
      # zero enemies). Two declarations, two DIFFERENT claims, so two bindings:
      # `requires.delvec` is a COMPATIBILITY window (ADR-0016's own major-window
      # shape) checked by MEMBERSHIP — this repo's engine must fall inside it;
      # `verified_with` is EVIDENCE checked by EQUALITY against
      # `crates/compiler/Cargo.toml`'s version (== DELVEC_VERSION), both
      # directions. Pinning the window's floor to the engine instead would make
      # the frontmatter assert, after every release, that older engines are
      # unsupported — untested, and probably false. Plus: every `delvec`
      # subcommand and flag the skill names must exist in the clap CLI in
      # `crates/compiler/src/main.rs`, which is what makes the window a claim
      # about a real command surface. States its binding count; extracting zero
      # subcommand references is a red. What it does NOT prove — a window floor
      # that has drifted too LOW — is stated in the script's own docstring.
      # A STEP, not a job: every job name here is a required status context and
      # renaming/adding one is a three-part change (see required-status-checks.txt).
      # Deterministic, offline, stdlib-only python3.
      - name: the /new-delve skill's declared delvec range is true
        run: python3 tools/check-skill-version.py
      # A trial's rubric answer is a judgement, and a judgement is bounded by the
      # instrument that took the picture. Trial 0001 answered R1 `partial` for
      # run 1 and, three paragraphs later, recorded that the renderer had no
      # camera an author could aim and that this "alone is the whole of R1's
      # partial". The verdict is what later rounds cite; the disclaimer is not.
      # Re-photographed square-on from the same delivered bytes, the answer was
      # `yes` — the record understated its own result for as long as it existed.
      # So every judged verdict declares `artifact-bound`, or `instrument-bound`
      # with the blocker NAMED so it can be fixed and the verdict re-taken. It
      # rides in this job because a new job needs a new required context, and an
      # advisory gate does not gate. Deterministic, offline, stdlib-only python3.
      - name: every judged trial verdict declares what bounded it
        run: python3 tools/check-trial-verdicts.py
      # --offline: check only local/internal links — the ones this repo can
      # actually keep true. This used to be justified by the repo being private;
      # it is PUBLIC, so that premise was false, but the flag is still right for
      # the reason that always held: an external link check makes a required
      # status depend on third-party uptime, i.e. it manufactures intermittent
      # reds — and an intermittent red is never re-run here, it is root-caused
      # (CLAUDE.md), which is not a budget any external host earns.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --no-progress './**/*.md'"
          fail: true

  storybook-version:
    # A campaign's storybook is what a server host reads before running the
    # delve, and the ONE piece of internal machinery it may carry (owner ruling,
    # task #147) is which engine the delve needs. That is a hand-typed number, so
    # it goes stale the moment the campaign adopts a new `dsl_version` — and a
    # stale one is worse than none: it waves a host on an old engine through.
    # This gate re-derives it from the campaign's own stage documents.
    #
    # Its own job, not a step in `docs`: `docs` runs lychee over `./**/*.md`, and
    # checking the content repo out into that job's tree would silently widen the
    # link check to content-repo markdown (and `docs (local link check)` is a
    # required status context — its name may not move).
    name: campaign storybooks (engine-version marker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Text-only gate — the campaign JSON and the storybooks, never the .nbt
      # bodies, so LFS stays off and the checkout is a few hundred KB.
      - uses: ./.github/actions/checkout-content
        with:
          lfs: "false"
      # Deterministic, offline, stdlib-only python3.
      - name: every campaign storybook carries a TRUE engine-version marker
        run: python3 tools/check-storybook-version.py

  # Every gate above this line builds a FIXTURE. Nothing in CI had ever built a
  # real campaign, so the product could stop compiling with the whole board
  # green: PR #260 reached 10/10 while stopping the flagship released campaign
  # `nobodys-cave-island` from building at all (26 × `DW0364` on standable cells
  # at the ocean line). Fixtures exercise one verb each; a campaign is where the
  # verbs meet a real prefab library, a real layout solve and a real translation
  # sidecar, and that is the surface an engine change breaks.
  #
  # Campaigns are DISCOVERED in the pinned content checkout, never listed here,
  # so a new campaign on content `main` is gated by the next re-pin with nobody
  # remembering. A campaign that cannot build today is recorded in
  # `.github/campaign-build-exclusions.toml`, which INVERTS the assertion instead
  # of removing it — the campaign is still built and must still fail with exactly
  # the codes recorded there, so neither a new break hiding behind an exclusion
  # nor an exclusion that has expired can pass. Every run states its binding
  # count (CLAUDE.md: a green gate that binds to nothing is VACUOUS).
  #
  # Its own job, not a step in `rust`: a campaign build is minutes of layout
  # solving, and burying it inside the fmt/clippy/test job would make one status
  # answer two unrelated questions. On every push, not PR-only — a change that
  # breaks a released campaign must not be able to sit on a green board for the
  # window between push and PR.
  campaign-builds:
    # Name must stay exactly "campaign builds (every campaign in the content
    # repo)" — it is a required status context in branch protection; renaming it
    # deadlocks every PR (see .github/required-status-checks.txt).
    name: campaign builds (every campaign in the content repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # LFS on (the default): a campaign build copies the prefab `.nbt` BODIES
      # into the datapack, so pointers would fail here for a reason that has
      # nothing to do with the engine change under test.
      - uses: ./.github/actions/checkout-content
      - uses: Swatinem/rust-cache@v2
        with: { key: campaign-builds }
      # Built once and handed to the driver, rather than a `cargo run` per
      # campaign per language: the gate's subject is WHICH engine built the
      # campaign, so the binary is named explicitly and the script never infers
      # one. Dev profile — the workspace sets `opt-level = 1` for it (PR #313),
      # which is what makes a real layout solve affordable on every push.
      - name: build the engine under test
        run: cargo build --locked -p delvec --bin delvec
      - name: every campaign in the pinned content repo still builds
        run: python3 tools/build-every-campaign.py --delvec target/debug/delvec

  # ------------------------------------------------------------------ tier 2 --
  # spec-0004 tier 2 (every PR): build the delve, prove it loads with zero errors
  # on the pinned vanilla server, and run the generated PackTest suite headless.
  # PR-only (metered minutes); target < 10 min.
  tier2-validation:
    name: tier 2 (datapack load + PackTest)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Accepting Mojang's EULA (https://aka.ms/MinecraftEULA) is the standing
      # action of whoever operates this repository, for their own CI pipeline
      # (ADR-0010). Anyone who runs this workflow — including in a fork — thereby
      # accepts the Minecraft EULA for that run. The itzg base fetches the server
      # jar at run time; it is never baked into or published from CI.
      EULA: "TRUE"
    steps:
      - uses: actions/checkout@v4
      # delvec copies the prefab .nbt into the datapack — from the content repo
      - uses: ./.github/actions/checkout-content

      # ---------------------------------------------------------------- task #41 --
      # THE one live Mojang fetch of this job. The server jar is never baked into an
      # image (ADR-0010, EULA), so each server bootstraps it at first boot — and this
      # job boots SEVEN of them over seven fresh volumes (the datapack-load check
      # plus six PackTest suites, each its own compose project). That was seven
      # independent chances for one Mojang blip to red a REQUIRED status check for a
      # reason with nothing to do with the delve: PR #312 died on the 5th of 6 suites
      # at `launchermeta.mojang.com ... Network is unreachable`, before any datapack
      # was evaluated, on the same runner and digest four suites had just passed on.
      #
      # This fetches the pinned jar ONCE, verifies it against versions.toml's
      # server_jar_sha256, and materialises the Fabric bootstrap beside it. Every
      # boot below then copies from it and reaches `Done (` with no network at all
      # (measured under `--network none`, both server types).
      #
      # It is deliberately the FIRST step that can fail: when Mojang really is down
      # the job reds here, in a step named `bootstrap`, before a compiler is built or
      # a server starts — never inside a step named for a datapack.
      - name: bootstrap — one live Mojang fetch for the whole job
        run: bash validation/server-bootstrap-cache.sh

      - uses: Swatinem/rust-cache@v2
      # Built ONCE and handed to the nine build steps below, the same shape the
      # `campaign builds` job uses. Every one of those steps is named for a
      # fixture, and a `cargo run` per step let any of them fail for a reason with
      # nothing to do with its fixture: #388 reddened "build the hello-world delve
      # output" with a TLS error from cargo's dependency resolution. Resolution is
      # now one step that says it is the compiler build, and `--locked` forbids it
      # from re-resolving (and so from reaching the network) at all.
      - name: build the engine under test
        run: cargo build --locked -p delvec --bin delvec
      - name: build the hello-world delve output
        run: |
          target/debug/delvec \
            build crates/dsl/fixtures/valid/hello-world \
            -o validation/delve-output --prefabs campaigns/prefabs

      # spec-0005: the delve image now builds FROM ghcr.io/stellarfeline/delvewright-base
      # by digest (Dockerfile.delve), so this pulls the base from GHCR — no Docker Hub.
      - name: build the delve image (ADR-0010; no jar, no mods)
        run: |
          docker build -f validation/Dockerfile.delve \
            -t delvewright/delve:ci validation/delve-output

      # spec-0006 exclusion criterion (same pattern as the PackTest/mods exclusion):
      # the playtest-only creator overlay must NEVER be baked into the shipped delve
      # image. Dockerfile.delve copies only datapack/, server/, manifest.json and
      # critical-path.json — assert no creator artifact rode along (the overlay is a
      # separate build-output dir + a runtime-only compose mount).
      - name: creator overlay is EXCLUDED from the shipped delve image
        run: |
          # No overlay datapack directory baked in.
          if docker run --rm --entrypoint sh delvewright/delve:ci \
               -c 'ls -d /delve/creator* 2>/dev/null'; then
            echo "::error::creator overlay directory present in the shipped delve image"; exit 1
          fi
          # No overlay COMMAND content anywhere in the image. `DelveNote`/`dw.note`
          # appear only in the overlay's .mcfunctions, never in the shipped datapack
          # (asserted at compile time too). NOTE: manifest.json legitimately lists
          # every build-output PATH — incl. creator-datapack/ and packtest-datapack/
          # — as provenance, so a path-level `creator/` grep would false-positive on
          # it; the content signatures below do not.
          if docker run --rm --entrypoint sh delvewright/delve:ci \
               -c 'grep -rlqE "DelveNote|dw\.note" /delve 2>/dev/null'; then
            echo "::error::creator overlay commands leaked into the shipped delve image"; exit 1
          fi
          echo "creator overlay correctly excluded from the delve image."

      # NOTE (2026-07-30, first live run): a jar actions/cache with a single-file ro
      # bind mount was removed here — itzg's installer replaces the jar via rename,
      # which cannot target a bind-mounted file ("Device or resource busy"), and the
      # runner fetches piston-data at >100 MB/s (<1s for the jar), so the cache
      # optimized nothing and added a failure mode.
      #
      # 2026-08-05 (task #41): that note is still binding, and this is not it coming
      # back. The jar is never bind-mounted — the bootstrap overlay is COPIED into a
      # writable world volume, so itzg's rename-into-place still works. And the point
      # is not speed (the note is right that there was none to win): it is that this
      # job made SEVEN independent live bootstraps and any one of them reddened a
      # required check. Seeding from the job's single verified fetch takes that to
      # one. Nothing is cached ACROSS jobs, so there is no stale-cache failure mode
      # to add back.
      - name: datapack loads on the pinned vanilla server with ZERO errors
        run: |
          # Seed this boot's world volume from the job's one verified fetch. The
          # seeding container uses the delve image itself, so Docker populates the
          # empty volume from the image first and the overlay lands on top.
          docker volume create dw-ci-delve-data
          docker run --rm -v dw-ci-delve-data:/data \
            -v "$PWD/validation/server-cache:/seed:ro" \
            --entrypoint /bin/bash delvewright/delve:ci \
            -c 'cp -a /seed/. /data/ && chown -R 1000:1000 /data'
          docker run -d --name delve-ci -e EULA=TRUE \
            -e PAUSE_WHEN_EMPTY_SECONDS=-1 -v dw-ci-delve-data:/data delvewright/delve:ci
          # Wait up to ~5 min for world gen + datapack load to finish.
          for i in $(seq 1 60); do
            if docker logs delve-ci 2>&1 | grep -qE 'Done \([0-9]'; then break; fi
            if [ "$(docker inspect -f '{{.State.Status}}' delve-ci)" = "exited" ]; then break; fi
            sleep 5
          done
          docker logs delve-ci > boot.log 2>&1
          docker rm -f delve-ci >/dev/null
          docker volume rm -f dw-ci-delve-data >/dev/null
          echo "----- server boot log (tail) -----"; tail -n 20 boot.log
          if ! grep -qE 'Done \([0-9]' boot.log; then
            echo "::error::server never finished starting"; exit 1
          fi
          # BINDING (CLAUDE.md: a green gate that binds to nothing is VACUOUS). The
          # seed is only worth something if THIS boot used it, so assert itzg took
          # the cache-hit path and fetched nothing. Without this the overlay could
          # silently miss and the job would stay exactly as fragile while green.
          if ! grep -qF 'is already installed' boot.log; then
            echo "::error::the seeded boot still bootstrapped the server jar live —"
            echo "  the overlay did not bind, so this job is still one Mojang blip from red"
            exit 1
          fi
          echo "bootstrap binding: seeded, 0 live fetches on this boot."
          # The datapack-load criterion (spec-0002): no server-side ERROR lines.
          if grep -E '\[[^]]*/ERROR\]' boot.log; then
            echo "::error::datapack produced load errors on the live server"; exit 1
          fi
          echo "datapack loaded with zero errors."

      # Every PackTest pass below goes through `packtest-run.sh --project <id>`:
      # the entry script REQUIRES the project id (task #185), which is the only
      # name a ladder has now that compose.yaml pins none — and it tears its own
      # project down and proves it clean, so no pass can leave state for the next.
      - name: PackTest suite (headless, exit code = failed tests)
        run: bash validation/packtest-run.sh --project dw-ci-helloworld

      # spec-0020 — the cast ledger's templates need a campaign that HAS a ledger.
      # A generated PackTest only exists for a campaign that emits it, and
      # hello-world (one quest, one NPC) cannot carry a dialogue-root SWAP: there is
      # no second beat to swap to. Growing it would mean raising it to dsl 0.7.0,
      # which changes the is_v03/is_v04 emission gating a large set of
      # determinism-pinned tests assert on — so the fixture gets its own tier-2 pass
      # instead. Without this the three templates are shape-verified in Rust and
      # never actually RUN, which is not what spec-0020's acceptance criteria say.
      # Cost: one extra toolserver boot (~1 min); the image is already pulled and
      # the compiler is already built, so there is no new pull and no new compile.
      - name: build the cast-ledger delve output (spec-0020)
        run: |
          target/debug/delvec \
            build crates/compiler/tests/fixtures/cast-ledger \
            -o validation/delve-output-cast --prefabs campaigns/prefabs

      - name: PackTest suite — cast ledger (root swap, bark delivery, explicit none)
        run: |
          bash validation/packtest-run.sh --project dw-ci-cast \
            --output ./delve-output-cast

      # `requires_item` is HELD, not carried (owner ruling, 2026-08-03) — and the
      # template that proves it, `verb_interact_held`, is emitted only for a campaign
      # that HAS a gated `interact`. hello-world has no `interact` objective at all,
      # so without this pass neither it nor `verb_interact` ever runs on a real
      # server: exactly the shape-verified-but-never-RUN gap the cast-ledger pass
      # above exists to close, one verb further on. keep-trial is the smallest valid
      # fixture carrying `interact` + `requires_item` (plus kill/collect/flag-gate,
      # which come along free). Same cost profile: one extra toolserver boot, no new
      # pull, no new compile.
      - name: build the keep-trial delve output (held-item interact)
        run: |
          target/debug/delvec \
            build crates/dsl/fixtures/valid/keep-trial \
            -o validation/delve-output-keeptrial --prefabs campaigns/prefabs

      - name: PackTest suite — keep-trial (`requires_item` is HELD, not carried)
        run: |
          bash validation/packtest-run.sh --project dw-ci-keeptrial \
            --output ./delve-output-keeptrial

      # spec-0016 §1 — the whole souls RETRY LOOP was shape-verified in Rust and
      # never actually RUN. hello-world has no bonfire, so `souls_bonfire_rest`,
      # `souls_bonfire_reseat`, `souls_bonfire_options`, `souls_reseat_stationed`
      # and `wave_census` existed as generated files nothing executed. The
      # stationed-re-seat ruling (owner, 2026-08-04) is a claim about what a live
      # server does with a re-summoned wave, so it is proven on one. Same cost
      # profile as the two passes above: one extra toolserver boot, no new pull,
      # no new compile.
      - name: build the souls-bonfire delve output (spec-0016 §1)
        run: |
          target/debug/delvec \
            build crates/compiler/tests/fixtures/souls-bonfire \
            -o validation/delve-output-bonfire --prefabs campaigns/prefabs

      - name: PackTest suite — souls-bonfire (rest, re-seat, stationed re-seat)
        run: |
          bash validation/packtest-run.sh --project dw-ci-bonfire \
            --output ./delve-output-bonfire

      # spec-0016 §6 — same gap on the other half of the ruling. The TD-lane
      # templates (`souls_td_patrol_nbt`, `souls_td_lane_march`,
      # `souls_td_lane_release`, `souls_td_lane_reseat`, `souls_td_aggro_edge`)
      # are emitted only for a campaign that HAS a lane, and no fixture with one
      # was ever booted — including the codec-trap test, whose entire reason to
      # exist is that a wrong `patrol_target` key is invisible to every static
      # proof. A bonfire cannot legally stand beside a lane in this corridor
      # tileset (`DW0478`), so the lane half of the stationed re-seat is proven
      # here, on the re-summon itself, rather than through a rest.
      - name: build the souls-td-lanes delve output (spec-0016 §6)
        run: |
          target/debug/delvec \
            build crates/compiler/tests/fixtures/souls-td-lanes \
            -o validation/delve-output-lanes --prefabs campaigns/prefabs

      - name: PackTest suite — souls-td-lanes (patrol NBT, march, release, re-seat)
        run: |
          bash validation/packtest-run.sh --project dw-ci-lanes \
            --output ./delve-output-lanes

      # task #184 — the timed-gate `disarm` (the hazard ladder's third rung). The
      # claim is about what a live server does across cycle boundaries AFTER the
      # jam: that no scheduled close ever re-seals the span. A static test can only
      # read the guard; only a server proves it holds. Measured red->green on the
      # pinned toolserver: with the `#tgdis_<id>` guard stripped from
      # `tgate_close_<id>` the template fails, with it the suite is green. (The
      # assertion deliberately lands immediately after each close — an earlier
      # version asserted after the following open and passed against the unguarded
      # build, because the open clears the span either way.) Same cost profile as
      # the passes above: one extra toolserver boot, no new pull, no new compile.
      # spec-0031 — a lethal volume is a RUNTIME mechanism, and a compile-time proof
      # that its box is impassable proves nothing about whether the box kills. The
      # generated templates are emitted only for a campaign that HAS a volume, and
      # no existing fixture declares one, so without this pass the whole runtime
      # half is shape-verified in Rust and never actually RUN — the same gap the
      # cast, bonfire and lane passes above exist to close. TWO templates per
      # volume, each red for its own reason, both measured on the pinned
      # toolserver: `lethal_<id>` (a body enters the box and dies) fails with the
      # damage amount stripped to 0 ("Expected #hp_leth ..0, but got 2000"), and
      # `lethal_<id>_claim` (the wording is withheld when nothing lands) fails with
      # the player line deleted from the volume's driver ("Expected #leth_hp 1..,
      # but got 0"). A PackTest fake player is permanently undamageable — measured,
      # 202 ticks — so neither template asserts a player DEATH; that claim belongs
      # to the bot tier. Same cost profile: one extra toolserver boot, no new pull,
      # no new compile.
      - name: build the lethal-volume delve output (spec-0031)
        run: |
          target/debug/delvec \
            build crates/compiler/tests/fixtures/lethal-volume \
            -o validation/delve-output-lethal --prefabs campaigns/prefabs

      - name: PackTest suite — lethal-volume (a body enters the box and dies)
        run: |
          bash validation/packtest-run.sh --project dw-ci-lethal \
            --output ./delve-output-lethal

      # spec-0031 — a `teleport`'s TOTALITY is half a compiler fact and half a
      # vanilla fact. The Rust test proves the compiler wrote no filter into the
      # selector; only a live server can say that vanilla's `@e[<box>]` really
      # reaches every entity type, and that half is the whole acceptance
      # criterion. The template calls the campaign's REAL generated
      # `teleport_<key>` function — not a command it re-typed — puts one
      # `zombie`, `interaction`, `marker`, `text_display` and `item` in the
      # volume (the four an exemption list of `LETHAL_EXEMPT_TYPES`'s shape would
      # have dropped, beside a content body), asserts all five are inside the
      # box, runs the function and asserts the box is empty. Measured red->green
      # on the pinned toolserver: with `,type=!minecraft:interaction` added to
      # the emitted selector the template fails "Expected #tp_left 0, but got 1".
      # Same cost profile as the passes above: one extra toolserver boot, no new
      # pull, no new compile.
      - name: build the teleport-volume delve output (spec-0031)
        run: |
          target/debug/delvec \
            build crates/compiler/tests/fixtures/teleport-volume \
            -o validation/delve-output-teleport --prefabs campaigns/prefabs

      - name: PackTest suite — teleport-volume (everything in the box moves)
        run: |
          bash validation/packtest-run.sh --project dw-ci-teleport \
            --output ./delve-output-teleport
      # spec-0032 — trade and the recovery stake. Two templates, and each covers
      # exactly what THIS tier can witness. `v10_shop_purchase` drives an offer
      # handler and proves the debit and the refusal; `v10_stake_embers` drives the
      # drop and the collect and proves the declared share leaves the purse, a
      # marker really stands where the drop put it, collecting returns exactly what
      # was taken, and a second collection returns nothing more. Neither asserts a
      # player DEATH: a PackTest fake player is permanently undamageable (measured
      # twice, 2026-08-03 and 2026-08-09), so the death edge — and the walk back to
      # the anchor the placement table chose — is the bot tier's claim (spec-0032
      # AC9), and no template is generated that would appear to cover it. Same cost
      # profile as the passes above: one extra toolserver boot, no new pull, no new
      # compile.
      - name: build the economy delve output (spec-0032)
        run: |
          target/debug/delvec \
            build crates/compiler/tests/fixtures/economy \
            -o validation/delve-output-economy --prefabs campaigns/prefabs

      - name: PackTest suite — economy (a purchase debits; a stake gives back)
        run: |
          bash validation/packtest-run.sh --project dw-ci-economy \
            --output ./delve-output-economy

      # spec-0031 acceptance criterion 9 — the LIFT, authored entirely in campaign
      # JSON. The compiler gains nothing for it: `tests/fixtures/lift` is the
      # owner's timing table written as the steps of one `sequence` over the five
      # v0.10 primitives, and `tests/v10_lift.rs` reads it back off the emission.
      # This pass is what stops that from being a compile-time-only green: the
      # campaign really loads, and BOTH rides' `teleport_<key>` templates — step 5
      # of the table, the only step this tier has a generated template for — run
      # on the pinned server. Binding: the fixture emits 7 templates and the suite
      # reports 8 tests — the +1 is the framework's own and is systematic (
      # lethal-volume and teleport-volume emit 11 and report 12). Two of the 7 are
      # the lift's own rides: `validation/teleport-gate.json` says declared 2,
      # resolved 2, packtest_templates 2, unbound false.
      #
      # This pass caught the fixture's first draft, and the shape is worth keeping.
      # `lift:campaign` failed here — "Expected #party dw.campaign to match 1, but
      # got 0 on tick 0" — while the SAME tree went green locally, because the
      # generated `campaign` template re-drives the quest chain without clearing
      # the `dw.q_<q>` latch `check_q_<q>` reads, and the draft fixture's whole
      # critical path sat in the spawn box that `join_place` drops every dummy
      # into, so the world tick finished the delve unaided. Verdict by batch
      # order, on byte-identical packs. The fixture is fixed (its finale is gated
      # on a flag only a ride sets); the template's own-init gap is an open
      # finding for its own round. So: a green here does NOT prove
      # order-independence — `v10_lift::the_finale_cannot_be_completed_by_standing_still`
      # is what does, because it reads the emission rather than one run.
      #
      # What this pass deliberately does NOT claim: the sequence's own TIMELINE.
      # The engine generates PackTest templates per verb and has none for a
      # `sequence`, so ticks 0/1/3/4 — the ride latch, the fill, the clear and the
      # floor record — are proven off the emitted functions in Rust and not on a
      # server. That is named debt, not an oversight (docs/reference/compiler.md,
      # the criterion-9 bullet). Same cost profile as the passes above: one extra
      # toolserver boot, no new pull, no new compile.
      - name: build the lift delve output (spec-0031 AC9)
        run: |
          target/debug/delvec \
            build crates/compiler/tests/fixtures/lift \
            -o validation/delve-output-lift --prefabs campaigns/prefabs

      - name: PackTest suite — lift (both rides move everything in the car)
        run: |
          bash validation/packtest-run.sh --project dw-ci-lift \
            --output ./delve-output-lift

      - name: build the souls-timed-gate-disarm delve output (task #184)
        run: |
          target/debug/delvec \
            build crates/compiler/tests/fixtures/souls-timed-gate-disarm \
            -o validation/delve-output-tgdisarm --prefabs campaigns/prefabs

      - name: PackTest suite — souls-timed-gate-disarm (jam, then no re-seal)
        run: |
          bash validation/packtest-run.sh --project dw-ci-tgdisarm \
            --output ./delve-output-tgdisarm
