name: CI (tiers 1 + 2)

# spec-0004: tier 1 (unit + static analysis) on every push/PR; tier 2 (delve
# datapack-load check + PackTest suite) on PRs. Tier 3 (bot playthrough +
# multi-arch image push) lives in release.yml, on rc-* tags.
# push is limited to main so PR branches don't run every job twice
# (push + pull_request); Actions minutes are metered while the repo is private.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # spec-0005 tier 1: versions.toml is the single source of truth. Fails if any
  # Dockerfile/compose/workflow hardcodes a version/digest that disagrees with it.
  manifest:
    name: manifest consistency (versions.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest ships python3 (>=3.11, has stdlib tomllib) and bash.
      - name: consumers agree with versions.toml
        run: bash validation/check-versions.sh

  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The compiler tests read the git-lfs prefab (prefabs/hello-room.nbt);
          # the ADR-0006 double-build byte-identity gate runs inside
          # `cargo test --workspace` (tests/cli.rs::build_is_byte_identical...).
          lfs: true
      # rust-toolchain.toml pins the channel + clippy/rustfmt components,
      # which rustup on the runner installs automatically.
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test (incl. determinism double-build gate)
        run: cargo test --workspace

  harness:
    name: harness (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  mecha-crosscheck:
    name: mecha cross-check (PR only)
    # ADR-0011: mecha independently re-validates every emitted .mcfunction
    # against the 1.21.11 command tree. Disagreement with our vendored-tree
    # validator fails CI and is a bug in one of them. PR-only (metered minutes).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # the build copies the prefab .nbt into the datapack
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: install mecha + beet (pinned)
        run: pip install "mecha==0.104.1" beet
      - name: build the hello-world delve
        run: |
          cargo run -p delvewright-compiler --bin delvec -- \
            build crates/dsl/fixtures/valid/hello-world \
            -o out --prefabs prefabs
      - name: mecha validates every emitted mcfunction
        run: python3 .github/scripts/mecha_crosscheck.py out/datapack

  docs:
    name: docs (local link check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --offline: check only local/internal links. The repo is private, so
      # external-link checks would fail or flake.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --no-progress './**/*.md'"
          fail: true

  # ------------------------------------------------------------------ tier 2 --
  # spec-0004 tier 2 (every PR): build the delve, prove it loads with zero errors
  # on the pinned vanilla server, and run the generated PackTest suite headless.
  # PR-only (metered minutes); target < 10 min.
  tier2-validation:
    name: tier 2 (datapack load + PackTest)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Accepting Mojang's EULA is the repo owner's standing action for her own
      # CI pipeline (ADR-0010); the itzg base fetches the jar at run time and it
      # is never baked into or published from CI.
      EULA: "TRUE"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # delvec copies the prefab .nbt into the datapack
      - uses: Swatinem/rust-cache@v2
      - name: build the hello-world delve output
        run: |
          cargo run -p delvewright-compiler --bin delvec -- \
            build crates/dsl/fixtures/valid/hello-world \
            -o validation/delve-output --prefabs prefabs

      # spec-0005: the delve image now builds FROM ghcr.io/stellarfeline/delvewright-base
      # by digest (Dockerfile.delve), so this pulls the base from GHCR — no Docker Hub.
      - name: build the delve image (ADR-0010; no jar, no mods)
        run: |
          docker build -f validation/Dockerfile.delve \
            -t delvewright/delve:ci validation/delve-output

      # spec-0005: cache the pinned Mojang server jar keyed on version + sha256 so the
      # steady-state tier-2 run does NOT re-download the 56 MB jar. Caching the jar for
      # our own CI runs is not redistribution (ADR-0010); it is never baked/published.
      - name: cache the pinned Mojang server jar
        uses: actions/cache@v4
        with:
          path: validation/.jar-cache
          key: mc-server-jar-1.21.11-f83b8e093865806f931c7e34aae41b177d4c076335263dd124c75d6d65dd1726
      - name: prime the server-jar cache (download + sha256 verify only on miss)
        run: |
          jar=validation/.jar-cache/minecraft_server.1.21.11.jar
          mkdir -p validation/.jar-cache
          if [ ! -f "$jar" ]; then
            echo "cache miss: fetching pinned server jar from Mojang"
            curl -fSL -o "$jar" \
              https://piston-data.mojang.com/v1/objects/64bb6d763bed0a9f1d632ec347938594144943ed/server.jar
          else
            echo "cache hit: reusing $jar"
          fi
          echo "f83b8e093865806f931c7e34aae41b177d4c076335263dd124c75d6d65dd1726  $jar" | sha256sum -c -

      - name: datapack loads on the pinned vanilla server with ZERO errors
        run: |
          # Mount the cached jar where itzg's install-vanilla looks (/data/minecraft_
          # server.<ver>.jar); it detects it and skips the download.
          docker run -d --name delve-ci -e EULA=TRUE \
            -v "$PWD/validation/.jar-cache/minecraft_server.1.21.11.jar:/data/minecraft_server.1.21.11.jar:ro" \
            -e PAUSE_WHEN_EMPTY_SECONDS=-1 delvewright/delve:ci
          # Wait up to ~5 min for world gen + datapack load to finish.
          for i in $(seq 1 60); do
            if docker logs delve-ci 2>&1 | grep -qE 'Done \([0-9]'; then break; fi
            if [ "$(docker inspect -f '{{.State.Status}}' delve-ci)" = "exited" ]; then break; fi
            sleep 5
          done
          docker logs delve-ci > boot.log 2>&1
          docker rm -f delve-ci >/dev/null
          echo "----- server boot log (tail) -----"; tail -n 20 boot.log
          if ! grep -qE 'Done \([0-9]' boot.log; then
            echo "::error::server never finished starting"; exit 1
          fi
          # The datapack-load criterion (spec-0002): no server-side ERROR lines.
          if grep -E '\[[^]]*/ERROR\]' boot.log; then
            echo "::error::datapack produced load errors on the live server"; exit 1
          fi
          echo "datapack loaded with zero errors."

      - name: PackTest suite (headless, exit code = failed tests)
        run: |
          docker compose -f validation/compose.yaml --profile packtest up \
            --abort-on-container-exit --exit-code-from packtest
      - name: tear down
        if: always()
        run: docker compose -f validation/compose.yaml --profile packtest down -v --remove-orphans || true
