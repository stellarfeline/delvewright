name: CI (tier 3 — release candidate)

# spec-0004 tier 3: release candidates only. Full mineflayer bot playthrough via
# the compose profile, then a multi-arch (amd64 + arm64) delve image pushed to
# GHCR. Triggered by an `rc-*` tag or manually.
on:
  push:
    tags: ["rc-*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Accepting Mojang's EULA is the repo owner's standing action for their own
  # release pipeline (ADR-0010). The server jar is fetched at run time by the
  # itzg base and is NEVER baked into or published from this image (only the
  # datapack + config — bytes we authored — ship in layers).
  EULA: "TRUE"
  # GHCR image for the M1 hello-world delve.
  IMAGE: ghcr.io/stellarfeline/delvewright/hello-world

jobs:
  # ---- full bot playthrough (the M1 proof) via the compose validate profile ---
  playthrough:
    name: bot playthrough (compose validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # delvec copies the prefab .nbt into the datapack — from the content repo
      - uses: ./.github/actions/checkout-content
      - uses: Swatinem/rust-cache@v2
      - name: build the hello-world delve output
        run: |
          cargo run --locked -p delvec --bin delvec -- \
            build crates/dsl/fixtures/valid/hello-world \
            -o validation/delve-output --prefabs campaigns/prefabs
      # Jar cache removed 2026-07-30 (see the note in ci.yml tier-2): single-file
      # bind mounts break itzg's installer rename, and runners fetch piston-data in
      # under a second. The itzg entrypoint downloads the pinned jar (ADR-0010).
      # `bot-run.sh --project <id>` is the ladder entry (task #185): the compose
      # project is the only name the stack has, it is REQUIRED, and the script
      # tears down exactly that project and proves it clean.
      - name: bot completes the critical path against the shipped delve image
        run: bash validation/bot-run.sh --project dw-ci-playthrough
      - name: the run report
        if: always()
        run: cat validation/run-out/dw-ci-playthrough/run-report.json || true

  # ---- creator playtest note flow (spec-0006 M2) -----------------------------
  # A live-server + mineflayer-bot integration test (same class as the playthrough
  # above), so it lives in tier 3, not tier 2: it boots a full playtest server and a
  # bot (~2-3 min), beyond tier-2's ~2-min budget. Every-push coverage of the
  # mechanism already exists in tier 1 — the harvester's parsing/pairing/report
  # logic (orchestrator unit tests) and the overlay emission + determinism
  # (compiler tests). This job proves the live wiring end to end.
  note-flow:
    name: playtest note flow (spec-0006)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # delvec copies the prefab .nbt into the datapack + overlay — content repo
      - uses: ./.github/actions/checkout-content
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - name: bot fires /trigger dw.note + a note; harvester report is asserted
        run: bash validation/playtest-note-flow.sh

  # ---- creator shot-calibration flow (spec-0019) ------------------------------
  # Same tier-3 class and same reasoning as note-flow above: a live server + bot.
  # Tier 1 already proves overlay emission + determinism (compiler tests),
  # `[DelveShot]` parsing (orchestrator tests) and the snapping / diagnostic
  # matrix (`delvec calibrate` tests). This job proves the live wiring: the
  # calibration triggers fire for a plain non-op player, the macro stamp reaches
  # the server log, and the adjusted numbers survive harvest → calibrate → patch.
  rehearsal-flow:
    name: shot calibration flow (spec-0019)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-content
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - name: bot adjusts a shot, stamps it, and the harvest is asserted
        run: bash validation/rehearsal-flow.sh

  # ---- branch runs (spec-0025 §3, release tier) ------------------------------
  # "Provably completable by machine" quantifies over BRANCHES, not paths: the
  # release tier walks every enumerated branch, each in its own fresh world (party
  # progress only moves forward, so a second branch needs a second world). Tier 3
  # for the same reason as the jobs above — one full server + bot per branch.
  # Tier 1 already proves the plan/tier/skip-naming logic (harness unit tests) and
  # the per-branch path emission + byte-identity (compiler tests); this job proves
  # the live thing: the bot takes the scripted dialogue choice at the fork and each
  # branch reaches its own ending.
  branch-runs:
    name: branch runs (spec-0025)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-content
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - name: build the two-branch fixture
        run: |
          cargo run --locked -p delvec --bin delvec -- \
            build crates/compiler/tests/fixtures/branch-two-endings \
            -o validation/delve-output --prefabs campaigns/prefabs
      - name: every enumerated branch is walked to its own ending
        run: bash validation/branch-runs.sh --project dw-ci-branches
      - name: the branch report
        if: always()
        run: cat validation/run-out/dw-ci-branches/branch-runs.json || true

  # ---- multi-arch delve image → GHCR (only after the playthrough is green) ----
  publish-image:
    name: multi-arch delve image → GHCR
    needs: playthrough
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-content
      - uses: Swatinem/rust-cache@v2
      - name: build the hello-world delve output
        run: |
          cargo run --locked -p delvec --bin delvec -- \
            build crates/dsl/fixtures/valid/hello-world \
            -o validation/delve-output --prefabs campaigns/prefabs

      # A published delve image is the strongest form of staging a build for the
      # owner: she runs it on the Pi and plays it (CLAUDE.md Environments). So
      # the same gate that guards the two local 25565 binders guards the push —
      # every past finding's general form must be a live, binding check on THIS
      # tree (playtest-methodology.md rule 7). Deliberately BEFORE the GHCR
      # login: a refusal must cost nothing and publish nothing.
      #
      # This is a tier-3 job on `rc-*` tags and manual dispatch only, so it never
      # reds an ordinary PR — the gate is not a status check anywhere, by design.
      # To publish over a red list, run the gate locally with
      # `--stage-anyway "<reason>" --acknowledge-red <N>`, commit the resulting
      # admission token, and say so in the release notes.
      - name: staging gate — no unadmitted delve is published
        run: |
          python3 tools/staging-gate.py \
            --campaign crates/dsl/fixtures/valid/hello-world \
            --build validation/delve-output \
            --report validation/delve-output/staging-gate.md

      - name: derive image tags
        id: meta
        run: |
          # rc-* tag → that tag; manual dispatch → a dev tag from the short SHA.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3 # arm64 emulation for the Pi (ADR-0010)
      - uses: docker/setup-buildx-action@v3
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build + push amd64 + arm64
        uses: docker/build-push-action@v6
        with:
          context: validation/delve-output
          file: validation/Dockerfile.delve
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
