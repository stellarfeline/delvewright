name: CI (tier 3 — release candidate)

# spec-0004 tier 3: release candidates only. Full mineflayer bot playthrough via
# the compose profile, then a multi-arch (amd64 + arm64) delve image pushed to
# GHCR. Triggered by an `rc-*` tag or manually.
on:
  push:
    tags: ["rc-*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Accepting Mojang's EULA is the repo owner's standing action for their own
  # release pipeline (ADR-0010). The server jar is fetched at run time by the
  # itzg base and is NEVER baked into or published from this image (only the
  # datapack + config — bytes we authored — ship in layers).
  EULA: "TRUE"
  # GHCR image for the M1 hello-world delve.
  IMAGE: ghcr.io/stellarfeline/delvewright/hello-world

jobs:
  # ---- full bot playthrough (the M1 proof) via the compose validate profile ---
  playthrough:
    name: bot playthrough (compose validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # delvec copies the prefab .nbt into the datapack — from the content repo
      - uses: ./.github/actions/checkout-content
      - uses: Swatinem/rust-cache@v2
      - name: build the hello-world delve output
        run: |
          cargo run -p delvec --bin delvec -- \
            build crates/dsl/fixtures/valid/hello-world \
            -o validation/delve-output --prefabs campaigns/prefabs
      # Jar cache removed 2026-07-30 (see the note in ci.yml tier-2): single-file
      # bind mounts break itzg's installer rename, and runners fetch piston-data in
      # under a second. The itzg entrypoint downloads the pinned jar (ADR-0010).
      # `bot-run.sh --project <id>` is the ladder entry (task #185): the compose
      # project is the only name the stack has, it is REQUIRED, and the script
      # tears down exactly that project and proves it clean.
      - name: bot completes the critical path against the shipped delve image
        run: bash validation/bot-run.sh --project dw-ci-playthrough
      - name: the run report
        if: always()
        run: cat validation/run-out/dw-ci-playthrough/run-report.json || true

  # ---- the death loop (task #68) --------------------------------------------
  # The one mechanic NO other tier can witness. A PackTest fake player is
  # permanently undamageable — measured independently on 2026-08-03 and again on
  # 2026-08-09 — so `on_death`, a lethal volume's kill and the recovery stake had
  # no runtime proof anywhere, while the drowned-bell shape rests entirely on
  # them. This job walks a real client into a declared lethal volume, kills it,
  # and asserts every consequence the campaign PROMISED against what it observed:
  # the volume's own wording reaching that player, the declared forfeit leaving
  # the ledger, the stake standing at the anchor the compile-time placement table
  # chose, the walk back, an exact restore under a double right-click, and the
  # respawn seat.
  #
  # Its own tier-3 job rather than a second stage of `playthrough` above, because
  # it needs a campaign that HAS a death loop: hello-world declares no lethal
  # volume, no `on_death` and no stake, so the whole contract is absent there and
  # the stage would report SKIPPED forever. `crates/compiler/tests/fixtures/economy`
  # is the fixture that declares all three (spec-0031 + spec-0032). Same cost
  # profile as the playthrough: one server, one bot, no new pull.
  #
  # `--output` really selects the tree now — until this change the flag set a
  # variable only the `packtest` profile read, so the bot ladder silently booted
  # `./delve-output` whatever it was asked for.
  death-loop:
    name: death loop (a real player dies, and every promise is asserted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-content
      - uses: Swatinem/rust-cache@v2
      - name: build the economy delve output (spec-0031 + spec-0032)
        run: |
          cargo run -p delvec --bin delvec -- \
            build crates/compiler/tests/fixtures/economy \
            -o validation/delve-output-economy --prefabs campaigns/prefabs
      - name: the bot dies in a declared lethal volume and recovers its stake
        run: |
          bash validation/bot-run.sh --project dw-ci-death-loop \
            --output ./delve-output-economy
      # The binding counts are the point of reading this: `deaths_observed: 0`
      # would be a green stage that examined nothing, and rule 1 makes that a
      # finding rather than a pass.
      - name: the run report
        if: always()
        run: cat validation/run-out/dw-ci-death-loop/run-report.json || true

  # ---- the die-retry loop (task #68) ----------------------------------------
  # The stage that proves "dying is always safe" — death → respawn at the
  # governing checkpoint → walk back → re-engage, with no progression lost. It is
  # the load-bearing combat proof of a souls-shaped delve, and until this job it
  # had never run: its precondition is an ARMED checkpoint before a mandatory
  # encounter, and measured 2026-08-11 across BOTH repos, not one build had both.
  # `keep-trial` and `hollow-vigil` field encounters with no checkpoint before
  # them; `nobodys-cave-island` compiles to zero mandatory encounters; the drowned
  # bell has no stage documents yet. So the stage reported green over zero
  # scripted deaths everywhere it had ever run — the island's floor-gate defect,
  # in a second place.
  #
  # `crates/compiler/tests/fixtures/die-retry` is the smallest campaign that lets
  # it bind: one conversation that sets a checkpoint and summons one wave, and one
  # `kill` objective four blocks away. The run report's `die_retry_binding` is the
  # thing to read — `deaths_scripted: 0` means the stage examined nothing,
  # whatever `passed` says. Measured on this fixture: 1 declared encounter, 1
  # engaged, 2 scripted deaths, 2 trials completed, `unbound: false`.
  #
  # Its own job rather than a stage of `playthrough`, for the same reason as the
  # death loop above: hello-world declares no combat at all. Same cost profile —
  # one server, one bot, no new pull.
  die-retry:
    name: die-retry loop (a checkpoint, a death, and the walk back)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-content
      - uses: Swatinem/rust-cache@v2
      - name: build the die-retry delve output
        run: |
          cargo run -p delvec --bin delvec -- \
            build crates/compiler/tests/fixtures/die-retry \
            -o validation/delve-output-die-retry --prefabs campaigns/prefabs
      - name: the bot dies twice at a checkpointed encounter and comes back
        run: |
          bash validation/bot-run.sh --project dw-ci-die-retry \
            --output ./delve-output-die-retry
      - name: the run report
        if: always()
        run: cat validation/run-out/dw-ci-die-retry/run-report.json || true

  # ---- creator playtest note flow (spec-0006 M2) -----------------------------
  # A live-server + mineflayer-bot integration test (same class as the playthrough
  # above), so it lives in tier 3, not tier 2: it boots a full playtest server and a
  # bot (~2-3 min), beyond tier-2's ~2-min budget. Every-push coverage of the
  # mechanism already exists in tier 1 — the harvester's parsing/pairing/report
  # logic (orchestrator unit tests) and the overlay emission + determinism
  # (compiler tests). This job proves the live wiring end to end.
  note-flow:
    name: playtest note flow (spec-0006)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # delvec copies the prefab .nbt into the datapack + overlay — content repo
      - uses: ./.github/actions/checkout-content
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - name: bot fires /trigger dw.note + a note; harvester report is asserted
        run: bash validation/playtest-note-flow.sh

  # ---- creator shot-calibration flow (spec-0019) ------------------------------
  # Same tier-3 class and same reasoning as note-flow above: a live server + bot.
  # Tier 1 already proves overlay emission + determinism (compiler tests),
  # `[DelveShot]` parsing (orchestrator tests) and the snapping / diagnostic
  # matrix (`delvec calibrate` tests). This job proves the live wiring: the
  # calibration triggers fire for a plain non-op player, the macro stamp reaches
  # the server log, and the adjusted numbers survive harvest → calibrate → patch.
  rehearsal-flow:
    name: shot calibration flow (spec-0019)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-content
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - name: bot adjusts a shot, stamps it, and the harvest is asserted
        run: bash validation/rehearsal-flow.sh

  # ---- branch runs (spec-0025 §3, release tier) ------------------------------
  # "Provably completable by machine" quantifies over BRANCHES, not paths: the
  # release tier walks every enumerated branch, each in its own fresh world (party
  # progress only moves forward, so a second branch needs a second world). Tier 3
  # for the same reason as the jobs above — one full server + bot per branch.
  # Tier 1 already proves the plan/tier/skip-naming logic (harness unit tests) and
  # the per-branch path emission + byte-identity (compiler tests); this job proves
  # the live thing: the bot takes the scripted dialogue choice at the fork and each
  # branch reaches its own ending.
  branch-runs:
    name: branch runs (spec-0025)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-content
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - name: build the two-branch fixture
        run: |
          cargo run -p delvec --bin delvec -- \
            build crates/compiler/tests/fixtures/branch-two-endings \
            -o validation/delve-output --prefabs campaigns/prefabs
      - name: every enumerated branch is walked to its own ending
        run: bash validation/branch-runs.sh --project dw-ci-branches
      - name: the branch report
        if: always()
        run: cat validation/run-out/dw-ci-branches/branch-runs.json || true

  # ---- multi-arch delve image → GHCR (only after the playthrough is green) ----
  publish-image:
    name: multi-arch delve image → GHCR
    needs: playthrough
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-content
      - uses: Swatinem/rust-cache@v2
      - name: build the hello-world delve output
        run: |
          cargo run -p delvec --bin delvec -- \
            build crates/dsl/fixtures/valid/hello-world \
            -o validation/delve-output --prefabs campaigns/prefabs

      - name: derive image tags
        id: meta
        run: |
          # rc-* tag → that tag; manual dispatch → a dev tag from the short SHA.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3 # arm64 emulation for the Pi (ADR-0010)
      - uses: docker/setup-buildx-action@v3
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build + push amd64 + arm64
        uses: docker/build-push-action@v6
        with:
          context: validation/delve-output
          file: validation/Dockerfile.delve
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
