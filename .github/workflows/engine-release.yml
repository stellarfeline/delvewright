name: engine release (delvec)

# ADR-0016 line 2 (the ENGINE version line) made real, per ADR-0017.
#
# Two shelves are filled here, from one tagged tree:
#   1. GitHub Release assets — a checksum-verified `delvec` archive for every
#      target in `versions.toml [engine].targets`. Release `v1.0.0` existed with
#      ZERO assets, so the engine pin ADR-0016 requires and the skill's
#      `requires.delvec` window were promises against an empty shelf.
#   2. crates.io — `delvewright-dsl`, then `delvec` (`versions.toml
#      [engine].crates`, ADR-0025), so `cargo install delvec`
#      installs the same creator the archive carries.
#
# WHO PUBLISHES `delvewright-dsl`
#
# Not this workflow. That crate's version is the `dsl_version`, so it moves on a
# clock of its own and is uploaded by `.github/workflows/dsl-crate-publish.yml`
# the moment its number moves on `main` — one authority, and it is that one.
# The DSL crate stays in the set below as a NO-OP RE-CHECK: `delvec` declares
# `=<dsl version>`, so the release must not proceed if the registry does not
# already hold exactly those bytes, and the checksum comparison can only confirm
# it (skip), refuse it (different bytes under that version), or — if the hook
# never ran — supply it. It can never publish a DIFFERENT dsl than the one the
# hook decided on, because the number it reads is the same `versions.toml` value.
#
# NOTHING HERE MAY BE DONE BY HAND. A human `cargo publish` or a hand-uploaded
# asset is the failure mode being closed, not a fallback.
#
# WHY AN ACCIDENTAL crates.io PUBLISH IS IMPOSSIBLE BY CONSTRUCTION
#
# `cargo publish` is a one-way door: a version can never be reused, a name never
# freed. Four independent mechanisms stand in front of it, none of them a
# convention:
#
#   1. The credential is a GitHub ENVIRONMENT secret on `crates-io`, an
#      environment with REQUIRED REVIEWERS. `publish` is the only job here that
#      declares `environment:`, so it is the only job in this workflow that can
#      ever see `CARGO_REGISTRY_TOKEN` — and the run physically pauses for a human
#      approval before that job starts. No workflow edit, no fork PR and no
#      mis-pushed tag reaches the registry without that click.
#   2. `identity` refuses to let anything run unless the tag NAME equals
#      `v<[engine].version>` from the tagged tree, so a tag pushed by mistake
#      cannot publish "whatever the tree happens to say".
#   3. `identity` also refuses a tag that is not an ancestor of `main`. The
#      approval prompt shows a ref, not a diff; this is what makes the thing being
#      published something that went through review and CI (ADR-0008).
#   4. `publish` runs only after `binaries` has produced every shelf artifact,
#      after `shelf` has verified and shelved all of them, and after
#      `crates-preflight` has proven the tarballs publishable. A tree that cannot
#      build its own shelf never burns a crates.io version.
#
# The one thing the environment gate does NOT cover is CORRECTNESS — it gates
# access to a token, not the contents of an upload. That is what 2, 3, 4 and
# `tools/crates-io-publish.sh`'s checksum comparison are for.
#
# ONE APPROVAL PUBLISHES BOTH SHELVES, OR NEITHER
#
# The two shelves used to be gated differently. `publish-assets` needed only
# `[identity, binaries]`, declared no environment, and created the GitHub Release
# and uploaded the whole shelf with no approval, on the argument that assets are
# reversible; only the registry half waited for a reviewer. So one tag push made
# the release public while the other half sat at "waiting for review", and either
# half could land without the other: at `v1.2.0` both Linux shelf jobs failed and
# nothing reached crates.io, and the mirror image — a public release beside a
# registry that never got the crates — is the same defect pointing the other way.
# One decision was being asked for and two independent outcomes were possible.
#
# What holds now: `shelf` builds the release as a DRAFT. A draft is not
# published — it is served only to accounts with write access on this repository,
# it is not announced, it is absent from the public releases listing and from
# `gh release download` for everyone else — so filling one publishes nothing and
# owes no approval. The single gated job `publish` then performs BOTH publishes,
# in this order:
#
#   1. crates.io: a one-way door. A version can never be reused or deleted.
#   2. undrafting the GitHub Release: one PATCH, idempotent, retryable forever.
#
# The irreversible act goes FIRST on purpose. A failure there leaves nothing
# published anywhere, which is exactly the state one approval is supposed to
# produce — both or neither. Ordering them the other way would make a crates.io
# failure leave a published release describing a version the registry never got,
# and no later act could take that back. The residual window is between a
# successful upload and a successful undraft: it is one API call wide, it is
# retried in-job, and if every attempt fails the step prints what is on the
# registry and names the one remaining act (`gh release edit <tag> --draft=false`),
# which re-running this workflow also performs — the registry step then finds the
# version already there, byte-identical, and skips it.
#
# A run nobody approves therefore ends with the tag holding a DRAFT release and
# nothing new on crates.io, and the run says so without anyone reading this file:
# `shelf` prints the draft state and writes it into the run summary, and
# `publish` stands at "Waiting for review" for as long as it is never approved.
#
# `tools/check-release-publish-gate.py` is what keeps the claim true rather than
# merely written here: it refuses any release-publishing verb, or any reference to
# the registry credential, in a job that does not declare an environment.

on:
  push:
    # `v<semver>` only. `rc-*` belongs to release.yml (tier 3), and a tag shaped
    # any other way does not start this workflow at all.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v<semver> tag to build from (re-fills the shelf while its release is still a draft; re-runs are safe)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Never cancel a release in flight: half of it is irreversible.
  group: engine-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  identity:
    name: release identity (tag == engine version)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.id.outputs.tag }}
      version: ${{ steps.id.outputs.version }}
      targets: ${{ steps.id.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          # `merge-base --is-ancestor` below needs real history, and needs
          # `origin/main` to exist locally.
          fetch-depth: 0
      # versions.toml is the single source of truth (spec-0005). Everything the
      # rest of this workflow reads comes from it, and this is the gate that says
      # the tagged tree agrees with itself before a single artifact is built.
      - name: consumers agree with versions.toml
        run: bash validation/check-versions.sh
      - name: the tag names the engine version in the tagged tree
        id: id
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(python3 -c 'import sys,tomllib;sys.stdout.reconfigure(newline="\n");print(tomllib.load(open("versions.toml","rb"))["engine"]["version"])')"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          # A compact JSON array of the shelf, so the build matrix cannot carry a
          # second copy of the target list.
          TARGETS="$(python3 -c 'import json,sys,tomllib;sys.stdout.reconfigure(newline="\n");print(json.dumps(tomllib.load(open("versions.toml","rb"))["engine"]["targets"]))')"
          echo "targets=$TARGETS"  >> "$GITHUB_OUTPUT"
          echo "shelf: $TARGETS"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag '$TAG' does not name engine version '$VERSION' (versions.toml [engine].version)."
            echo "::error::ADR-0016 requires the binary's version, the git tag, the crates.io version and the"
            echo "::error::skill's window to be one number. Re-tag, or bump [engine].version and re-run CI."
            exit 1
          fi
          echo "ok: $TAG == v$VERSION"
      - name: the tagged commit is on main
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "ok: $(git rev-parse --short HEAD) is an ancestor of origin/main"
          else
            echo "::error::the tagged commit is not an ancestor of origin/main."
            echo "::error::Releases publish reviewed, CI-green history only (ADR-0008)."
            exit 1
          fi

  # ---- the shelf: one archive per target ------------------------------------
  binaries:
    name: shelf (${{ matrix.target }})
    needs: identity
    runs-on: ${{ matrix.runner }}
    strategy:
      # Never fail-fast: a partial shelf is a finding, and the log should name
      # every target that failed, not the first.
      fail-fast: false
      matrix:
        include:
          # Linux is gnu (versions.toml [engine].targets, ADR-0023 §4), and each
          # Linux target builds NATIVELY on a runner of its own architecture —
          # no cross-linker, no cross C compiler, and `nucleation`'s build
          # script runs on the host it targets. The runner's glibc is the
          # binary's floor, which `tools/build-release-binaries.sh` measures
          # off the ELF and prints; the oldest LTS image GitHub hosts is chosen
          # so that floor is as low as a hosted runner can make it.
          - { target: x86_64-unknown-linux-gnu,   runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu,  runner: ubuntu-22.04-arm }
          # The macOS runner is arm64 and carries both Apple slices' std.
          - { target: x86_64-apple-darwin,        runner: macos-latest }
          - { target: aarch64-apple-darwin,       runner: macos-latest }
          # msvc is the one target that genuinely needs its own host: linking
          # against the Windows SDK import libraries cannot be done elsewhere.
          - { target: x86_64-pc-windows-msvc,     runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.identity.outputs.tag }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "shelf-${{ matrix.target }}" }
      # The script below reads versions.toml through stdlib `tomllib` (floor
      # >= 3.11, versions.toml [ci].python_tools_version). `ubuntu-22.04` and
      # `ubuntu-22.04-arm` both ship python3.10 by default — release run
      # 34069406209 (v1.2.0) failed both Linux legs with `ModuleNotFoundError:
      # No module named 'tomllib'` while macOS and Windows built, because only
      # those two images predate the floor. Harmless on macos-latest /
      # windows-latest, which already default to a newer line; pinned here
      # rather than left to the runner image so a future LTS bump cannot
      # silently reopen this.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # git-bash on the Windows runner, so one script serves all three OSes.
      - name: build + archive + checksum
        shell: bash
        run: bash tools/build-release-binaries.sh --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: shelf-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ---- the shelf, assembled into a DRAFT release ----------------------------
  # This job PUBLISHES NOTHING, and that is what lets it run without an approval.
  # A draft release is served only to accounts with write access on this
  # repository: it is absent from the public releases listing, from the atom feed
  # and from every unauthenticated asset download, and creating one announces
  # nothing to anyone. So the whole shelf can be built, checksum-verified and read
  # back before a human is asked anything — which is the point of doing it here
  # rather than inside the gate: the reviewer approves a shelf that is already
  # proven complete, and an incomplete shelf reds before the prompt ever appears.
  #
  # The one thing it must never do is touch a release that is already PUBLISHED,
  # because uploading an asset to a public release IS publishing. The step below
  # refuses that outright, which also agrees with ADR-0017 §5: once the shelf is
  # filled, a released tag is as immutable in practice as a crates.io version.
  shelf:
    name: shelf into a draft release
    needs: [identity, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.identity.outputs.tag }}" }
      - uses: actions/download-artifact@v4
        with:
          pattern: shelf-*
          merge-multiple: true
          path: dist
      - name: re-verify every checksum, then state the binding count
        run: |
          set -euo pipefail
          cd dist
          # One SHA256SUMS for the whole shelf, from the per-target lines the
          # build script emitted. `sort` so the file is stable regardless of the
          # order artifacts came back in.
          cat ./*.tar.gz.sha256 | sort -k2 > SHA256SUMS
          rm -f ./*.tar.gz.sha256
          # Re-verify AFTER the round trip through artifact upload/download: the
          # checksum a user is told to trust must describe the bytes this job is
          # about to upload, not the bytes some other runner once had.
          sha256sum -c SHA256SUMS
          n_expected=$(python3 -c 'import sys,tomllib;sys.stdout.reconfigure(newline="\n");print(len(tomllib.load(open("../versions.toml","rb"))["engine"]["targets"]))')
          n_got=$(ls -1 ./*.tar.gz | wc -l | tr -d ' ')
          echo "shelf: $n_got archive(s), expected $n_expected"
          if [ "$n_got" -ne "$n_expected" ]; then
            echo "::error::the shelf is $n_got/$n_expected — a partial shelf is a finding, not a release."
            exit 1
          fi
          if [ "$n_expected" -eq 0 ]; then
            echo "::error::versions.toml [engine].targets is empty; this job would have uploaded nothing."
            exit 1
          fi
      - name: the release exists as a DRAFT, and is one this job may fill
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.identity.outputs.tag }}
        run: |
          set -euo pipefail
          # `gh release view` finds a draft by tag name (it falls back to listing
          # releases when the by-tag endpoint 404s, which is what a draft does).
          # Its non-zero exit has two meanings — "no such release" and "the API
          # could not be read" — and only the first is an answer. The status is
          # captured before anything reads the output; an unreadable state is a
          # refusal, never an assumed absence.
          rc=0
          gh release view "$TAG" --json isDraft --jq .isDraft > state.txt 2> state.err || rc=$?
          if [ "$rc" -ne 0 ]; then
            if grep -qiE 'release not found|HTTP 404' state.err; then
              gh release create "$TAG" --draft --title "delvec $TAG" --generate-notes
              echo "created release $TAG as a DRAFT — nothing is public until the gated job undrafts it"
            else
              cat state.err
              echo "::error::could not read whether release $TAG exists or is a draft."
              echo "::error::An unreadable state is not an absent release; refusing to create or upload anything."
              exit 1
            fi
          else
            state="$(cat state.txt)"
            if [ "$state" != "true" ]; then
              echo "::error::release $TAG already exists and is PUBLISHED (isDraft=$state)."
              echo "::error::Uploading an asset to a public release is itself a publish, and this job"
              echo "::error::carries no approval. A filled, released tag is immutable in practice"
              echo "::error::(ADR-0017 §5): downloaders hold bytes and checksums that name it. Release a"
              echo "::error::new version instead of re-filling this one."
              exit 1
            fi
            echo "release $TAG exists and is a DRAFT; filling its shelf"
          fi
      - name: upload the shelf to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.identity.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
      - name: the draft now holds the whole shelf, and is still a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.identity.outputs.tag }}
        run: |
          set -euo pipefail
          # The binding count, read back from the API rather than assumed from a
          # successful upload command.
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/have.txt
          cat /tmp/have.txt
          n_archives=$(grep -c '\.tar\.gz$' /tmp/have.txt || true)
          n_expected=$(python3 -c 'import sys,tomllib;sys.stdout.reconfigure(newline="\n");print(len(tomllib.load(open("versions.toml","rb"))["engine"]["targets"]))')
          n_sums=$(grep -c '^SHA256SUMS$' /tmp/have.txt || true)
          echo "release $TAG: $n_archives archive(s) + $n_sums SHA256SUMS (expected $n_expected + 1)"
          if [ "$n_archives" -ne "$n_expected" ] || [ "$n_sums" -ne 1 ]; then
            echo "::error::release $TAG does not hold the whole shelf."
            exit 1
          fi
          # Read back the state this job promises to leave behind, rather than
          # assuming the upload could not have changed it.
          is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [ "$is_draft" != "true" ]; then
            echo "::error::release $TAG is no longer a draft (isDraft=$is_draft) and this job never undrafts one."
            exit 1
          fi
          # What a reader of the run sees without opening a job log: the shelf is
          # complete and NOTHING is public yet.
          {
            echo "### shelf: $TAG"
            echo ""
            echo "\`$n_archives\` archive(s) + SHA256SUMS are on release **$TAG**, which is still a **draft** —"
            echo "nothing is public and nothing is on crates.io."
            echo ""
            echo "Both publishes happen together in \`publish\`, which is waiting for the \`crates-io\` approval."
            echo "A run that is never approved leaves exactly this state."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- what WOULD be published, with no access to the token -----------------
  crates-preflight:
    name: crates.io preflight (no credential)
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.identity.outputs.tag }}" }
      - uses: Swatinem/rust-cache@v2
      # The same gate CI runs on every push, re-run here against the exact tagged
      # tree the upload will come from.
      - name: the packaged tarballs are publishable
        run: bash tools/check-publishable.sh
      # The other half of what the upload carries: the front pages. This job is a
      # `needs:` of `publish`, so it is the LAST place those pages can
      # be judged before the one-way door — and the tagged tree is not
      # necessarily the tree CI last saw. Enumerating the entry points is the
      # point (CLAUDE.md: a gate nothing invokes is UNRUN): `ci.yml`'s `rust` job
      # covers every push, and this covers the publish itself. The page set is
      # derived from the manifests: every crate under `crates/` publishes one.
      - name: the front pages carry no internal reference and no stale version
        run: |
          python3 tools/check-crates-io-readmes.py
          python3 tools/check-reference-versions.py
      # The same enumeration one layer out. The gate above judges the two pages
      # a stranger lands on; this judges the whole tagged tree, which `ci.yml`
      # has not necessarily seen, for the identifiers a reader cannot resolve —
      # a task id, a pull-request number, a dated attribution.
      - name: the tagged tree carries no identifier a reader cannot resolve
        run: python3 tools/check-unsanctioned-identifiers.py
      # Prints, for the human about to approve `publish`, exactly which
      # crate versions would be uploaded and which are already on the registry.
      - name: the publish plan
        run: bash tools/crates-io-publish.sh --plan

  # ---- the one-way door, and the only job that publishes anything -----------
  publish:
    name: publish to crates.io and the release (owner approval)
    # `shelf` is in this list for the reason the whole restructure exists: the
    # only way to reach this job is through a shelf that was built, checksum-
    # verified after its round trip, counted against `[engine].targets` and read
    # back from the API. `binaries` alone would not do it — a job can succeed
    # without its artifacts ever being assembled into a release — so the gate
    # cannot be reached with a shelf that was never built, and the approval a
    # reviewer is asked for is an approval of something already proven complete.
    needs: [identity, binaries, crates-preflight, shelf]
    runs-on: ubuntu-latest
    # THE gate. `crates-io` is an environment with required reviewers, and it is
    # the sole holder of CARGO_REGISTRY_TOKEN — no other job in this workflow
    # declares an environment, so no other job can obtain it. The run pauses here
    # until a reviewer approves.
    #
    # That last sentence is a claim about GitHub settings this file cannot see.
    # An environment can exist, hold the token, and carry `protection_rules: []`
    # — nothing pauses, and a tag push publishes unreviewed while every comment
    # here still reads correct. Only the half the workflow itself decides — that
    # the token is reachable from exactly one job — holds by construction. A
    # comment cannot make a gate bind; the step below checks.
    environment: crates-io
    permissions:
      # BOTH publishes happen in this job, so it holds both credentials: the
      # registry token comes from the environment, and `contents: write` is what
      # undrafting the release needs. That write scope is deliberately here and
      # nowhere else that could reach a public release — `shelf` also has it, and
      # may only ever touch a draft, which it proves by reading the state back.
      contents: write
      # Lets the first step read this run's own approval history. Without it the
      # assertion fails closed, which is right but late.
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.identity.outputs.tag }}" }
      # FIRST, before anything that touches the outside world: prove the pause
      # actually happened. GitHub records environment approvals against the run;
      # a run that was never held has none. Nothing else in the repository can
      # see whether the reviewer requirement is configured, because that setting
      # lives in GitHub's settings — this reads the CONSEQUENCE instead.
      - name: the gate actually bound (a run nobody approved must not publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/assert-run-approved.sh crates-io
      - uses: Swatinem/rust-cache@v2
      # Re-package inside this job: `crates-io-publish.sh` hashes
      # `package-verify/package/*.crate` (plus the sha256 this step writes
      # beside each — tools/lib/package-verify.sh), and it must hash tarballs
      # built here from the tagged tree, not artifacts handed over from
      # another job.
      - name: package (and re-prove publishability) from the tagged tree
        run: bash tools/check-publishable.sh
      # FIRST of the two publishes, because it is the one that cannot be undone.
      # If this fails, the release is still a draft and nothing has been published
      # anywhere — which is the state one approval is supposed to produce.
      - name: publish to crates.io (irreversible; first for that reason)
        env:
          # Read by cargo directly out of the environment. No `cargo login`, no
          # credential written to disk.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash tools/crates-io-publish.sh --publish
      # SECOND: one cheap, idempotent API call, under the same approval. This is
      # where the GitHub Release stops being a draft and becomes public.
      - name: publish the release (undraft, retried)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.identity.outputs.tag }}
        run: |
          set -euo pipefail
          # The residual window of the whole design is the few seconds between the
          # line above and the line below: crates.io has the version and the
          # release is still a draft. It is retried rather than left to a human,
          # and the state is READ BACK each time — `gh` exiting 0 is not evidence
          # the release is public.
          attempt=1
          while [ "$attempt" -le 5 ]; do
            rc=0
            gh release edit "$TAG" --draft=false || rc=$?
            if [ "$rc" -eq 0 ]; then
              is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
              if [ "$is_draft" = "false" ]; then
                echo "release $TAG is published (attempt $attempt of 5)"
                gh release view "$TAG" --json assets --jq '.assets[].name' | sort
                exit 0
              fi
              echo "attempt $attempt: gh exited 0 but the release still reads isDraft=$is_draft"
            else
              echo "attempt $attempt: gh release edit exited $rc"
            fi
            attempt=$((attempt + 1))
            [ "$attempt" -gt 5 ] || sleep 10
          done
          echo "::error::crates.io HAS this version, and the GitHub Release $TAG is STILL A DRAFT."
          echo "::error::The registry half is done and cannot be undone; the release half is not."
          echo "::error::This is the one window this design leaves open, and it is one call wide."
          echo "::error::The single remaining act, which needs no new approval and is safe to repeat:"
          echo "::error::    gh release edit $TAG --draft=false -R $GITHUB_REPOSITORY"
          echo "::error::Re-running this workflow does the same thing: the registry step finds every"
          echo "::error::version already on crates.io with identical bytes and skips it, then this step"
          echo "::error::undrafts. Do NOT re-tag and do NOT bump the version."
          exit 1
