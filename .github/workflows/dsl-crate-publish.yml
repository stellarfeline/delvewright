name: dsl crate release (delvewright-dsl)

# The `delvewright-dsl` crate's version IS the `dsl_version` — the crate defines
# the format, so its package number is the format's number (crates/dsl/Cargo.toml
# says so, and `validation/check-versions.sh` holds the statements of it equal).
#
# A RELEASE IS A HUMAN DISPATCHING THIS WORKFLOW (ADR-0028 §6)
#
# Merging and releasing are unrelated: nothing pushed or merged starts this
# workflow. A human dispatches it with a commit on `main` (default: the tip);
# `plan` reads `[engine].dsl_crate_version` at that commit, and the gated job
# publishes that number to crates.io, then writes the tag
# `delvewright-dsl--v<version>` at that commit and a GitHub Release carrying the
# registry's own `.crate` (downloaded and checked against the index sha256) and a
# `SHA256SUMS`, marked NOT Latest (the one Latest is `delvec`'s, ADR-0028 §8). The
# irreversible act is first and the residual window is the tag and Release calls
# after it; a re-run finds the version on the registry, skips the upload, and
# writes whichever of the tag and Release is missing. `engine-release.yml` never
# supplies this crate: it refuses to release a `delvec` whose `=`-pinned format
# crate crates.io does not already serve.
#
# NOTHING HERE IS DONE BY HAND, in the sense `engine-release.yml`'s header means
# it: no human runs `cargo publish` and no human types which version goes up.
# What a human does is start the release and authorise the one-way door —
# `crates-io` is an environment with a required reviewer.
#
# TWO JOBS, AND WHY THE SPLIT IS THE POINT
#
# An environment approval is requested when the JOB is reached, not when it has
# work to do. `plan` runs without the environment and without a credential: it
# proves the commit is on `main`, refuses when the version the manifest names is
# on crates.io with DIFFERENT bytes, and reaches `publish` only when the registry
# or the Release still lacks the version — a dispatch for a number already fully
# released asks nobody anything.
#
# ONE RUN PER COMMIT
#
# This workflow's second job waits for a person, and GitHub keeps at most one
# pending run per concurrency group, cancelling the previously pending one
# (GitHub Actions, workflow syntax, `concurrency`). Run 34096612106 entered
# `waiting` on the `crates-io` environment and was never approved; MEASURED over
# every run created after it, 22 runs had ZERO jobs and 21 were cancelled 1 or 2
# seconds after their own successor was created. So the group is the chosen
# commit: two runs for one commit serialise, and a run parked at "waiting for
# review" never stands in front of another commit's run.

on:
  # The only entry point. No push, tag or merge starts a release.
  workflow_dispatch:
    inputs:
      commit:
        description: "A commit on main to release delvewright-dsl from (its [engine].dsl_crate_version names the release; default: the tip of main)"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  # One run per commit — see ONE RUN PER COMMIT above.
  group: dsl-crate-publish-${{ github.event.inputs.commit }}
  cancel-in-progress: false

jobs:
  plan:
    name: the format version at a main commit, and what it still owes
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      previous: ${{ steps.release.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit }}
          # A tag is written at this commit, so it must be shown to be on `main`,
          # and the previous tag of this line is read for the notes: both need
          # the history and the tags.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with: { key: "dsl-crate-publish" }
      # versions.toml is the single source of truth (spec-0005), and the version
      # about to be published is read out of it. A tree that disagrees with
      # itself about the dsl_version must not reach the registry with either
      # answer.
      - name: consumers agree with versions.toml
        run: bash validation/check-versions.sh
      # The dispatch input takes any ref; a Release tag may only name what `main`
      # delivered (ADR-0008, ADR-0028 §2). Refused before the registry is asked.
      - name: the commit is on main
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "ok: $(git rev-parse --short HEAD) is an ancestor of origin/main"
          else
            echo "::error::$(git rev-parse --short HEAD) is not an ancestor of origin/main."
            echo "::error::The format crate is published, tagged and released only from main."
            exit 1
          fi
      - name: ask the registry what it already holds
        id: plan
        run: |
          set -euo pipefail
          # The status is captured before anything reads the output: a plan that
          # refused (the version is on crates.io with different bytes) must red
          # here, not be parsed for a verdict it never reached.
          rc=0
          bash tools/crates-io-publish.sh --plan --only delvewright-dsl > plan.txt 2>&1 || rc=$?
          cat plan.txt
          [ "$rc" -eq 0 ] || exit "$rc"
          # The script's one machine-readable line. Reading it is what keeps the
          # index lookup in one place instead of copied into this workflow.
          list="$(sed -n 's/^crates-io-publish: TO_PUBLISH=//p' plan.txt)"
          version="$(python3 -c 'import sys,tomllib;sys.stdout.reconfigure(newline="\n");print(tomllib.load(open("versions.toml","rb"))["engine"]["dsl_crate_version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$list" ]; then
            echo "delvewright-dsl $version is already on crates.io as the same crate."
            echo "registry=served" >> "$GITHUB_OUTPUT"
          else
            echo "delvewright-dsl $version is not on crates.io."
            echo "registry=absent" >> "$GITHUB_OUTPUT"
          fi
      # The other half of what the gated job writes: the tag and the Release. The
      # approval is asked for when the registry OR the Release lacks this
      # version, so a run that uploaded the crate and died before the Release is
      # completed by a re-run, and a version already fully released asks nothing.
      - name: ask GitHub whether the tag and Release already exist
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          REGISTRY: ${{ steps.plan.outputs.registry }}
        run: |
          set -euo pipefail
          tag="$(python3 tools/lib/release_tags.py tag delvewright-dsl "$VERSION")"
          rc=0
          state="$(python3 tools/lib/github_releases.py state "$GITHUB_REPOSITORY" "$tag")" || rc=$?
          [ "$rc" -eq 0 ] || { echo "::error::could not read the state of Release $tag"; exit 1; }
          rc=0
          at="$(python3 tools/lib/github_releases.py tag-commit "$GITHUB_REPOSITORY" "$tag")" || rc=$?
          [ "$rc" -eq 0 ] || { echo "::error::could not read whether tag $tag exists"; exit 1; }
          commit="$(git rev-parse HEAD)"
          if [ -n "$at" ]; then
            # A tag already written names the commit the Release hangs on, and it
            # must be a `main` commit stating this version; it is never moved.
            stated="$(git show "$at:versions.toml" | python3 -c 'import sys,tomllib;sys.stdout.reconfigure(newline="\n");print(tomllib.loads(sys.stdin.read())["engine"]["dsl_crate_version"])')"
            if [ "$stated" != "$VERSION" ] || ! git merge-base --is-ancestor "$at" origin/main; then
              echo "::error::tag $tag exists at $at, which states dsl_crate_version '$stated' or is not on main."
              exit 1
            fi
            commit="$at"
          fi
          previous="$(python3 tools/lib/release_tags.py previous "$tag")"
          {
            echo "tag=$tag"
            echo "commit=$commit"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          echo "registry: $REGISTRY; Release $tag: $state; tag at: ${at:-(not written)}; previous: ${previous:-(none)}"
          if [ "$REGISTRY" = "served" ] && [ "$state" = "published" ]; then
            echo "delvewright-dsl $VERSION is on crates.io and released as $tag — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "asking for the publish approval: registry $REGISTRY, Release $state."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: publish delvewright-dsl (owner approval)
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # THE gate. `crates-io` holds CARGO_REGISTRY_TOKEN and carries a required
    # reviewer, so the run pauses here. Read back from the API rather than
    # assumed: the environment has no deployment branch policy, so `main`
    # reaches it exactly as a release tag does.
    environment: crates-io
    permissions:
      # The tag and the Release are written here, under the same approval as the
      # upload (ADR-0028 §6).
      contents: write
      # Lets the first step read this run's own approval history.
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit `plan` judged — never the dispatch ref's tip, which may have
          # moved since. Full history: the notes read the tagged commit, which is
          # an earlier `main` commit when a run before already wrote the tag.
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
      # FIRST, before anything that touches the outside world. An environment can
      # exist, hold the token and protect nothing; this reads the CONSEQUENCE —
      # whether this run was actually held for a human — instead of the setting.
      - name: the gate actually bound (a run nobody approved must not publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/assert-run-approved.sh crates-io
      - uses: Swatinem/rust-cache@v2
        with: { key: "dsl-crate-publish" }
      # Packages the crate itself, compares its sha256 with the registry's,
      # uploads only what is absent, and polls until the index serves our exact
      # bytes. Re-running it after a half-finished run is safe by construction.
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash tools/crates-io-publish.sh --publish --only delvewright-dsl
      # The asset is the registry's OWN tarball — the bytes crates.io received and
      # serves — downloaded and refused unless it hashes to the index sha256, not a
      # local re-packaging (whose `.cargo_vcs_info.json` names this commit).
      - name: the registry's .crate and its checksum
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/lib/crates_index.py download delvewright-dsl "$VERSION" "dist/delvewright-dsl-$VERSION.crate"
          (cd dist && sha256sum "delvewright-dsl-$VERSION.crate" > SHA256SUMS && cat SHA256SUMS)
      - uses: ./.github/actions/write-release-tag
        with:
          tag: ${{ needs.plan.outputs.tag }}
          commit: ${{ needs.plan.outputs.commit }}
          message: "delvewright-dsl ${{ needs.plan.outputs.version }}, as crates.io serves it"
      - name: the Release, written once and never Latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: |
          set -euo pipefail
          rc=0
          state="$(python3 tools/lib/github_releases.py state "$GITHUB_REPOSITORY" "$TAG")" || rc=$?
          [ "$rc" -eq 0 ] || { echo "::error::could not read the state of Release $TAG"; exit 1; }
          python3 tools/release-notes.py delvewright-dsl --commit "$COMMIT" > notes.md
          title="$(python3 tools/lib/release_tags.py title "$TAG")"
          crate="dist/delvewright-dsl-$VERSION.crate"
          case "$state" in
            absent)
              if [ -n "$PREVIOUS" ]; then
                gh release create "$TAG" "$crate" dist/SHA256SUMS --verify-tag --title "$title" --notes-file notes.md --generate-notes --notes-start-tag "$PREVIOUS" --latest=false
              else
                gh release create "$TAG" "$crate" dist/SHA256SUMS --verify-tag --title "$title" --notes-file notes.md --latest=false
              fi
              ;;
            draft)
              gh release upload "$TAG" "$crate" dist/SHA256SUMS --clobber
              gh release edit "$TAG" --draft=false --latest=false
              ;;
            published)
              echo "Release $TAG is already published; reading it back."
              ;;
            *)
              echo "::error::unexpected Release state '$state' for $TAG"
              exit 1
              ;;
          esac
      - name: the Release holds the registry's bytes, read back
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          state="$(python3 tools/lib/github_releases.py state "$GITHUB_REPOSITORY" "$TAG")"
          python3 tools/lib/github_releases.py assets "$GITHUB_REPOSITORY" "$TAG" > have.txt
          cat have.txt
          n=0
          for want in "delvewright-dsl-$VERSION.crate" SHA256SUMS; do
            if grep -qxF "$want" have.txt; then n=$((n + 1)); fi
          done
          echo "Release $TAG: $state; $n of 2 asset(s) present"
          if [ "$state" != "published" ] || [ "$n" -ne 2 ]; then
            echo "::error::Release $TAG is not a published Release holding the .crate and SHA256SUMS."
            exit 1
          fi
