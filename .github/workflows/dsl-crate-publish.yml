name: dsl crate publish (main)

# The `delvewright-dsl` crate's version IS the `dsl_version` — the crate defines
# the format, so its package number is the format's number (crates/dsl/Cargo.toml
# says so, and `validation/check-versions.sh` holds the four statements of it
# equal). A number that names a format has to be resolvable the moment a document
# declares it, and the engine's own release line moves on a different clock, so
# this crate does not wait for a `v*` tag: it goes to crates.io when its number
# moves on `main`, and this workflow is the only thing that moves it.
#
# NOTHING HERE IS DONE BY HAND, in the sense `engine-release.yml`'s header means
# it: no human runs `cargo publish` and no human decides which version goes up.
# What a human still does is authorise the one-way door — `crates-io` is an
# environment with a required reviewer, and that pause is one of the four
# mechanisms that header names. Removing it to make this "fully automatic" would
# delete a gate, not a chore.
#
# TWO JOBS, AND WHY THE SPLIT IS THE POINT
#
# An environment approval is requested when the JOB is reached, not when it has
# work to do. A single publishing job here would raise an approval prompt on
# EVERY push to `main` — most of them for a version already on the registry —
# and an approval that is almost always a no-op is one nobody reads. So `plan`
# runs without the environment, asks the registry what it already holds, and
# `publish` is reached only when the answer is "this version is not there".
#
# `plan` is also the gate's other half: it fails, before any credential exists in
# the run, if the version the manifest names is on crates.io with DIFFERENT bytes.
# The same refusal runs on every pull request as `dsl crate version (crates.io)`
# in `ci.yml`, so a bump that is owed is normally demanded there first.
#
# A SHARED CONCURRENCY GROUP AND A HUMAN APPROVAL CANNOT BOTH BE HERE
#
# This workflow's second job waits for a person. GitHub's own rule for a group is
# that "when a concurrent job or workflow is queued, if another job or workflow
# using the same concurrency group in the repository is in progress, the queued
# job or workflow will be pending", and "by default, any existing pending job or
# workflow in the same concurrency group will be canceled and the new queued job
# or workflow will take its place" (GitHub Actions, workflow syntax,
# `concurrency`). `cancel-in-progress` governs runs that have STARTED; it does not
# reach the pending slot, and there is only ever one of those. So a group holding
# a run that is waiting for a reviewer keeps at most one successor alive, and
# every push after that one silently replaces it.
#
# That is not a hypothesis. Run 34096612106 entered `waiting` on the `crates-io`
# environment and was never approved. MEASURED over every run created after it:
# 22 runs, all with ZERO jobs, 21 of them cancelled 1 or 2 seconds after their own
# successor was created, the 22nd still pending. Of the 31 runs this workflow has
# ever had, 4 succeeded. The bump that was merged in that window never reached the
# registry and nothing anywhere went red.
#
# So the group is now ONE RUN PER COMMIT. Two runs for the same commit still
# serialise — a re-push of a sha would otherwise race itself onto a one-way door —
# and a run parked at "waiting for review" can no longer stand in front of a
# different commit's run. Nothing is discarded, because nothing shares a group.
#
# THE TRIGGER IS THE FILES THE NUMBER IS READ OUT OF
#
# The remaining half is that a run existed at all for pushes that could not
# possibly move the number. `plan` reads the version from `versions.toml`
# (`[engine] dsl_crate_version`) and the crate declares it in
# `crates/dsl/Cargo.toml`; those two files are the only inputs to the question
# this workflow asks, so those two files are the trigger. MEASURED over the last
# 200 pushes to `main`: 7 touch `crates/dsl/Cargo.toml` and 20 touch
# `versions.toml` — against 200 runs created today. A busy day of merges now
# creates no run at all, so there is nothing for a later push to supersede.
#
# WHAT STILL HAS TO BE TRUE, AND WHERE IT IS CHECKED
#
# Neither half proves the publish HAPPENED. A run can still be left unapproved
# forever, and this file cannot see that. `tools/check-dsl-version-published.py`
# is the half that can: on every pull request it refuses a change that moves the
# dsl crate's number away from a number crates.io does not hold, so a bump whose
# publish never ran is a red on the next bump instead of a number no stranger can
# resolve.

on:
  push:
    branches: [main]
    # See THE TRIGGER above. `plan` reads the version out of `versions.toml` and
    # the crate states it in `crates/dsl/Cargo.toml`; a push touching neither
    # cannot change this workflow's answer, and a run it creates can only get in
    # the way of one that could.
    paths:
      - versions.toml
      - crates/dsl/Cargo.toml
  # THE REMEDY THIS FILE'S OWN GATE NAMES has to be reachable. When
  # `tools/check-dsl-version-published.py` refuses a bump because the number
  # being retired never landed, the fix is to publish that number — and if no run
  # was ever created for it, or its run is too old to re-run, a narrowed trigger
  # would leave no way to do it at all short of an engine release. This is that
  # way: it runs `plan` against the chosen ref and reaches `publish` only when the
  # registry does not already hold that ref's number, under the same approval.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per commit — see A SHARED CONCURRENCY GROUP above. A shared group
  # plus a job that waits for a human is a queue of length one that discards
  # everything behind it, which is how 21 runs were cancelled with zero jobs.
  group: dsl-crate-publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: does the dsl crate's number move
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { key: "dsl-crate-publish" }
      # versions.toml is the single source of truth (spec-0005), and the version
      # about to be published is read out of it. A tree that disagrees with
      # itself about the dsl_version must not reach the registry with either
      # answer.
      - name: consumers agree with versions.toml
        run: bash validation/check-versions.sh
      - name: ask the registry what it already holds
        id: plan
        run: |
          set -euo pipefail
          # The status is captured before anything reads the output: a plan that
          # refused (the version is on crates.io with different bytes) must red
          # here, not be parsed for a verdict it never reached.
          rc=0
          bash tools/crates-io-publish.sh --plan --only delvewright-dsl > plan.txt 2>&1 || rc=$?
          cat plan.txt
          [ "$rc" -eq 0 ] || exit "$rc"
          # The script's one machine-readable line. Reading it is what keeps the
          # index lookup in one place instead of copied into this workflow.
          list="$(sed -n 's/^crates-io-publish: TO_PUBLISH=//p' plan.txt)"
          version="$(python3 -c 'import sys,tomllib;sys.stdout.reconfigure(newline="\n");print(tomllib.load(open("versions.toml","rb"))["engine"]["dsl_crate_version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$list" ]; then
            echo "delvewright-dsl $version is already on crates.io, byte-identical — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "delvewright-dsl $version is not on crates.io; asking for the publish approval."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: publish delvewright-dsl (owner approval)
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # THE gate. `crates-io` holds CARGO_REGISTRY_TOKEN and carries a required
    # reviewer, so the run pauses here. Read back from the API rather than
    # assumed: the environment has no deployment branch policy, so `main`
    # reaches it exactly as a `v*` tag does.
    environment: crates-io
    permissions:
      contents: read
      # Lets the first step read this run's own approval history.
      actions: read
    steps:
      - uses: actions/checkout@v4
      # FIRST, before anything that touches the outside world. An environment can
      # exist, hold the token and protect nothing; this reads the CONSEQUENCE —
      # whether this run was actually held for a human — instead of the setting.
      - name: the gate actually bound (a run nobody approved must not publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/assert-run-approved.sh crates-io
      - uses: Swatinem/rust-cache@v2
        with: { key: "dsl-crate-publish" }
      # Packages the crate itself, compares its sha256 with the registry's,
      # uploads only what is absent, and polls until the index serves our exact
      # bytes. Re-running it after a half-finished run is safe by construction.
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash tools/crates-io-publish.sh --publish --only delvewright-dsl
