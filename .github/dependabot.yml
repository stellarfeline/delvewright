# Dependency updates for a PUBLIC repository (ADR-0017), and the half of supply
# chain hygiene that OPENS a pull request. The half that REFUSES is the
# `cargo audit` and `npm audit` steps inside `rust (fmt, clippy, test)` and
# `harness (typecheck, test)`: an advisory reds those jobs, which is what stops
# something shipping. This file is what makes the remedy reachable, and a gate
# whose remedy nobody can reach is half a gate.
#
# THE POPULATION IS DERIVED, NEVER REMEMBERED. Nine cargo workspaces live in
# this tree — the root (every crate under `crates/`), seven prefab generators,
# and one docs experiment — and a workspace member is covered by its
# workspace root, so the entries below are one per workspace and not one per
# crate. `tools/tests/test_dependabot_coverage.py` asserts that set against
# `git ls-files '*Cargo.toml'`, so a generator added next month reds until it is
# listed. That test is the reason this file may be an explicit list at all: a
# glob would have been derived and silent, and a glob matching nothing is the
# unbound vacuity mode wearing the derivation's clothes.
#
# Grouped and weekly on purpose. An ungrouped daily schedule on ten manifests is
# a pull request stream nobody reads, and a review nobody performs is the state
# this repository refuses everywhere else.
version: 2
updates:
  # ---------------------------------------------------------------- cargo --
  - package-ecosystem: cargo
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      cargo-engine:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: "/prefabs/generator"
    schedule: { interval: weekly }
    groups:
      cargo-generator:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: "/prefabs/cave-generator"
    schedule: { interval: weekly }
    groups:
      cargo-cave-generator:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: "/prefabs/gallery-generator"
    schedule: { interval: weekly }
    groups:
      cargo-gallery-generator:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: "/prefabs/hello-room-generator"
    schedule: { interval: weekly }
    groups:
      cargo-hello-room-generator:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: "/prefabs/island-generator"
    schedule: { interval: weekly }
    groups:
      cargo-island-generator:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: "/prefabs/island-terrain-generator"
    schedule: { interval: weekly }
    groups:
      cargo-island-terrain-generator:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: "/prefabs/tidal-keep-generator"
    schedule: { interval: weekly }
    groups:
      cargo-tidal-keep-generator:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: "/docs/experiments/m2-jigsaw-seed-stability/generator"
    schedule: { interval: weekly }
    groups:
      cargo-jigsaw-experiment:
        patterns: ["*"]

  # ------------------------------------------------------------------ npm --
  # The harness is the only npm manifest this repository holds, and it declares
  # `^` ranges over a committed lockfile — so what actually ships is whatever the
  # lockfile pins, and nothing was watching it.
  - package-ecosystem: npm
    directory: "/harness"
    schedule: { interval: weekly }
    groups:
      harness-npm:
        patterns: ["*"]

  # -------------------------------------------------------- github-actions --
  # Every action this repository runs is held at a major tag (`.github/pins.toml`,
  # policy `floating`), which means a tag can move under CI with nothing in any
  # diff. Dependabot is what turns that into a reviewed edit.
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
