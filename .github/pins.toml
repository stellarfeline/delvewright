# ---------------------------------------------------------------------------
# Refs that move on purpose
# ---------------------------------------------------------------------------
# Third-party actions are held at their MAJOR tag, which the publisher advances.
# That is a deliberate trade — patch fixes arrive without a PR, and the trust
# boundary is the publisher rather than a digest. It is registered so the trade
# is a visible count instead of an unexamined habit: eight refs, all first-party
# GitHub or Docker, none reaching a repository this project builds.

