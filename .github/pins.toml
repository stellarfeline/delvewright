# THE PIN REGISTRY — every literal in this repo that decides which version of an
# external thing gets fetched, with the policy that says whether it may drift.
#
# `tools/check-pins.py` reads this file. It discovers pins by SHAPE across every
# file kind that can execute or be resolved from, so an entry is not how a pin
# becomes visible — a pin is visible whether or not anyone registers it, and an
# unregistered one is a red. What the entry adds is the DECISION: what this pin
# is, and on what terms it is allowed to sit still.
#
# The reason lives here rather than in a comment beside the value because a
# comment is not read by anything. A pin that has rotted and a pin that is frozen
# on purpose look identical in a diff; only a machine-checked policy tells them
# apart.
#
# POLICIES
#   release   — names a commit a v<semver> tag points at. Verified online against
#               the tags of the repo it names. A released delve reproduces through
#               its own pinned engine, so such a pin must never move and drift is
#               not a finding.
#   track     — names a commit of a repository this project builds. Must be an
#               ancestor of that repo's default branch, must carry `reviewed`
#               (the upstream revision it was last judged against), and must name
#               `judged_by`, the file whose CI job runs its online check. If any
#               commit touching the sources the site BUILDS out of the pinned
#               checkout landed after `reviewed`, the pin has not been looked at
#               since its instrument changed, and that is a red.
#   immutable — a content-addressed name for third-party bytes: an image digest,
#               a jar checksum, a commit of a third-party repository. Currency is
#               a supply-chain question with a different owner; this gate does not
#               pretend to answer it, and says so rather than passing silently.
#   floating  — a ref that moves on purpose: a third-party action held at its
#               major tag, or a toolchain held at a major/minor line the
#               publisher advances. Registered so that the number of
#               deliberately-unfrozen refs is visible instead of habitual.
#
# `builds` is the package names the site file builds out of the pinned checkout.
# It is not a watch list an author writes: the online check derives the watched
# source directories from those packages in the upstream tree, and the offline
# check reds if a `cargo build … -p <pkg>` in a site is missing from `builds`.
#
# DISCOVERY IS BY SCHEMA, AND MEMBERSHIP IS DECIDED BY DISCOVERY RATHER THAN BY
# IMPORTANCE. An entry exists because something FOUND the value and demanded a
# decision for it; appending one by hand for a value no schema reaches is the
# enumeration-somebody-remembered defect this file's own checker refuses. Four
# schemas reach a value that has no shape of its own — a manifest whose kind
# fixes the key (`rust-toolchain.toml`'s `[toolchain] channel`), a Python package
# manifest, an action's input contract (the setup-node / setup-python actions
# exist in order to fetch the version their input names), and an install command
# in a step this repository RUNS. Each is a positive claim about a schema, true
# anywhere, so the set can only ever be incomplete in the direction of finding
# LESS — and a package argument with no exact version is a finding rather than a
# pin, because there is no value for an entry to record.
#
# `bound_by` + `bound_key` are for a value the shape scan cannot see. A hash or a
# ref is found wherever it sits, so `sites` is both the discovery record and the
# decision; a VERSION STRING carries no shape distinguishing it from data, so the
# decision is owed exactly where discovery is impossible. Such an entry names the
# checker that holds its sites equal and the key that checker reads the value
# under, and check-pins.py verifies all three things a drifted pin could not
# supply: the file really reads that key, it really names every declared site,
# and a workflow really runs it. Every declared site is then asserted to carry
# the value as a whole token.
#
# WHICH PAIR OF FIELDS AN ENTRY OWES IS NOT A CHOICE. The arm is read off the
# value: a value with a pin shape may not declare `bound_by` (it would be the
# weaker claim about an object that supports the stronger one), and a value
# without one may not omit it (`sites` alone would be untestable). Where the
# fetch itself is keyed — rustup reads `[toolchain] channel` and downloads it —
# discovery reaches the site anyway, and that is what keeps an unregistered
# version-string pin a red rather than a silence.

# ---------------------------------------------------------------------------
# The toolchain this repository is built with
# ---------------------------------------------------------------------------
# Named by VERSION rather than by bytes, so it is the entry that reaches both
# ways: discovery finds it at rust-toolchain.toml, the one site where the string
# CAUSES a fetch, and `bound_by` covers the three that restate it.

[[pin]]
id = "rust-toolchain"
value = "1.97.1"
sites = [
    "Cargo.toml",
    "crates/dsl/Cargo.toml",
    "rust-toolchain.toml",
    "versions.toml",
]
policy = "immutable"
bound_by = "validation/check-versions.sh"
bound_key = "rust_toolchain"
why = """
The Rust toolchain every artifact this project ships is built with. The channel
in rust-toolchain.toml is the copy rustup obeys — it binds inside git worktrees
too, and no workflow overrides it, so CI and a creator's own clone build on the
same compiler. versions.toml restates it, the root manifest's `[workspace.package]` carries it
as the `rust-version` floor every engine crate inherits, and the DSL crate's
manifest carries its own; validation/check-versions.sh holds those four equal,
and tools/check-reference-versions.py holds every crate README's "Rust 1.97.1
or newer" line equal to them in turn.

HELD FOR one instrument, constant across time and machines. ADR-0006's
double-build gate compares two compiles made by the SAME binary, so it cannot see
a toolchain change at all; what makes a byte-identity result from one month
comparable to the next is that this string did not move. The same goes for every
measured figure in docs/reference/distribution-size.md, each taken "on rustc
1.97.1" — moving the pin silently re-reads all of them against a different
instrument.

DRIFT COSTS three things, none of which reds where the change was made.
`cargo clippy -D warnings` is a required status check, so a toolchain carrying
new lints reds every open pull request at once, for work unrelated to any of
them. A codegen or float-formatting change moves emitted bytes with nothing
anywhere saying the instrument moved. And a `rust-version` looser than what
anybody has actually built on is an untested promise, discovered by a stranger
running `cargo install`.

RIGHT TO MOVE — and it is allowed to move, because a released delve reproduces
through its own pinned engine (versions.toml + OCI) rather than through eternal
byte-stable emission, so freezing this forever was never the requirement. The
terms: a bump is its own explicit, proof-carrying round and never a side effect
of another change, and it moves all four sites in one commit, which
check-versions.sh already refuses to let anyone do by halves.

POLICY `immutable`. rust-lang never republishes a point release, so 1.97.1 names
a fixed set of published artifacts rather than a moving ref, and rustup verifies
their bytes against its own signed manifests — the content-addressing is one
layer down, held by the publisher. Whether 1.97.1 is still CURRENT is a
supply-chain question with a different owner, which this gate declines rather
than answers. Not `floating`: that is for a ref that moves on purpose, and this
one does not move. Not `track` or `release`: both judge a pin against the history
of a repository this project builds, and rust-lang/rust is not one.

THE SHAPE SCAN CANNOT SEE IT. A semantic version carries nothing that separates
it from data: 1.97.1 stands in five other tracked files as a measurement someone
recorded, and a scan for the literal would call each of them a site. So the two
obligations a registry entry carries come apart here — nothing discovers the
value, and the decision is owed for exactly that reason — and each is met by its
own means. rust-toolchain.toml is discovered by its KEY, because rustup fetches
what `[toolchain] channel` names and that file exists for nothing else; an
unregistered toolchain is therefore a red like any other pin. The three sites
that RESTATE the value are covered by `bound_by`: check-versions.sh reads it as
[engine].rust_toolchain and holds the channel, both `rust-version` floors and the
manifest equal, ci.yml runs it, and check-pins.py verifies each of those three
facts and then that the value stands as a whole token at every site.
"""

