beet, the library mecha validates through, and the second instrument of the same
required check.

WHY THIS ENTRY EXISTS AT ALL: it was installed UNPINNED, on the same command line
as a pinned mecha. `CLAUDE.md` says a frozen measurement names its instrument
literally, by revision, never by indirection — an unpinned instrument inside a
required gate is that rule inverted, and the gate's verdict could change with
nothing in any diff to show what moved. The general form of that finding is not
this entry but the discovery rule beside it: an install command in a step this
repository RUNS, whose package argument names no exact version, is now a finding
in its own right, so the next one reds rather than waiting to be remembered.

CHOSEN AS the version the unpinned line already resolved to, so pinning changed
nothing that was running and froze what was already there. Established two ways
whose failure modes are unrelated: it is PyPI's current release, and it is
exactly the floor mecha declares (`beet>=0.116.0`), so no other version could
have been selected. check-versions.sh holds this value at or above that recorded
floor.

POLICY `immutable`, on the same published-artifact argument as `mecha`.
"""

[[pin]]
id = "pytest"
value = "9.1.1"
sites = [".github/workflows/ci.yml", "versions.toml"]
policy = "immutable"
bound_by = "validation/check-versions.sh"
bound_key = "pytest_version"
why = """
The test runner both Python suites are judged by — `skin toolchain (pytest)` and
`i18n translation tool (pytest)`, each a required status check.

WHY IT IS AN INSTRUMENT and not a detail: a runner decides what gets COLLECTED
and how an assertion is reported, so a runner that changes either moves a
required check's verdict without any test changing. It was unpinned on two
command lines, which is the same defect as `beet` and was found by the same rule
rather than by remembering it separately.

CHOSEN AS the version the unpinned line already resolved to — confirmed by
resolving it (a real `pip install pytest` into a fresh virtual environment) and,
independently, from the release index. Pinning changed nothing that was running.

POLICY `immutable`, on the same published-artifact argument as `mecha`. A bump is
an ordinary reviewed edit; what it may not be is silent.
"""

# ---------------------------------------------------------------------------
# The skin toolchain's one third-party dependency
# ---------------------------------------------------------------------------

[[pin]]
id = "skinpy-extended"
value = "1.0.1"
sites = [
    "tools/skin/delve_skin/catalog.py",
    "tools/skin/pyproject.toml",
    "tools/skin/requirements.txt",
    "versions.toml",
]
policy = "immutable"
bound_by = "validation/check-versions.sh"
bound_key = "skinpy_extended"
why = """
skinpy-extended (MIT, ADR-0013 allowlist): the part/face-addressable composer and
the pure-Python isometric preview renderer `tools/skin` is built on (spec-0009).

HELD FOR byte-identity. The suite's whole claim is that one cast entry produces
one PNG (ADR-0006), so a different library version is a different picture under
the same declared version — and `tools/skin/delve_skin/compose.py` states its
face-coordinate convention as verified against THIS release, which is a frozen
measurement naming its instrument.

FOUR SITES, and the fourth is why the binder matters. Two are manifests, now
discovered by their file kind. The third is `catalog.py`, which stamps the
library name and version into every emitted provenance record — a bump that
missed it would ship metadata naming a library that did not draw the picture, and
nothing would have been red. The fourth is the manifest restatement. What is
deliberately NOT a site is the sentence in `compose.py` recording which release
the coordinate convention was verified against: that is a measurement's
instrument name and must NOT move with the pin, because moving it would rewrite
a record of when something was checked.

POLICY `immutable`, on the same published-artifact argument as `mecha`. Its
currency is a supply-chain question with a different owner, and this gate
declines it rather than passing silently.
"""
