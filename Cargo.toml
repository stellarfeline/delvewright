[workspace]
resolver = "3"
members = [
    "crates/dsl",
    "crates/compiler",
    "crates/grammar",
    "crates/schem",
    "crates/admit",
    "crates/orchestrator",
    "crates/render",
    "crates/delvec",
]

# The ENGINE version line (ADR-0016 line 2, ADR-0023 §6): every crate under
# `crates/` except `delvewright-dsl` inherits this one number, and it is the
# number the git tag, the crates.io versions and the skill's `requires.delvec`
# window must all equal. `validation/check-versions.sh` binds it to
# `versions.toml [engine].version`; `.github/workflows/engine-release.yml`
# refuses a `v*` tag whose name disagrees with it. `delvewright-dsl` is
# deliberately on its own line (see crates/dsl/Cargo.toml).
[workspace.package]
version = "1.1.0"
edition = "2024"
# The toolchain this repo actually builds and tests on (rust-toolchain.toml).
# Asserted equal to that pin by check-versions.sh: a `rust-version` looser than
# what anybody has run is an untested claim, and `cargo install` is where a
# stranger discovers it.
rust-version = "1.97.1"
license = "GPL-3.0-only"
repository = "https://github.com/stellarfeline/delvewright"

# One declaration per in-tree crate, so a member says `name.workspace = true`
# and nothing else. `version` is REQUIRED beside `path` for publication: a
# path-only dependency cannot be packaged (`cargo package` refuses it, by name),
# and crates.io drops the `path` key — so on the registry the `=` requirement
# is the ONLY thing left standing, and `=` so that one engine version resolves
# to exactly one build of each crate and no other. Every `=` here is bound to
# `[workspace.package] version` above by check-versions.sh, except the DSL
# crate's, which is bound to `[engine] dsl_crate_req` in versions.toml.
[workspace.dependencies]
delvewright-dsl = { path = "crates/dsl", version = "=0.1.0" }
delvewright-compiler = { path = "crates/compiler", version = "=1.1.0" }
delvewright-grammar = { path = "crates/grammar", version = "=1.1.0" }
delvewright-schem = { path = "crates/schem", version = "=1.1.0" }
delvewright-admit = { path = "crates/admit", version = "=1.1.0" }
delvewright-orchestrator = { path = "crates/orchestrator", version = "=1.1.0" }
delvewright-render = { path = "crates/render", version = "=1.1.0" }

# An unoptimized `delvec` is unusable on a real campaign, and nothing used to say
# so: `cargo build` hands you `target/debug/delvec`, and on `nobodys-cave-island`
# that binary takes 12m51s where the release one takes 25s — a 30x gap that reads
# as "the compiler hung", not as "wrong profile". Two sessions lost time to it on
# 2026-08-06 before the profile was measured rather than guessed at.
#
# `opt-level = 1` is the setting that makes the pitfall stop existing instead of
# documenting it (CLAUDE.md debug doctrine: a tooling default beats a doc line).
# It is nearly free on the loop that actually matters — an incremental rebuild of
# `crates/compiler` costs 1.8s at opt-level 1 vs 1.9s at opt-level 0, because the
# cost is codegen for the crate that changed, not the whole graph. `--release`
# stays available and is still the fastest binary, but it costs 20s per
# incremental rebuild, so it is the wrong default for an edit-compile-run loop.
#
#   island build   debug(0) 771s · dev(1) 46s · release(3) 25s
#   incr. rebuild  debug(0) 1.9s · dev(1) 1.8s · release(3) 20s
#
# Determinism (ADR-0006) is unaffected and this is measured, not assumed: all
# three profiles emit byte-identical output over the island's 594 files.
# Full method + phase breakdown: docs/notes/build-profile-measurements.md.
#
# `debug` is the profile's other key, and cargo's default for it is full DWARF.
# That default is expensive here for a reason particular to this workspace:
# `cargo test --workspace` builds 216 test executables, and complete debuginfo —
# every local variable of every function — is emitted and linked once for each of
# them, describing state nothing in this repository reads. There is no debugger in
# the toolchain: `lldb`, `gdb`, `dwarfdump`, `addr2line` and `dsymutil` appear in
# no script or job, and `std::backtrace`, `#[track_caller]` and `RUST_BACKTRACE`
# appear zero times across all seven crates' `src/` and `tests/`.
#
# `line-tables-only` keeps what a failing test needs, and that is measured rather
# than asserted: a panicking test under `RUST_BACKTRACE=full` prints 46 frames of
# which 45 carry a `file:line` under BOTH settings, and those 45 source locations
# are byte-identical. What it gives up is variable inspection under a debugger,
# which `CARGO_PROFILE_DEV_DEBUG=full cargo build` hands back for a session that
# wants it. Cold `cargo test --workspace --no-run`, two runs per condition, CPU
# (user+sys) rather than wall clock because repeats spread 1-2% in CPU and 7-20%
# in wall on a machine carrying other work:
#
#   debug  full (cargo default)   862.8s CPU · target/ 5.58 GiB
#   debug  "line-tables-only"     714.5s CPU · target/ 4.57 GiB   -17.2% · -18%
#   debug  0                      662.4s CPU · target/ 3.61 GiB
#
# `debug = 0` is measured and refused: the further 7.0% it buys is paid for with
# the `file:line` above, which is the only thing this debuginfo is for.
#
# `incremental` is deliberately NOT set, and that is measured too. It reads as the
# obvious next saving — a cold build is 38.5s CPU cheaper without it and `target/`
# 43% smaller — but a cold build is not the population. One function added to
# `crates/compiler` and rebuilt costs 60.8s CPU with incremental and 265.7s
# without, so the cold saving is repaid after 0.19 rebuilds and every rebuild
# after that is a loss; this profile exists for the edit-compile-run loop. Nor
# would it reach CI, where the cold builds actually are: all 12 jobs across the
# five workflows that compile under a dev profile run `Swatinem/rust-cache` before
# their first build, and it exports `CARGO_INCREMENTAL=0` unconditionally — an
# environment variable that overrides this key in both directions.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
