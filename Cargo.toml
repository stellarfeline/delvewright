[workspace]
resolver = "3"
members = [
    "crates/dsl",
    "crates/grammar",
    "crates/compiler",
    "crates/orchestrator",
    "crates/schem",
    "crates/admit",
]

# `crates/render` is its own workspace (it carries a `[workspace]` table of its
# own), and this line is what keeps it out of THIS one's resolution.
#
# A git dependency is loaded during RESOLUTION of the workspace that declares it,
# not during the build of the crate that uses it: cargo must read the manifest at
# the pinned rev to validate `Cargo.lock`, so it clones before it decides what to
# compile. `delvewright-render` pins Nucleation by git rev (`versions.toml
# [render]`, and no crates.io release carries the `rendering` feature). Inside
# this workspace that made EVERY cargo command in the repo — `cargo run -p delvec`
# included, which never builds render — clone 227 MB from two repositories it does
# not use, before doing anything. That put five required status checks behind a
# network reach they have no use for, and a transient TLS failure on that reach
# reddened `tier 2` on a docs-only PR (`the SSL certificate is invalid;
# class=Ssl (16)`), a shape this repo already refuses at two other sites (the
# `docs` job's `lychee --offline`; the server-bootstrap overlay's single Mojang
# fetch).
#
# Scope is the only lever that works here, and this is measured rather than
# assumed: a workspace resolves ALL its members, so neither `-p delvec` nor
# `--locked` narrows it, and marking the dependency `optional` does not either —
# an optional dependency is still resolved, so cargo still clones it. Excluding
# the crate is what removes the reach; `tools/check-workspace-git-deps.py` is what
# keeps it removed.
#
# The render crate keeps full fmt/clippy/test coverage — the `rust` job runs them
# against `crates/render/Cargo.toml` behind one explicitly named fetch step.
exclude = ["crates/render"]

# An unoptimized `delvec` is unusable on a real campaign, and nothing used to say
# so: `cargo build` hands you `target/debug/delvec`, and on `nobodys-cave-island`
# that binary takes 12m51s where the release one takes 25s — a 30x gap that reads
# as "the compiler hung", not as "wrong profile". Two sessions lost time to it on
# 2026-08-06 before the profile was measured rather than guessed at.
#
# `opt-level = 1` is the setting that makes the pitfall stop existing instead of
# documenting it (CLAUDE.md debug doctrine: a tooling default beats a doc line).
# It is nearly free on the loop that actually matters — an incremental rebuild of
# `crates/compiler` costs 1.8s at opt-level 1 vs 1.9s at opt-level 0, because the
# cost is codegen for the crate that changed, not the whole graph. `--release`
# stays available and is still the fastest binary, but it costs 20s per
# incremental rebuild, so it is the wrong default for an edit-compile-run loop.
#
#   island build   debug(0) 771s · dev(1) 46s · release(3) 25s
#   incr. rebuild  debug(0) 1.9s · dev(1) 1.8s · release(3) 20s
#
# Determinism (ADR-0006) is unaffected and this is measured, not assumed: all
# three profiles emit byte-identical output over the island's 594 files.
# Full method + phase breakdown: docs/notes/build-profile-measurements.md.
[profile.dev]
opt-level = 1
